  ctx.globalAlpha = 1;

  // 城墙
  const wy = F.gateY - 10;
  ctx.fillStyle = P.line;
  ctx.fillRect(0, wy - 2, F.w, 52);
  ctx.fillStyle = P.stone;
  ctx.fillRect(0, wy, F.w, 48);
  ctx.fillStyle = P.stoneHi;
  ctx.fillRect(0, wy, F.w, 4);
  ctx.fillStyle = P.mortar;
  for (let row = 0; row < 4; row++) {
    const yy = wy + 8 + row * 10;
    ctx.fillRect(0, yy, F.w, 1.5);
    for (let x = (row % 2) * 12; x < F.w; x += 24) ctx.fillRect(x, yy - 10, 1.5, 10);
  }
  // 垛口
  for (let x = 4; x < F.w; x += 30) {
    if (Math.abs(x + 9 - F.w / 2) < 40) continue;
    ctx.fillStyle = P.line;
    ctx.fillRect(x - 1, wy - 15, 20, 15);
    ctx.fillStyle = P.stone;
    ctx.fillRect(x, wy - 14, 18, 14);
    ctx.fillStyle = P.stoneHi;
    ctx.fillRect(x, wy - 14, 18, 3);
  }
  // 城门
  const gx = F.w / 2;
  ctx.fillStyle = P.line;
  roundRect(ctx, gx - 30, wy - 26, 60, 76, 26);
  ctx.fill();
  ctx.fillStyle = P.brassLo;
  roundRect(ctx, gx - 27, wy - 23, 54, 73, 23);
  ctx.fill();
  ctx.fillStyle = '#0c0706';
  roundRect(ctx, gx - 20, wy - 16, 40, 66, 18);
  ctx.fill();
  ctx.fillStyle = P.brassHi;
  for (let k = 0; k < 5; k++) ctx.fillRect(gx - 25, wy - 10 + k * 12, 3, 3), ctx.fillRect(gx + 22, wy - 10 + k * 12, 3, 3);
  // 城门上的灯
  for (const lx of [gx - 44, gx + 44]) {
    ctx.fillStyle = P.line;
    ctx.fillRect(lx - 6, wy - 34, 12, 16);
    ctx.fillStyle = '#ff9a3c';
    ctx.fillRect(lx - 4, wy - 32, 8, 12);
    ctx.fillStyle = '#ffe08a';
    ctx.fillRect(lx - 2, wy - 30, 4, 5);
  }

  // 城墙后的走道（阿铸在这儿左右走）
  ctx.fillStyle = P.walk;
  ctx.fillRect(0, wy + 48, F.w, F.h - wy);
  ctx.fillStyle = P.walkLo;
  for (let x = 0; x < F.w; x += 40) ctx.fillRect(x, wy + 48, 1.5, F.h);
  ctx.fillRect(0, wy + 80, F.w, 1.5);
  ctx.fillRect(0, wy + 112, F.w, 1.5);
}

// —— 龙 ——
function fmtHp(v) {
  v = Math.ceil(v);
  if (v >= 10000) return Math.round(v / 1000) + 'k';
  if (v >= 1000) return (v / 1000).toFixed(1) + 'k';
  return '' + v;
}

function drawSeg(ctx, g, t, isTail) {
  const R = C.DRAGON.r;
  const wob = Math.sin(t * 6 + g.id * 0.9) * 0.8;
  const pop = 1 + Math.max(0, g.flash) * 2.2; // 打中那一下鼓一下
  ctx.save();
  ctx.translate(g.x, g.y + wob);
  ctx.scale(pop, pop);
  if (g.chest) {
    // 机关匣：朱漆方匣 + 金箍 + 齿轮
    ctx.rotate(g.a || 0);
    ctx.fillStyle = P.line;
    roundRect(ctx, -R - 2, -R - 2, 2 * R + 4, 2 * R + 4, 6);
    ctx.fill();
    ctx.fillStyle = P.lac;
    roundRect(ctx, -R, -R, 2 * R, 2 * R, 5);
    ctx.fill();
    ctx.fillStyle = P.lacLo;
    ctx.fillRect(-R, R - 7, 2 * R, 7);
    ctx.fillStyle = P.lacHi;
    ctx.fillRect(-R + 3, -R + 2, 2 * R - 6, 3);
    ctx.fillStyle = P.gold;
    ctx.fillRect(-R, -2, 2 * R, 4);
    ctx.fillRect(-2, -R, 4, 2 * R);
    const glow = 0.5 + 0.5 * Math.sin(t * 8 + g.id);
    ctx.fillStyle = mix('#ffd65a', '#fff7d0', glow);
    ctx.beginPath();
    ctx.arc(0, 0, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  } else if (g.ram) {
    // 攻城槌（龙尾最后一节，三倍血）：铁色、更大、往后一根尖刺
    ctx.rotate((g.a || 0) + Math.PI);
    ctx.fillStyle = P.line;
    ctx.beginPath();
    ctx.moveTo(R + 1, -9);
    ctx.lineTo(R + 20, 0);
    ctx.lineTo(R + 1, 9);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, 0, R + 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#6b7080';
    ctx.beginPath();
    ctx.arc(0, 0, R + 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#3c3f4a';
    ctx.beginPath();
    ctx.arc(-4, 5, R, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#6b7080';
    ctx.beginPath();
    ctx.arc(1, -1, R - 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#a9afbf';
    ctx.fillRect(-7, -R + 3, 9, 3);
    ctx.fillStyle = '#9aa0b0';
    ctx.beginPath();
    ctx.moveTo(R + 2, -5);
    ctx.lineTo(R + 15, 0);
    ctx.lineTo(R + 2, 5);
    ctx.fill();
    ctx.fillStyle = P.red;
    ctx.fillRect(-2, -2, 4, 4);
    ctx.restore();
  } else {
    ctx.fillStyle = P.line;
    ctx.beginPath();
    ctx.arc(0, 0, R + 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = P.brass;
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.fill();
    // 硬阴影（右下）
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = P.brassLo;
    ctx.beginPath();
    ctx.arc(5, 6, R, 0, Math.PI * 2);
    ctx.rect(-40, -40, 80, 80);
    ctx.fill('evenodd');
    ctx.restore();
    ctx.fillStyle = P.brassHi;
    ctx.fillRect(-R + 5, -R + 5, 7, 3);
    ctx.fillRect(-R + 4, -R + 8, 3, 4);
    // 铆钉，跟着走的方向转
    ctx.fillStyle = P.line;
    for (let k = 0; k < 4; k++) {
      const a = (g.a || 0) + (k * Math.PI) / 2 + Math.PI / 4;
      ctx.fillRect(Math.cos(a) * (R - 3) - 1.5, Math.sin(a) * (R - 3) - 1.5, 3, 3);
    }
    if (isTail) {
      ctx.rotate((g.a || 0) + Math.PI);
      ctx.fillStyle = P.line;
      ctx.beginPath();
      ctx.moveTo(R - 2, -7);
      ctx.lineTo(R + 13, 0);
      ctx.lineTo(R - 2, 7);
      ctx.fill();
      ctx.fillStyle = P.brassLo;
      ctx.beginPath();
      ctx.moveTo(R - 1, -4);
      ctx.lineTo(R + 9, 0);
      ctx.lineTo(R - 1, 4);
      ctx.fill();
    }
    ctx.restore();
  }
  if (g.flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(g.x, g.y + wob, R + 1, 0, Math.PI * 2);
    ctx.fill();
  }
  // 血（数字）
  ctx.save();
  ctx.font = '900 11px "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 3;
  ctx.strokeStyle = P.line;
  const txt = fmtHp(g.hp);
  ctx.strokeText(txt, g.x, g.y + wob + 0.5);
  ctx.fillStyle = '#fffaf0';
  ctx.fillText(txt, g.x, g.y + wob + 0.5);
  ctx.restore();
}

function drawHead(ctx, g, t, danger) {
  // 龙头：在最前面那节前方，朝走的方向
  const a = g.a || 0;
  const R = C.DRAGON.r;
  const hx = g.x + Math.cos(a) * (R + 9);
  const hy = g.y + Math.sin(a) * (R + 9);
  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(a);
  const flip = Math.cos(a) < -0.1 ? -1 : 1;
  ctx.scale(1, flip);
  const jaw = Math.sin(t * 7) > 0.6 ? 3 : 0;
  ctx.fillStyle = P.line;
  ctx.fillRect(-12, -12, 26, 20);
  ctx.fillRect(10, -8, 10, 12 + jaw);
  ctx.fillRect(-14, -18, 6, 8);
  ctx.fillRect(-6, -20, 6, 9);
  ctx.fillStyle = P.brass;
  ctx.fillRect(-10, -10, 22, 16);
  ctx.fillRect(10, -6, 8, 6);
  ctx.fillStyle = P.brassLo;
  ctx.fillRect(-10, 2, 22, 4);
  ctx.fillRect(10, 2 + jaw, 8, 3);
  ctx.fillStyle = P.brassHi;
  ctx.fillRect(-8, -10, 14, 3);
  ctx.fillStyle = P.brassLo;
  ctx.fillRect(-13, -17, 4, 6);
  ctx.fillRect(-5, -19, 4, 7);
  // 眼睛
  ctx.fillStyle = danger > 0 ? '#ffffff' : P.red;
  ctx.fillRect(2, -7, 5, 4);
  ctx.fillStyle = '#ffd0a0';
  ctx.fillRect(4, -7, 2, 2);
  // 牙
  ctx.fillStyle = '#f4ead8';
  ctx.fillRect(12, 0, 2, 3);
  ctx.fillRect(16, 0, 2, 3);
  ctx.restore();
}

function drawDragon(ctx, st, t) {
  const segs = st.segs;
  for (let i = segs.length - 1; i >= 0; i--) {
    const g = segs[i];
    if (g.y < -30) continue;
    drawSeg(ctx, g, t, i === segs.length - 1 && segs.length > 1);
  }
  if (segs.length && segs[0].y > -30) drawHead(ctx, segs[0], t, st.danger);
}

// 箭的样子跟着武器「多重」变：黄铜 → 银蓝 → 金光 → 红热带火尾
const BOLT = [
  { core: P.brassHi, tip: '#fff6c8', len: 12, w: 2.4, trail: 0 },
  { core: '#cfe6ff', tip: '#ffffff', len: 14, w: 2.8, trail: 18, tc: '120,190,255' },
  { core: P.gold, tip: '#fffbe0', len: 16, w: 3.2, trail: 26, tc: '255,214,90', glow: 'rgba(255,214,90,0.35)' },
  { core: '#ff7a3a', tip: '#fff0b0', len: 18, w: 3.6, trail: 34, tc: '255,110,50', glow: 'rgba(255,100,40,0.4)' },
];
function boltTier(tier) {
  return BOLT[tier >= 7 ? 3 : tier >= 4 ? 2 : tier >= 2 ? 1 : 0];
}
function drawBullets(ctx, st) {
  const B = boltTier(st.mods.tier || 0);
  for (const u of st.bullets) {
    const a = Math.atan2(u.vy, u.vx);
    ctx.save();
    ctx.translate(u.x, u.y);
    ctx.rotate(a);
    if (B.trail) {
      ctx.fillStyle = 'rgba(' + B.tc + ',0.35)';
      ctx.fillRect(-B.len - B.trail, -B.w / 2, B.trail, B.w);
    }
    if (B.glow) {
      ctx.fillStyle = B.glow;
      ctx.fillRect(-B.len, -B.w * 1.5, B.len + 8, B.w * 3);
    }
    ctx.fillStyle = P.line;
    ctx.fillRect(-B.len + 3, -B.w / 2 - 1.2, B.len + 3, B.w + 2.4);
    ctx.fillStyle = u.bounced ? '#7dff9a' : B.core;
    ctx.fillRect(-B.len + 4, -B.w / 2, B.len, B.w);
    ctx.fillStyle = B.tip;
    ctx.fillRect(3, -B.w / 2 - 0.6, 4, B.w + 1.2);
    ctx.restore();
  }
}

// 伙伴在场上：跟着 st.pal 的位置和状态画
function drawPal(ctx, st, t) {
  const p = st.pal;
  if (!p) return;
  const b = st.buddy;
  // 冷却圈：待命时脚下一圈慢慢填满，满了就出手
  if (p.state === 'home' && b.cd) {
    const k = clamp(1 - p.cd / b.cd, 0, 1);
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(p.x, p.y + 14, 9, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = k >= 1 ? '#ffffff' : P.gold;
    ctx.beginPath();
    ctx.arc(p.x, p.y + 14, 9, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k);
    ctx.stroke();
  }
  if (b.id === 'que') {
    const flying = p.state !== 'home';
    if (flying) {
      // 金色尾迹
      ctx.fillStyle = 'rgba(255,214,90,0.35)';
      ctx.beginPath();
      ctx.arc(p.x - (p.fx || 0) * 10, p.y + 4, 6, 0, Math.PI * 2);
      ctx.fill();
    }
    const dip = p.state === 'peck' ? (p.t > 0.04 ? 4 : 0) : 0;
    if (flying) {
      ctx.fillStyle = 'rgba(255,240,190,0.35)';
      ctx.beginPath();
      ctx.arc(p.x, p.y + dip, 17, 0, Math.PI * 2);
      ctx.fill();
    }
    drawBuddy(ctx, 'que', p.x, p.y + dip, t * (flying ? 2.5 : 1), flying ? 1.8 : 1.4, (p.fx || 0) < 0);
  } else if (b.id === 'quan') {
    const air = p.state !== 'home';
    ctx.save();
    ctx.translate(p.x, p.y);
    if (air) ctx.rotate((p.fx || 1) * (p.state === 'leap' ? -0.5 : 0.4));
    drawBuddy(ctx, 'quan', 0, 0, air ? 0 : t, 1.4, (p.fx || 1) < 0);
    ctx.restore();
  } else if (b.id === 'gui') {
    const r = Math.max(0, p.recoil || 0) / 0.25;
    ctx.save();
    ctx.translate(p.x, p.y + r * 3);
    ctx.scale(1 + r * 0.15, 1 - r * 0.15);
    drawBuddy(ctx, 'gui', 0, 0, t, 1.4, true);
    ctx.restore();
  }
}

// 蒸汽龟的炮弹：高高的抛物线，落点先亮一个红圈（看得见要炸哪）
function drawShells(ctx, st) {
  for (const sh of st.shells) {
    const u = sh.t / sh.T;
    const R = st.buddy ? st.buddy.shellR : 60;
    ctx.globalAlpha = 0.3 + 0.4 * u;
    ctx.strokeStyle = P.red;
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.arc(sh.tx, sh.ty, R * (1.25 - 0.25 * u), 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    const x = sh.x0 + (sh.tx - sh.x0) * u;
    const y = sh.y0 + (sh.ty - sh.y0) * u - Math.sin(u * Math.PI) * 160;
    ctx.fillStyle = P.line;
    ctx.beginPath();
    ctx.arc(x, y, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#4a4f5c';
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff9a3c';
    ctx.fillRect(x - 1.5, y - 9, 3, 3 + Math.sin(sh.t * 40) * 1.5);
  }
}

// ================= 0.3：照风格库 LDR-S1E08-a 祝有好收获（细褐线、平涂一层硬影、黄铜一道白高光、一地一色）=================
const LINE = '#1E1A16';
const IMG = {}; // 生图到了以后 main.js 往这里放（读不到就用代码画）
function imgOk(k) {
  const im = IMG[k];
  return im && im.ok;
}
// 平涂圆 + 右下一块硬阴影 + 细线
function disc(ctx, x, y, r, base, shade, lw) {
  ctx.fillStyle = LINE;
  ctx.beginPath();
  ctx.arc(x, y, r + (lw || 1.4), 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = base;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.clip();
  ctx.fillStyle = shade;
  ctx.beginPath();
  ctx.rect(x - r - 2, y - r - 2, 2 * r + 4, 2 * r + 4);
  ctx.arc(x - r * 0.28, y - r * 0.34, r, 0, Math.PI * 2, true);
  ctx.fill();
  ctx.restore();
}
function streak(ctx, x, y, r) {
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.save();
  ctx.translate(x - r * 0.42, y - r * 0.42);
  ctx.rotate(-0.8);
  ctx.fillRect(-r * 0.32, -1.2, r * 0.64, 2.4);
  ctx.restore();
}

const FAM = {
  dragon: { base: '#9C7F42', shade: '#7F602C', hi: '#EFBE63' },
  centi: { base: '#4a5560', shade: '#30373f', hi: '#a9bccb' },
  terra: { base: '#a8693f', shade: '#7d4a2b', hi: '#d39a6a' },
};

// 0.5：边城的机关长龙一节节是蒸汽车厢（和玩法 A 的龙同一套样子）
function drawCarSeg(ctx, g, t, c) {
  const R = g.r;
  const a = (g.a || 0) + Math.PI / 2;
  ctx.save();
  ctx.translate(g.x, g.y);
  ctx.rotate(a);
  const s = R * 0.92;
  ctx.fillStyle = 'rgba(20,12,6,0.32)';
  roundRect(ctx, -s + 3, -s + 4, s * 2, s * 2, 5);
  ctx.fill();
  // 轮子
  ctx.fillStyle = LINE;
  for (const sx of [-s - 3, s]) {
    ctx.fillRect(sx, -s * 0.6, 3, s * 0.45);
    ctx.fillRect(sx, s * 0.2, 3, s * 0.45);
  }
  ctx.fillStyle = '#c9933a';
  ctx.strokeStyle = LINE;
  ctx.lineWidth = 1.8;
  roundRect(ctx, -s, -s, s * 2, s * 2, 5);
  ctx.fill();
  ctx.fillStyle = '#946224';
  ctx.fillRect(-s + 2, s - 6, s * 2 - 4, 4);
  ctx.stroke();
  ctx.fillStyle = '#6b4518';
  for (const [px, py] of [[-0.55, -0.55], [0.55, -0.55], [-0.55, 0.45], [0.55, 0.45]]) {
    ctx.beginPath();
    ctx.arc(px * s, py * s, 1.8, 0, Math.PI * 2);
    ctx.fill();
  }
  if (g.id % 3 === 1) {
    ctx.fillStyle = '#4a3220';
    ctx.fillRect(-3.5, -3.5, 7, 7);
    ctx.strokeRect(-3.5, -3.5, 7, 7);
    const k = (t * 1.6 + g.id * 0.37) % 1;
    ctx.fillStyle = 'rgba(240,236,228,' + (0.5 * (1 - k)) + ')';
    ctx.beginPath();
    ctx.arc(0, -4 - k * 10, 3 + k * 4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-s * 0.62, -s * 0.7);
  ctx.lineTo(-s * 0.62, 0);
  ctx.stroke();
  ctx.restore();
}

// 0.5：拆来的零件拼到城墙上——每件武器在城墙上立一座看得见的机关台；零件攒多了城墙包铜甲
const WALL_SLOTS = [44, 110, 250, 316];
function drawWallMachines(ctx, st, t, parts) {
  const F = C.FIELD;
  const wy = F.gateY - 10;
  // 铜甲：每 6 个零件包一块，最多 12 块
  const plates = Math.min(12, Math.floor(parts / 6));
  for (let i = 0; i < plates; i++) {
    const side = i % 2 ? 1 : -1;
    const k = Math.floor(i / 2);
    const x = side < 0 ? 4 + k * 22 : F.w - 26 - k * 22;
    ctx.fillStyle = LINE;
    ctx.fillRect(x - 1, wy + 9, 22, 30);
    ctx.fillStyle = '#c9933a';
    ctx.fillRect(x, wy + 10, 20, 28);
    ctx.fillStyle = '#946224';
    ctx.fillRect(x, wy + 32, 20, 6);
    ctx.fillStyle = '#6b4518';
    ctx.fillRect(x + 3, wy + 13, 2, 2);
    ctx.fillRect(x + 15, wy + 13, 2, 2);
    ctx.fillStyle = '#fff';
    ctx.fillRect(x + 3, wy + 17, 2, 10);
  }
  const ids = Object.keys(st.weapons).filter((id) => id !== 'bow');
  ids.forEach((id, i) => {
    if (i >= WALL_SLOTS.length) return;
    drawMachine(ctx, id, WALL_SLOTS[i], wy - 14, st.weapons[id], t);
  });
}

function drawMachine(ctx, id, x, y, lv, t) {
  const k = 1.05 + lv * 0.1;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(k, k);
  if (lv >= 5) {
    ctx.fillStyle = 'rgba(255,214,90,' + (0.25 + 0.15 * Math.sin(t * 6)) + ')';
    ctx.beginPath();
    ctx.arc(0, -10, 26, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.strokeStyle = LINE;
  ctx.lineWidth = 1.8;
  // 底座
  ctx.fillStyle = '#5a3d22';
  roundRect(ctx, -14, -4, 28, 10, 3);
  ctx.fill();
  ctx.stroke();
  if (id === 'blade') {
    // 铜轮机：一只转着的齿轮刃
    ctx.save();
    ctx.translate(0, -14);
    ctx.rotate(t * 6);
    ctx.fillStyle = '#d9a441';
    ctx.beginPath();
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const r = i % 2 ? 11 : 7;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  } else if (id === 'pot') {
    // 投石机：一根摆臂 + 罐
    const sw = Math.sin(t * 3) * 0.3;
    ctx.save();
    ctx.translate(0, -6);
    ctx.rotate(-0.6 + sw);
    ctx.fillStyle = '#8a5a2b';
    ctx.fillRect(-2, -24, 4, 26);
    ctx.strokeRect(-2, -24, 4, 26);
    ctx.fillStyle = '#3a2a1c';
    ctx.beginPath();
    ctx.arc(0, -26, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  } else if (id === 'chain') {
    // 铜雷柱：柱子顶上一团电
    ctx.fillStyle = '#b07a3e';
    ctx.fillRect(-4, -28, 8, 26);
    ctx.strokeRect(-4, -28, 8, 26);
    ctx.strokeStyle = '#9fe8ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 3; i++) {
      const a = t * 9 + i * 2.1;
      ctx.moveTo(0, -30);
      ctx.lineTo(Math.cos(a) * 9, -30 + Math.sin(a) * 7);
    }
    ctx.stroke();
  } else if (id === 'frost') {
    // 喷汽口：一根弯管冒白汽
    ctx.fillStyle = '#7c8791';
    ctx.fillRect(-4, -22, 8, 20);
    ctx.strokeRect(-4, -22, 8, 20);
    ctx.fillRect(-4, -26, 14, 6);
    ctx.strokeRect(-4, -26, 14, 6);
    const p = (t * 1.5) % 1;
    ctx.fillStyle = 'rgba(220,240,255,' + (0.7 * (1 - p)) + ')';
    ctx.beginPath();
    ctx.arc(12 + p * 6, -26 - p * 12, 4 + p * 5, 0, Math.PI * 2);
    ctx.fill();
  } else if (id === 'hammer') {
    // 大锤架
    const lift = Math.abs(Math.sin(t * 2.5)) * 6;
    ctx.fillStyle = '#6b4424';
    ctx.fillRect(-10, -26, 3, 24);
    ctx.fillRect(7, -26, 3, 24);
    ctx.fillRect(-10, -28, 20, 3);
    ctx.fillStyle = '#7c8791';
    roundRect(ctx, -7, -20 - lift, 14, 10, 2);
    ctx.fill();
    ctx.stroke();
  } else if (id === 'lamp') {
    // 灯塔：顶上一盏照妖灯
    ctx.fillStyle = '#8a5a2b';
    ctx.fillRect(-4, -24, 8, 22);
    ctx.strokeRect(-4, -24, 8, 22);
    ctx.fillStyle = '#ffe08a';
    ctx.beginPath();
    ctx.arc(0, -28, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,240,170,0.25)';
    ctx.beginPath();
    ctx.moveTo(-5, -30);
    ctx.lineTo(-18, -70);
    ctx.lineTo(18, -70);
    ctx.lineTo(5, -30);
    ctx.fill();
  }
  ctx.restore();
}

function drawSegBody(ctx, g, t, fam) {
  const R = g.r;
  const c = FAM[fam];
  if (fam === 'centi') {
    // 两对小腿，跟着走的方向一摆一摆
    const a = g.a || 0;
    const nx = -Math.sin(a);
    const ny = Math.cos(a);
    const tx = Math.cos(a);
    const ty = Math.sin(a);
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 2.6;
    ctx.lineCap = 'round';
    for (const side of [-1, 1]) {
      for (const k of [-0.45, 0.45]) {
        const w = Math.sin(t * 14 + g.id + k * 3) * 3;
        const bx = g.x + tx * R * k;
        const by = g.y + ty * R * k;
        ctx.beginPath();
        ctx.moveTo(bx + nx * side * R * 0.8, by + ny * side * R * 0.8);
        ctx.lineTo(bx + nx * side * (R + 6) + tx * w, by + ny * side * (R + 6) + ty * w);
        ctx.lineTo(bx + nx * side * (R + 9) + tx * (w - 3), by + ny * side * (R + 9) + ty * (w - 3));
        ctx.stroke();
      }
    }
  }
  if (fam === 'dragon') return drawCarSeg(ctx, g, t, c);
  disc(ctx, g.x, g.y, R, c.base, c.shade);
  if (fam === 'dragon') {
    // 齿轮边 + 四颗铆钉
    ctx.fillStyle = LINE;
    for (let k = 0; k < 4; k++) {
      const a = (g.a || 0) + (k * Math.PI) / 2 + Math.PI / 4;
      ctx.fillRect(g.x + Math.cos(a) * (R - 4) - 1.3, g.y + Math.sin(a) * (R - 4) - 1.3, 2.6, 2.6);
    }
    ctx.strokeStyle = c.shade;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(g.x, g.y, R * 0.55, 0, Math.PI * 2);
    ctx.stroke();
  } else if (fam === 'centi') {
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(g.x - Math.sin(g.a) * R, g.y + Math.cos(g.a) * R);
    ctx.lineTo(g.x + Math.sin(g.a) * R, g.y - Math.cos(g.a) * R);
    ctx.stroke();
  } else if (fam === 'terra') {
    // 陶俑从上往下看：肩甲两片 + 发髻
    ctx.fillStyle = c.shade;
    ctx.fillRect(g.x - R * 0.7, g.y - 1, R * 1.4, 2);
    disc(ctx, g.x, g.y, R * 0.45, '#b98258', '#8a5a38', 1);
    ctx.fillStyle = '#2b1d16';
    ctx.beginPath();
    ctx.arc(g.x + 1, g.y - 1, R * 0.2, 0, Math.PI * 2);
    ctx.fill();
  }
  streak(ctx, g.x, g.y, R);
}

function drawSegType(ctx, st, g, t, fam) {
  const R = g.r;
  const type = g.type;
  if (type === 'shield') {
    // 朝下（朝阿铸）一块弧形铁盾
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.arc(g.x, g.y, R + 1, Math.PI * 0.12, Math.PI * 0.88);
    ctx.stroke();
    ctx.strokeStyle = '#7d8696';
    ctx.lineWidth = 5;
    ctx.stroke();
    ctx.strokeStyle = '#d7e0ea';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(g.x, g.y, R + 2.4, Math.PI * 0.3, Math.PI * 0.55);
    ctx.stroke();
    ctx.fillStyle = '#c9a24a';
    for (const k of [0.25, 0.5, 0.75]) {
      const a = Math.PI * (0.12 + 0.76 * k);
      ctx.fillRect(g.x + Math.cos(a) * (R + 1) - 1.2, g.y + Math.sin(a) * (R + 1) - 1.2, 2.4, 2.4);
    }
  } else if (type === 'core') {
    const p = 0.5 + 0.5 * Math.sin(t * 6 + g.id);
    ctx.fillStyle = 'rgba(110,255,150,' + (0.25 + 0.25 * p).toFixed(2) + ')';
    ctx.beginPath();
    ctx.arc(g.x, g.y, R * 0.75, 0, Math.PI * 2);
    ctx.fill();
    disc(ctx, g.x, g.y, R * 0.38, '#6dff9a', '#2fb45c', 1);
  }
}

// 不走家族画法的兵种：火药桶、幽影、分裂、重甲俑
function drawSpecial(ctx, st, g, t) {
  const R = g.r;
  if (g.type === 'powder') {
    disc(ctx, g.x, g.y, R, '#8a5a30', '#663f1e');
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 2.2;
    for (const k of [-0.45, 0.45]) {
      ctx.beginPath();
      ctx.arc(g.x, g.y, R * (1 - Math.abs(k) * 0.4), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.fillStyle = '#c0352b';
    ctx.fillRect(g.x - 4, g.y - 4, 8, 8);
    // 引线冒火星
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(g.x + 3, g.y - R + 2);
    ctx.quadraticCurveTo(g.x + 9, g.y - R - 6, g.x + 6, g.y - R - 10);
    ctx.stroke();
    const sp = 0.6 + 0.4 * Math.sin(t * 30 + g.id);
    ctx.fillStyle = '#ffd65a';
    star(ctx, g.x + 6, g.y - R - 10, 4 * sp + 2, 1.5, 6);
    return true;
  }
  if (g.type === 'ghost') {
    const ph = st.phasedOf ? st.phasedOf(g) : false;
    const bob = Math.sin(t * 2.6 + g.id) * 2;
    ctx.globalAlpha = ph ? 0.22 : 0.92;
    ctx.fillStyle = '#d9ecf5';
    ctx.beginPath();
    ctx.arc(g.x, g.y + bob, R, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#72AFC8';
    ctx.lineWidth = 2.4;
    if (ph) ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#2a4376';
    ctx.fillRect(g.x - 6, g.y + bob - 3, 3, 4);
    ctx.fillRect(g.x + 3, g.y + bob - 3, 3, 4);
    ctx.globalAlpha = 1;
    return true;
  }
  if (g.type === 'split') {
    disc(ctx, g.x, g.y, R, '#5f9e74', '#3f7553');
    ctx.strokeStyle = '#b8ffcf';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(g.x - 2, g.y - R + 2);
    ctx.lineTo(g.x + 3, g.y - 3);
    ctx.lineTo(g.x - 3, g.y + 4);
    ctx.lineTo(g.x + 1, g.y + R - 2);
    ctx.stroke();
    streak(ctx, g.x, g.y, R);
    return true;
  }
  if (g.type === 'clay') {
    disc(ctx, g.x, g.y, R + 2, '#7c4a32', '#5a3322');
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 1;
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.moveTo(g.x - R * 0.8, g.y + k * 6);
      ctx.lineTo(g.x + R * 0.8, g.y + k * 6);
      ctx.stroke();
    }
    disc(ctx, g.x, g.y - 1, R * 0.4, '#9a6646', '#6e452e', 1);
    return true;
  }
  return false;
}

function drawChest(ctx, g, t) {
  const R = g.r;
  ctx.save();
  ctx.translate(g.x, g.y);
  ctx.rotate(g.a || 0);
  ctx.fillStyle = LINE;
  roundRect(ctx, -R - 1.5, -R - 1.5, 2 * R + 3, 2 * R + 3, 5);
  ctx.fill();
  ctx.fillStyle = P.lac;
  roundRect(ctx, -R, -R, 2 * R, 2 * R, 4);
  ctx.fill();
  ctx.fillStyle = P.lacLo;
  ctx.fillRect(-R, R * 0.3, 2 * R, R * 0.7);
  ctx.fillStyle = P.gold;
  ctx.fillRect(-R, -2, 2 * R, 4);
  ctx.fillRect(-2, -R, 4, 2 * R);
  const glow = 0.5 + 0.5 * Math.sin(t * 8 + g.id);
  ctx.fillStyle = mix('#ffd65a', '#fff7d0', glow);
  ctx.beginPath();
  ctx.arc(0, 0, 5.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillRect(-R + 3, -R + 3, R * 0.7, 2);
  ctx.restore();
}
function drawRam(ctx, g) {
  const R = g.r;
  ctx.save();
  ctx.translate(g.x, g.y);
  ctx.rotate((g.a || 0) + Math.PI);
  ctx.fillStyle = LINE;
  ctx.beginPath();
  ctx.moveTo(R, -9);
  ctx.lineTo(R + 20, 0);
  ctx.lineTo(R, 9);
  ctx.fill();
  ctx.fillStyle = '#9aa0b0';
  ctx.beginPath();
  ctx.moveTo(R + 1, -5.5);
  ctx.lineTo(R + 15, 0);
  ctx.lineTo(R + 1, 5.5);
  ctx.fill();
  ctx.restore();
  disc(ctx, g.x, g.y, R + 3, '#5e6474', '#3c404c');
  ctx.fillStyle = '#c94a3a';
  ctx.fillRect(g.x - 2, g.y - 2, 4, 4);
  streak(ctx, g.x, g.y, R + 3);
}

function drawSegAll(ctx, st, g, t, isTail) {
  const fam = st.ch.enemy;
  const wob = Math.sin(t * 6 + g.id * 0.9) * 0.6;
  const pop = 1 + Math.max(0, g.flash) * 2.2;
  ctx.save();
  ctx.translate(g.x, g.y + wob);
  ctx.scale(pop, pop);
  ctx.translate(-g.x, -g.y);
  if (g.chest) drawChest(ctx, g, t);
  else if (g.ram) drawRam(ctx, g);
  else if (!drawSpecial(ctx, st, g, t)) {
    drawSegBody(ctx, g, t, fam);
    drawSegType(ctx, st, g, t, fam);
  }
  if (g.frozT > 0) {
    ctx.globalAlpha = Math.min(1, g.frozT * 2) * 0.55;
    ctx.fillStyle = '#d8ecff';
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.r + 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(g.x - 6, g.y - 6);
    ctx.lineTo(g.x + 6, g.y + 6);
    ctx.moveTo(g.x + 6, g.y - 6);
    ctx.lineTo(g.x - 6, g.y + 6);
    ctx.stroke();
  }
  if (g.flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.r + 1, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  // 血（数字）
  ctx.save();
  ctx.font = '900 ' + (g.type === 'mini' ? 9 : 11) + 'px "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 3;
  ctx.strokeStyle = LINE;
  const txt = fmtHp(g.hp);
  const ty = g.y + wob + 0.5;
  ctx.strokeText(txt, g.x, ty);
  ctx.fillStyle = g.type === 'core' && g.hp < g.max && g.noRegen <= 0 ? '#9dffb8' : '#fffaf0';
  ctx.fillText(txt, g.x, ty);
  ctx.restore();
}

function drawHeadAll(ctx, st, g, t) {
  const fam = st.ch.enemy;
  if (fam === 'dragon') return drawHead(ctx, g, t, st.danger);
  const a = g.a || 0;
  const R = C.DRAGON.r;
  const hx = g.x + Math.cos(a) * (R + 8);
  const hy = g.y + Math.sin(a) * (R + 8);
  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(a);
  if (fam === 'centi') {
    // 铁蜈蚣：一对大钳子一开一合
    const open = 0.35 + Math.abs(Math.sin(t * 5)) * 0.35;
    ctx.lineCap = 'round';
    for (const s of [-1, 1]) {
      ctx.save();
      ctx.rotate(s * open);
      ctx.strokeStyle = LINE;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(4, s * 4);
      ctx.quadraticCurveTo(16, s * 9, 20, s * 1);
      ctx.stroke();
      ctx.strokeStyle = '#a9bccb';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }
    disc(ctx, 0, 0, 10, '#4a5560', '#30373f');
    ctx.fillStyle = st.danger > 0 ? '#ffffff' : '#7dff9a';
    ctx.fillRect(3, -6, 3, 3);
    ctx.fillRect(3, 3, 3, 3);
  } else {
    // 陶俑将军：高冠、脸朝前
    ctx.fillStyle = LINE;
    ctx.fillRect(-14, -6, 10, 12);
    ctx.fillStyle = '#5a2d1e';
    ctx.fillRect(-13, -5, 8, 10);
    disc(ctx, 0, 0, 10, '#c48a5c', '#94603c');
    ctx.fillStyle = '#c0352b';
    ctx.fillRect(-4, -11, 8, 4);
    ctx.fillStyle = st.danger > 0 ? '#ff3b2f' : LINE;
    ctx.fillRect(4, -4, 2.5, 2.5);
    ctx.fillRect(4, 2, 2.5, 2.5);
  }
  ctx.restore();
}

function drawDragonAll(ctx, st, t) {
  const segs = st.segs;
  for (let i = segs.length - 1; i >= 0; i--) {
    const g = segs[i];
    if (g.y < -30) continue;
    drawSegAll(ctx, st, g, t, i === segs.length - 1 && segs.length > 1);
  }
  if (segs.length && segs[0].y > -30) drawHeadAll(ctx, st, segs[0], t);
}

// —— 阿铸（细线赛璐璐，背影）——
function drawHero(ctx, x, y, t, recoil, moving, lv) {
  const bob = moving ? Math.abs(Math.sin(t * 11)) * -1.5 : Math.sin(t * 3) * 0.6;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.save();
  ctx.translate(x, y + 27);
  ctx.scale(1, 0.28);
  ctx.beginPath();
  ctx.arc(0, 0, 20, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  const yy = y + bob;
  // 生图到了：用 Midjourney 画的阿铸（只画到腰，下半身被墙挡住）
  if (imgOk('hero')) {
    const im = IMG.hero;
    const hgt = 104;
    const wid = (im.width / im.height) * hgt;
    if (lv >= 5) {
      ctx.globalAlpha = 0.25 + 0.15 * Math.sin(t * 8);
      ctx.fillStyle = lv >= 8 ? '#ff5a3a' : '#ffb347';
      ctx.beginPath();
      ctx.arc(x, yy - 40, 30, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
    const top = yy - 74 + recoil * 3;
    ctx.drawImage(im, x - wid / 2, top, wid, hgt);
    if (recoil > 0.55) {
      ctx.globalAlpha = (recoil - 0.55) / 0.45;
      ctx.fillStyle = '#fff2b0';
      star(ctx, x - wid * 0.12, top + 2, 7 + lv * 0.6, 3, 6);
      ctx.globalAlpha = 1;
    }
    return;
  }
  const ol = (fn) => {
    ctx.fillStyle = LINE;
    fn(1.4);
  };
  // 腿
  const step = moving ? Math.sin(t * 22) * 3 : 0;
  for (const s of [-1, 1]) {
    ctx.fillStyle = LINE;
    roundRect(ctx, x + s * 7 - 5.5, yy + 6 + (s > 0 ? step : -step) * 0.3, 11, 20, 3);
    ctx.fill();
    ctx.fillStyle = '#3a2f3a';
    roundRect(ctx, x + s * 7 - 4.3, yy + 7 + (s > 0 ? step : -step) * 0.3, 8.6, 17.6, 2.5);
    ctx.fill();
  }
  // 手臂（举着弩，往上）
  for (const s of [-1, 1]) {
    ctx.fillStyle = LINE;
    roundRect(ctx, x + s * 15 - 5, yy - 26, 10, 22, 4);
    ctx.fill();
    ctx.fillStyle = '#d9a777';
    roundRect(ctx, x + s * 15 - 3.8, yy - 24.8, 7.6, 19.6, 3);
    ctx.fill();
    ctx.fillStyle = '#b57f52';
    ctx.fillRect(x + s * 15 + (s > 0 ? 0 : -3.8), yy - 24.8, 3.8, 19.6);
  }
  // 背（宽肩倒梯形）+ 背心 + 围裙带
  ctx.fillStyle = LINE;
  ctx.beginPath();
  ctx.moveTo(x - 17, yy - 16);
  ctx.lineTo(x + 17, yy - 16);
  ctx.lineTo(x + 11, yy + 10);
  ctx.lineTo(x - 11, yy + 10);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#6b4a30';
  ctx.beginPath();
  ctx.moveTo(x - 15.5, yy - 14.8);
  ctx.lineTo(x + 15.5, yy - 14.8);
  ctx.lineTo(x + 10, yy + 8.8);
  ctx.lineTo(x - 10, yy + 8.8);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#4e3421';
  ctx.beginPath();
  ctx.moveTo(x + 2, yy - 14.8);
  ctx.lineTo(x + 15.5, yy - 14.8);
  ctx.lineTo(x + 10, yy + 8.8);
  ctx.lineTo(x + 2, yy + 8.8);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#2d1f14';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - 12, yy - 14);
  ctx.lineTo(x + 8, yy + 7);
  ctx.moveTo(x + 12, yy - 14);
  ctx.lineTo(x - 8, yy + 7);
  ctx.stroke();
  // 头（后脑勺）+ 红头巾，两条带子飘
  ctx.fillStyle = '#b8302a';
  const fl = Math.sin(t * 8) * 3;
  ctx.beginPath();
  ctx.moveTo(x + 4, yy - 24);
  ctx.lineTo(x + 14 + fl, yy - 14);
  ctx.lineTo(x + 10 + fl, yy - 12);
  ctx.closePath();
  ctx.fill();
  disc(ctx, x, yy - 25, 9, '#26201c', '#15110e');
  ctx.fillStyle = LINE;
  ctx.fillRect(x - 9.5, yy - 28, 19, 5.5);
  ctx.fillStyle = '#d4483e';
  ctx.fillRect(x - 9, yy - 27.4, 18, 4.2);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillRect(x - 4, yy - 31, 5, 1.6);
  drawCrossbow(ctx, x, yy - 30, recoil, t, lv);
}

// —— 七件武器的画法 ——
function drawWeapons(ctx, st, t) {
  const F = C.FIELD;
  // 地上的火
  for (const f of st.fires) {
    const k = f.t / f.max;
    ctx.globalAlpha = Math.min(1, k * 3) * 0.35;
    ctx.fillStyle = '#ff6a2a';
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = Math.min(1, k * 3);
    for (let i = 0; i < 7; i++) {
      const a = (i / 7) * Math.PI * 2 + i;
      const rr = f.r * (0.3 + 0.55 * ((i * 37) % 10) / 10);
      const fx = f.x + Math.cos(a) * rr;
      const fy = f.y + Math.sin(a) * rr * 0.8;
      const h = 8 + 5 * Math.sin(t * 14 + i * 2);
      ctx.fillStyle = LINE;
      ctx.beginPath();
      ctx.moveTo(fx - 5, fy + 2);
      ctx.quadraticCurveTo(fx - 3, fy - h * 0.6, fx, fy - h - 1);
      ctx.quadraticCurveTo(fx + 3, fy - h * 0.6, fx + 5, fy + 2);
      ctx.fill();
      ctx.fillStyle = i % 2 ? '#ffb347' : '#ff6a2a';
      ctx.beginPath();
      ctx.moveTo(fx - 3.6, fy + 1);
      ctx.quadraticCurveTo(fx - 2, fy - h * 0.5, fx, fy - h);
      ctx.quadraticCurveTo(fx + 2, fy - h * 0.5, fx + 3.6, fy + 1);
      ctx.fill();
    }

  PF.load(SAVE) || {}
);
const saveMeta = () => PF.save(SAVE, meta);
PF.setMuted(meta.muted);

const SH = require('./shell.js');
const CS = require('./cs.js');
const view = SH.view;
const { ctx, width: W, height: H, dpr } = view;
const F = C.FIELD;
const scale = Math.min(W / F.w, H / F.h);
const ox = (W - F.w * scale) / 2;
const oy = (H - F.h * scale) / 2;

const G = {
  fx2: [], // 结算页上面一层的火花
  mode: 'play', // play | end | result
  st: null,
  bg: null,
  t: 0,
  fx: [],
  shake: 0,
  hitstop: 0,
  flash: 0,
  flashColor: '#fff',
  recoil: 0,
  targetX: F.w / 2,
  drag: null,
  buttons: [],
  result: null,
  endTimer: 0,
  banner: 0,
  hint: false,
  hintMoved: 0,
  heartCd: 0,
  sndCd: {},
  speed: 1, // 测试用：一帧跑几步
  bot: null, // 测试用：自动玩
  log: [], // 每局记录（测试量数用）
  timing: { loseAt: 0, restartAt: 0 },
  resultAt: 0,
};

// —— 声音（同一种声音太密时跳过）——
function snd(name, gapMs, vol, rate) {
  const now = PF.now();
  if (gapMs && G.sndCd[name] && now - G.sndCd[name] < gapMs) return;
  G.sndCd[name] = now;
  PF.sound(name, vol, rate);
}

// —— 开一局 ——
function startRun() {
  const seed = ((PF.now() % 1000000007) ^ (meta.runs * 2654435761)) >>> 0;
  G.st = S.newRun(meta.level, meta, seed || 1);
  G.st.phasedOf = (g) => S.phased(G.st, g);
  G.bg = makeBg(G.st);
  G.typeShow = null;
  G.evoShow = null;
  G.cs = null;
  G.mode = 'play';
  G.result = null;
  G.fx.length = 0;
  G.targetX = G.st.px;
  G.banner = 1.3;
  G.wallParts = 0;
  G.gearFly = [];
  G.intro = meta.introSeen && meta.introSeen[G.st.ch.id] ? null : { t: 0, id: G.st.ch.id };
  if (G.intro) G.banner = 0;
  G.hint = meta.level === 0 && !meta.seenHint;
  G.hintMoved = 0;
  G.runStartReal = PF.now();
  // 弩机刚升过级：开局在阿铸头上亮一下，箭也换了样子
  G.bowShow = meta.bowLv > (meta.bowSeen || 0) ? 1.8 : 0;
  G.palShow = st0Buddy() && meta.palSeen !== meta.buddy ? 1.8 : 0;
  meta.bowSeen = meta.bowLv;
  meta.palSeen = meta.buddy;
  G.goldBump = 0;
  G.timing.restartAt = PF.now();
  meta.runs++;
  saveMeta();
}

// 生图到了以后：把文件名加进 config.js 的 ASSETS（例：'bg_city.jpg'），放进 原型/素材/
const IMGS = (C.ASSETS || []).map((f) => {
  const k = f.replace(/\.[a-z]+$/, '');
  D.IMG[k] = PF.loadImage('素材/' + f);
  return k;
});
let imgsReady = 0;
function st0Buddy() {
  return G.st && G.st.buddy;
}
function makeBg(st) {
  const k = scale * dpr;
  const c = PF.createOffscreen(Math.ceil(F.w * k), Math.ceil(F.h * k));
  const x = c.getContext('2d');
  x.setTransform(k, 0, 0, k, 0, 0);
  D.drawScene(x, st);
  return c;
}

// —— 一局结束 ——
function endRun(win) {
  const st = G.st;
  const r = {
    win,
    level: st.level,
    left: st.segs.length,
    total: st.total,
    kills: st.kills,
    gold: st.gold,
    near: !win && !!st.nearMiss,
    doubled: false,
    newBuddy: null,
    t: st.t,
  };
  meta.gold += st.gold;
  if (win) {
    const nb = C.BUDDIES.find((b) => b.unlockLevel === st.level && meta.buddies.indexOf(b.id) < 0);
    if (nb) {
      meta.buddies.push(nb.id);
      meta.buddy = nb.id;
      r.newBuddy = nb;
    }
    meta.level = st.level + 1;
    meta.best = Math.max(meta.best, meta.level);
  }
  saveMeta();
  G.log.push({ level: st.level, win, t: st.t, left: r.left, total: r.total, near: r.near, real: (PF.now() - G.runStartReal) / 1000, ads: st.adsUsed });
  G.result = r;
  G.mode = 'result';
  G.resultAt = PF.now();
}

// —— 特效 ——
const FXMAX = 420;
const roomFor = (n) => G.fx.length + n < FXMAX;
function shards(x, y, n, col) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = 60 + Math.random() * 180;
    G.fx.push({ k: 'sq', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: 0.5 + Math.random() * 0.3, max: 0.8, s: 2 + Math.random() * 3, c: col || (Math.random() < 0.5 ? D.P.brass : D.P.brassHi) });
  }
}
// 打碎：几片转着飞的铜壳 + 一两个小齿轮
function chunks(x, y, n, cols) {
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.6;
    const v = 120 + Math.random() * 160;
    G.fx.push({ k: 'chunk', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, rot: Math.random() * 6, spin: (Math.random() - 0.5) * 24, life: 0.7, max: 0.7, w: 6 + Math.random() * 5, h: 4 + Math.random() * 3, c: cols[i % cols.length] });
  }
  for (let i = 0; i < 2; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2;
    const v = 90 + Math.random() * 120;
    G.fx.push({ k: 'gear', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, rot: 0, spin: (Math.random() < 0.5 ? -1 : 1) * 14, life: 0.8, max: 0.8, r: 3.5 + Math.random() * 2 });
  }
}
// 火花：细长的亮线，往外飞
function sparks(x, y, n, col, sp) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = (sp || 1) * (160 + Math.random() * 220);
    G.fx.push({ k: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.18 + Math.random() * 0.12, max: 0.3, c: col || '#fff2b0' });
  }
}
function pop(x, y, r, col, life) {
  G.fx.push({ k: 'pop', x, y, r, life: life || 0.12, max: life || 0.12, c: col || '#ffffff' });
}
function puff(x, y, n, r) {
  for (let i = 0; i < n; i++) {
    G.fx.push({ k: 'puff', x: x + (Math.random() - 0.5) * 10, y: y + (Math.random() - 0.5) * 10, vx: (Math.random() - 0.5) * 30, vy: -20 - Math.random() * 30, life: 0.6, max: 0.6, s: (r || 6) + Math.random() * 4 });
  }
}
function text(x, y, s, size, col, life) {
  G.fx.push({ k: 'txt', x, y, vx: 0, vy: -40, life: life || 0.6, max: life || 0.6, s, size, c: col || '#fff' });
}
function ring(x, y, r, col, life, w) {
  G.fx.push({ k: 'ring', x, y, r, life: life || 0.3, max: life || 0.3, c: col, w: w || 4 });
}
// 金币从打碎的地方飞到右上角的金币数
function coinFly(x, y, delay) {
  G.fx.push({ k: 'coin', x0: x, y0: y, x, y, life: 0.55 + (delay || 0), max: 0.55 + (delay || 0), d: delay || 0 });
}
// 大爆炸：白光 → 橙色火球 → 两圈冲击波 → 焦痕
function boom(x, y, r, big) {
  pop(x, y, r * 0.9, '#fff7e0', 0.1);
  G.fx.push({ k: 'fire', x, y, r, life: 0.35, max: 0.35 });
  ring(x, y, r, '#ffb347', 0.35, 6);
  if (big) ring(x, y, r * 1.5, '#fff2b0', 0.45, 3);
  G.fx.unshift({ k: 'scorch', x, y, r: r * 0.6, life: 1.2, max: 1.2 });
  if (roomFor(20)) {
    sparks(x, y, big ? 14 : 8, '#ffb347', big ? 1.3 : 1);
    chunks(x, y, big ? 5 : 3, [D.P.brass, D.P.brassLo, '#4a4f5c']);
  }
}

function handleEvents(st) {
  for (const e of st.events) {
    switch (e.t) {
      case 'shoot':
        G.recoil = 1;
        snd('shoot', 70, 0.35);
        break;
      case 'hit': {
        const heavy = st.mods.tier >= 4;
        // 打在盾上 / 重甲上：灰火花「挡」；用对了武器：黄字「克！」
        if (e.resist || e.weak) {
          const now = PF.now();
          const key = e.resist ? 'resAt' : 'weakAt';
          if (!G[key] || now - G[key] > (e.resist ? 350 : 250)) {
            G[key] = now;
            if (e.resist) {
              text(e.x, e.y - 12, e.type === 'shield' ? '挡' : '硬', 13, '#b8c0cc', 0.4);
              snd('clang', 90, 0.4);
            } else text(e.x, e.y - 16, '克！' + e.dmg, 15, '#ffcf4a', 0.55);
          }
          if (e.resist) {
            if (roomFor(3)) sparks(e.x, e.y + 8, 1, '#c8d0dc', 0.5);
            break;
          }
        }
        if (e.crit) {
          const now = PF.now();
          if (!G.critTextAt || now - G.critTextAt > 160) {
            G.critTextAt = now;
            text(e.x, e.y - 14, e.dmg + '!', 15, '#fff27a', 0.5);
            G.fx.push({ k: 'rays', x: e.x, y: e.y, life: 0.2, max: 0.2, r: 18 });
          }
          snd('crit', 60);
        } else {
          snd(heavy ? 'hitHeavy' : 'hit', 45, heavy ? 0.5 : 0.4);
        }
        // 打中冒火花：武器越重，火花越多越亮
        if (roomFor(4)) sparks(e.x, e.y, heavy ? 2 : 1, D.boltTier(st.mods.tier).core, 0.6);
        break;
      }
      case 'kill': {
        const combo = Math.min(12, e.combo || 1);
        pop(e.x, e.y, 24, '#ffffff', 0.1);
        ring(e.x, e.y, 26, D.P.brassHi, 0.25, 3);
        if (roomFor(16)) {
          chunks(e.x, e.y, e.chest ? 6 : 4, e.chest ? [D.P.lac, D.P.lacHi, D.P.gold] : e.ram ? ['#6b7080', '#a9afbf', '#3c3f4a'] : [D.P.brass, D.P.brassHi, D.P.brassLo]);
          sparks(e.x, e.y, 5, '#fff2b0');
        }
        coinFly(e.x, e.y);
        gearFly(e.x, e.y, e.ram ? 3 : 1);
        G.shake = Math.max(G.shake, e.front ? 3 : 2);
        // 连着碎，声音一下比一下高
        snd('break', 30, 0.6, 1 + (combo - 1) * 0.05);
        if (e.ram) {
          boom(e.x, e.y, 54, true);
          G.hitstop = Math.max(G.hitstop, 0.12);
          G.shake = Math.max(G.shake, 9);
          G.flash = 0.25;
          G.flashColor = '#fff3d0';
          snd('ram');
          PF.vibrate('heavy');
          for (let k = 1; k < 5; k++) coinFly(e.x + (Math.random() - 0.5) * 30, e.y, k * 0.05);
        }
        break;
      }
      case 'chest':
        G.hitstop = Math.max(G.hitstop, 0.09);
        G.shake = Math.max(G.shake, 4);
        G.fx.push({ k: 'rays', x: e.x, y: e.y, life: 0.5, max: 0.5 });
        shards(e.x, e.y, 10, D.P.gold);
        snd('chest');
        PF.vibrate('medium');
        break;
      case 'blast':
        boom(e.x, e.y, e.r, false);
        G.shake = Math.max(G.shake, 3.5);
        snd('blast', 80, 0.55);
        break;
      // —— 伙伴 ——
      case 'palGo':
        if (st.buddy.id === 'que') snd('chirp', 100, 0.5);
        else if (st.buddy.id === 'quan') snd('bark', 100, 0.55);
        break;
      case 'peck':
        snd('peck', 30, 0.5);
        sparks(e.x, e.y - 6, e.chest ? 4 : 2, e.chest ? D.P.gold : '#fff2b0', 0.7);
        if (e.chest) pop(e.x, e.y, 14, D.P.gold, 0.08);
        break;
      case 'bite':
        snd('bite');
        G.fx.push({ k: 'chomp', x: e.x, y: e.y, life: 0.32, max: 0.32 });
        ring(e.x, e.y, 34, '#ffffff', 0.3, 5);
        text(e.x, e.y - 30, '退！', 20, D.P.gold, 0.7);
        G.shake = Math.max(G.shake, 6);
        G.hitstop = Math.max(G.hitstop, 0.06);
        PF.vibrate('medium');
        break;
      case 'mortar':
        snd('mortar');
        puff(e.x, e.y, 3, 5);
        break;
      case 'shell': {
        boom(e.x, e.y, e.r, true);
        G.shake = Math.max(G.shake, 8);
        G.hitstop = Math.max(G.hitstop, 0.06);
        snd('boom');
        PF.vibrate('medium');
        // 留一团蒸汽：龙爬慢
        for (let k = 0; k < 7; k++) {
          const a = (k / 7) * Math.PI * 2;
          G.fx.push({ k: 'cloud', x: e.x + Math.cos(a) * e.r * 0.55, y: e.y + Math.sin(a) * e.r * 0.45, s: 12 + Math.random() * 8, life: st.buddy.slowSec, max: st.buddy.slowSec, ph: Math.random() * 6 });
        }
        text(e.x, e.y - e.r * 0.6, '慢！', 18, '#cfe6ff', 0.8);
        break;
      }
      case 'combo':
        G.fx.push({ k: 'combo', x: F.w / 2, y: 150, life: 0.9, max: 0.9, s: '×' + e.n + ' 连碎', size: 26 });
        G.shake = Math.max(G.shake, 4);
        G.hitstop = Math.max(G.hitstop, 0.04);
        snd('combo');
        break;
      case 'pick': {
        const w = S.W[e.id];
        ring(st.px, F.playerY - 14, 40, w.color, 0.4, 5);
        pop(st.px, F.playerY - 14, 30, w.color, 0.15);
        sparks(st.px, F.playerY - 14, 10, w.color);
        if (e.lv >= 5) {
          // 进化：一局里最爽的那一下
          snd('evolve');
          G.flash = 0.4;
          G.flashColor = '#fff3d0';
          G.shake = 8;
          G.hitstop = Math.max(G.hitstop, 0.15);
          G.cs = CS.evolve(ctx, {
            name: w.evo,
            drawOld: (g, x, y) => D.drawWeaponIcon(g, e.id, x, y, 120),
            drawNew: (g, x, y) => {
              g.fillStyle = 'rgba(255,214,90,0.35)';
              g.beginPath();
              g.arc(x, y, 100, 0, Math.PI * 2);
              g.fill();
              D.drawWeaponIcon(g, e.id, x, y, 150);
            },
            sfx: (n) => snd(n),
            onEnd: () => (G.cs = null),
          });
          if (G.bot) G.cs.skip();
          for (let k = 0; k < 4; k++) ring(st.px, F.playerY - 14, 50 + k * 30, w.color, 0.5 + k * 0.1, 6);
          sparks(st.px, F.playerY - 14, 24, w.color, 1.4);
          PF.vibrate('heavy');
        } else {
          snd('pick');
          text(st.px, F.playerY - 60, w.name + (e.lv > 1 ? ' Lv' + e.lv : ' 到手'), 20, w.color, 0.9);
        }
        break;
      }
      case 'phase': {
        const now = PF.now();
        if (!G.phaseAt || now - G.phaseAt > 400) {
          G.phaseAt = now;
          text(e.x, e.y - 12, '虚', 14, '#9fd6ec', 0.45);
        }
        break;
      }
      case 'powder':
        boom(e.x, e.y, e.r, true);
        G.shake = Math.max(G.shake, 7);
        G.hitstop = Math.max(G.hitstop, 0.05);
        snd('boom', 60, 0.7);
        text(e.x, e.y - 24, '轰！', 20, '#ffb347', 0.7);
        break;
      case 'split':
        shards(e.x, e.y, 10, '#8fffb0');
        text(e.x, e.y - 20, '裂！', 16, '#8fffb0', 0.6);
        snd('crit', 60, 0.5);
        break;
      case 'regen':
        text(e.x + 10, e.y - 10, '+', 16, '#7dff9a', 0.5);
        break;
      case 'newType':
        G.typeShow = { type: e.type, t: 3.2 };
        snd('alarm', 300, 0.25);
        break;
      case 'bladeThrow':
        snd('whoosh', 120, 0.45);
        break;
      case 'potThrow':
        snd('mortar', 120, 0.5);
        break;
      case 'potBoom':
        boom(e.x, e.y, e.r, false);
        G.shake = Math.max(G.shake, 4);
        snd('blast', 70, 0.6);
        break;
      case 'chain':
        G.fx.push({ k: 'bolt', pts: e.pts, life: 0.22, max: 0.22, evo: e.evo, seed: Math.random() * 100 });
        for (const q of e.pts.slice(1)) sparks(q.x, q.y, 2, '#d8ecff', 0.6);
        snd('zap', 80, 0.5);
        break;
      case 'frost':
        for (const q of e.pts) {
          ring(q.x, q.y, 24, '#d8ecff', 0.35, 4);
          sparks(q.x, q.y, 2, '#ffffff', 0.5);
        }
        if (e.evo) {
          G.flash = 0.25;
          G.flashColor = '#d8ecff';
          text(F.w / 2, 300, '冰封！', 30, '#d8ecff', 1);
        }
        snd('freeze', 100, 0.55);
        break;
      case 'hammer':
        G.shake = Math.max(G.shake, e.push ? 9 : 5);
        G.hitstop = Math.max(G.hitstop, 0.05);
        ring(e.x, e.y, 40, '#ffe1a0', 0.3, 7);
        pop(e.x, e.y, 26, '#fff7e0', 0.1);
        if (roomFor(12)) chunks(e.x, e.y, 3, [D.P.brass, '#7F602C', '#6b5a48']);
        snd('thud', 60, 0.8);
        PF.vibrate('medium');
        break;
      case 'lever':
        snd('alarm');
        PF.vibrate('heavy');
        break;
      case 'leverPull':
        snd('salvo');
        G.flash = 0.35;
        G.flashColor = '#fff3d0';
        G.shake = 9;
        for (let k = 0; k < 6; k++) G.fx.push({ k: 'ball', x: 30 + k * 60, y: F.gateY - 20, tx: st.segs[k] ? st.segs[k].x : 180, ty: st.segs[k] ? st.segs[k].y : 300, life: 0.4, max: 0.4 });
        if (st.segs[0]) text(st.segs[0].x, st.segs[0].y - 20, '退 10 节', 18, D.P.gold, 1);
        PF.vibrate('heavy');
        break;
      case 'win': {
        G.hitstop = 0.15;
        G.shake = 8;
        G.flash = 0.25;
        G.flashColor = '#fff3d0';
        snd('win');
        PF.vibrate('heavy');
        for (let k = 0; k < 5; k++) puff(F.w / 2 + (Math.random() - 0.5) * 200, 300 + (Math.random() - 0.5) * 300, 4, 10);
        G.mode = 'end';
        G.endTimer = 1.3;
        break;
      }
      case 'lose':
        G.shake = 10;
        G.flash = 0.3;
        G.flashColor = '#ff3b2f';
        snd('lose');
        PF.vibrate('heavy');
        G.timing.loseAt = PF.now();
        G.mode = 'end';
        G.endTimer = 0.6;
        break;
    }
  }
  st.events.length = 0;
}

function stepFx(dt) {
  for (let i = G.fx.length - 1; i >= 0; i--) {
    const p = G.fx[i];
    p.life -= dt;
    if (p.life <= 0) {
      G.fx.splice(i, 1);
      continue;
    }
    if (p.k === 'sq' || p.k === 'chunk' || p.k === 'gear') {
      p.vy += 520 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      if (p.spin) p.rot += p.spin * dt;
    } else if (p.k === 'spark') {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.9;
      p.vy *= 0.9;
    } else if (p.k === 'coin') {
      const u = clamp(1 - (p.life - 0) / (p.max - p.d), 0, 1);
      const e2 = u * u;
      p.x = p.x0 + (F.w - 64 - p.x0) * e2;
      p.y = p.y0 + (21 - p.y0) * e2 - Math.sin(u * Math.PI) * 40;
      if (p.life - dt <= 0) {
        G.goldBump = 1;
        snd('coin', 60, 0.12);
      }
    } else if (p.k === 'puff' || p.k === 'txt') {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }
  if (G.fx.length > FXMAX) G.fx.splice(0, G.fx.length - FXMAX);
}

function drawFx() {
  for (const p of G.fx) {
    const k = p.life / p.max;
    if (p.k === 'sq') {
      ctx.fillStyle = D.P.line;
      ctx.fillRect(p.x - p.s / 2 - 0.8, p.y - p.s / 2 - 0.8, p.s + 1.6, p.s + 1.6);
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    } else if (p.k === 'puff') {
      ctx.globalAlpha = k * 0.75;
      ctx.fillStyle = D.P.steam;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.s * (1.6 - k * 0.6), 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (p.k === 'txt') {
      ctx.globalAlpha = Math.min(1, k * 2);
      bigText(ctx, p.s, p.x, p.y, p.size, p.c);
      ctx.globalAlpha = 1;
    } else if (p.k === 'ring') {
      ctx.globalAlpha = k;
      ctx.strokeStyle = p.c;
      ctx.lineWidth = (p.w || 4) * k + 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (1.2 - k * 0.6), 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (p.k === 'rays') {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(G.t * 2);
      ctx.globalAlpha = k;
      ctx.fillStyle = D.P.gold;
      const rr = p.r || 46;
      D.star(ctx, 0, 0, rr * (1.4 - k * 0.4), rr * 0.26, 10);
      ctx.restore();
      ctx.globalAlpha = 1;
    } else if (p.k === 'combo') {
      const s = easeOutBack(clamp((p.max - p.life) / 0.2, 0, 1));
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.scale(s, s);
      ctx.globalAlpha = Math.min(1, k * 3);
      bigText(ctx, p.s, 0, 0, p.size, D.P.gold);
      ctx.restore();
      ctx.globalAlpha = 1;
    } else if (p.k === 'ball') {
      const u = 1 - k;
      const x = p.x + (p.tx - p.x) * u;
      const y = p.y + (p.ty - p.y) * u - Math.sin(u * Math.PI) * 60;
      ctx.fillStyle = D.P.line;
      ctx.beginPath();
      ctx.arc(x, y, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff9a3c';
      ctx.beginPath();
      ctx.arc(x, y, 3.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (p.k === 'chunk') {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.min(1, k * 2.5);
      ctx.fillStyle = D.P.line;
      ctx.fillRect(-p.w / 2 - 1, -p.h / 2 - 1, p.w + 2, p.h + 2);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
      ctx.globalAlpha = 1;
    } else if (p.k === 'gear') {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.min(1, k * 2.5);
      ctx.fillStyle = D.P.line;
      D.star(ctx, 0, 0, p.r + 2.5, p.r, 6);
      ctx.fillStyle = D.P.brassHi;
      D.star(ctx, 0, 0, p.r + 1.5, p.r - 0.5, 6);
      ctx.fillStyle = D.P.line;
      ctx.fillRect(-1, -1, 2, 2);
      ctx.restore();
      ctx.globalAlpha = 1;
    } else if (p.k === 'spark') {
      ctx.globalAlpha = Math.min(1, k * 1.5);
      ctx.strokeStyle = p.c;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03);
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (p.k === 'pop') {
      ctx.globalAlpha = k * 0.9;
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (1.3 - k * 0.5), 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (p.k === 'fire') {
      const u = 1 - k;
      ctx.globalAlpha = k;
      ctx.fillStyle = '#ff7a2a';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (0.5 + u * 0.6), 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffd65a';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (0.35 + u * 0.3) * k, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (p.k === 'scorch') {
      ctx.globalAlpha = k * 0.45;
      ctx.fillStyle = '#0d0806';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (p.k === 'coin') {
      if (p.life > p.max - p.d) continue;
      ctx.fillStyle = D.P.line;
      ctx.fillRect(p.x - 4, p.y - 4, 8, 8);
      ctx.fillStyle = D.P.gold;
      ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
      ctx.fillStyle = '#fffbe0';
      ctx.fillRect(p.x - 2, p.y - 2, 2, 2);
    } else if (p.k === 'cloud') {
      ctx.globalAlpha = Math.min(1, k * 3) * 0.55;
      ctx.fillStyle = '#dfe9f5';
      ctx.beginPath();
      ctx.arc(p.x + Math.sin(G.t * 2 + p.ph) * 4, p.y + Math.cos(G.t * 1.7 + p.ph) * 3, p.s, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (p.k === 'bolt') {
      // 雷链：一段段折线，白芯蓝边
      let sd = p.seed;
      const rnd = () => ((sd = (sd * 9301 + 49297) % 233280) / 233280 - 0.5);
      for (const [w, c] of [[5, 'rgba(120,170,255,' + (k * 0.8).toFixed(2) + ')'], [2, 'rgba(255,255,255,' + k.toFixed(2) + ')']]) {
        ctx.strokeStyle = c;
        ctx.lineWidth = w;
        ctx.beginPath();
        ctx.moveTo(p.pts[0].x, p.pts[0].y);
        sd = p.seed;
        for (let i = 1; i < p.pts.length; i++) {
          const a = p.pts[i - 1];
          const b = p.pts[i];
          for (let j = 1; j <= 3; j++) {
            const u = j / 3;
            const jit = j < 3 ? 9 : 0;
            ctx.lineTo(a.x + (b.x - a.x) * u + rnd() * jit, a.y + (b.y - a.y) * u + rnd() * jit);
          }
        }
        ctx.stroke();
      }
    } else if (p.k === 'chomp') {
      // 木犬咬下去：上下两排牙合上
      const u = 1 - k;
      const close = Math.min(1, u * 3);
      const gap = 22 * (1 - close);
      ctx.globalAlpha = Math.min(1, k * 2);
      for (const d of [-1, 1]) {
        const y0 = p.y + d * (gap + 6);
        ctx.fillStyle = D.P.line;
        ctx.fillRect(p.x - 22, y0 - 5, 44, 10);
        ctx.fillStyle = '#f4ead8';
        for (let i = 0; i < 5; i++) {
          ctx.beginPath();
          ctx.moveTo(p.x - 20 + i * 9, y0 - d * 3);
          ctx.lineTo(p.x - 16 + i * 9, y0 - d * 11);
          ctx.lineTo(p.x - 12 + i * 9, y0 - d * 3);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
    }
  }
}

// —— 按钮 ——
function button(id, x, y, w, h, label, opt) {
  opt = opt || {};
  G.buttons.push({ id, x, y, w, h, disabled: !!opt.disabled });
  const press = G.pressId === id ? 0.94 : 1;
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2);
  ctx.scale(press * (opt.pop || 1), press * (opt.pop || 1));
  const col = opt.disabled ? '#5a4b44' : opt.color || D.P.lac;
  const hi = opt.disabled ? '#6d5d55' : opt.hi || D.P.lacHi;
  ctx.fillStyle = D.P.line;
  roundRect(ctx, -w / 2 - 2, -h / 2 - 2, w + 4, h + 6, 10);
  ctx.fill();
  ctx.fillStyle = mix(col, '#000000', 0.35);
  roundRect(ctx, -w / 2, -h / 2 + 3, w, h, 9);
  ctx.fill();
  ctx.fillStyle = col;
  roundRect(ctx, -w / 2, -h / 2, w, h, 9);
  ctx.fill();
  ctx.fillStyle = hi;
  ctx.fillRect(-w / 2 + 8, -h / 2 + 4, w - 16, 3);
  bigText(ctx, label, opt.icon ? 10 : 0, 1, opt.size || 20, opt.disabled ? '#a89890' : '#fffaf0', D.P.line);
  if (opt.icon === 'ad') adIcon(-w / 2 + 22, 1);
  if (opt.icon === 'coin') coinIcon(-w / 2 + 20, 1, 8);
  ctx.restore();
}
function adIcon(x, y) {
  ctx.fillStyle = D.P.line;
  roundRect(ctx, x - 11, y - 8, 22, 16, 4);
  ctx.fill();
  ctx.fillStyle = '#fffaf0';
  ctx.beginPath();
  ctx.moveTo(x - 3, y - 5);
  ctx.lineTo(x + 5, y);
  ctx.lineTo(x - 3, y + 5);
  ctx.fill();
}
function coinIcon(x, y, r) {
  ctx.fillStyle = D.P.line;
  ctx.beginPath();
  ctx.arc(x, y, r + 1.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = D.P.gold;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = D.P.brassLo;
  ctx.fillRect(x - r * 0.35, y - r * 0.35, r * 0.7, r * 0.7);
}

// —— 局内 HUD ——
function drawHud(st) {
  // 关卡
  ctx.fillStyle = 'rgba(20,12,10,0.7)';

  ctx.fillRect(bx - 12, 16, 4, 3);

  }
}

function wrapText(str, n) {
  const out = [];
  for (let i = 0; i < str.length; i += n) out.push(str.slice(i, i + n));
  return out;
}
function drawCards(st) {
  ctx.fillStyle = 'rgba(10,6,5,0.76)';
  ctx.fillRect(-50, -50, F.w + 100, F.h + 100);
  const t = (PF.now() - G.cardsAt) / 1000;
  ctx.save();
  ctx.translate(F.w / 2, 190);
  ctx.rotate(G.t * 0.8);
  ctx.fillStyle = 'rgba(255,214,90,0.25)';
  D.star(ctx, 0, 0, 70, 20, 12);
  ctx.restore();
  bigText(ctx, '选一个', F.w / 2, 190, 26, D.P.gold);
  const cw = 108;
  const ch = 210;
  st.cards.forEach((id, i) => {
    const w = S.W[id];
    const cur = st.weapons[id] || 0;
    const next = cur + 1;
    const evo = next >= 5;
    const x = 9 + i * (cw + 9);
    const y = 236;
    const pop = easeOutBack(clamp((t - i * 0.07) / 0.22, 0, 1));
    G.buttons.push({ id: 'card' + i, x, y, w: cw, h: ch });
    ctx.save();
    ctx.translate(x + cw / 2, y + ch / 2);
    ctx.scale(pop, pop);
    const pref = st.buddy && st.buddy.prefer === id;
    ctx.fillStyle = D.P.line;
    roundRect(ctx, -cw / 2 - 3, -ch / 2 - 3, cw + 6, ch + 8, 12);
    ctx.fill();
    ctx.fillStyle = evo ? '#5a3f1a' : '#3b2a22';
    roundRect(ctx, -cw / 2, -ch / 2, cw, ch, 10);
    ctx.fill();
    if (evo) {
      ctx.strokeStyle = D.P.gold;
      ctx.lineWidth = 2.5;
      roundRect(ctx, -cw / 2 + 2, -ch / 2 + 2, cw - 4, ch - 4, 9);
      ctx.stroke();
    }
    ctx.fillStyle = w.color;
    ctx.fillRect(-cw / 2 + 6, -ch / 2 + 6, cw - 12, 4);
    // 新 / Lv
    bigText(ctx, cur ? (evo ? '进化' : 'Lv' + cur + '→' + next) : '新！', 0, -ch / 2 + 22, 13, cur ? (evo ? D.P.gold : '#cbb8a8') : '#7dff9a');
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    roundRect(ctx, -32, -ch / 2 + 32, 64, 60, 10);
    ctx.fill();
    D.drawWeaponIcon(ctx, id, 0, -ch / 2 + 62, 48);
    bigText(ctx, evo ? w.evo : w.name, 0, -ch / 2 + 110, 20, evo ? D.P.gold : '#fffaf0');
    // 这一级干什么（两三行）
    wrapText(w.lvDesc[next - 1], 7).slice(0, 3).forEach((ln, k) => bigText(ctx, ln, 0, -ch / 2 + 134 + k * 16, 12, '#e9dccb'));
    // 克哪些兵种（只标这一关会出的）
    const cs = S.counters(st, id);
    if (cs.length) {
      bigText(ctx, '克', -cw / 2 + 16, ch / 2 - 18, 13, '#ff9a6a');

    }
    if (pref) D.drawBuddy(ctx, st.buddy.id, cw / 2 - 12, -ch / 2 + 16, G.t, 0.9);
    ctx.restore();
  });
}

}

// —— 结算页 ——
function drawResult() {
  const r = G.result;
  const t = (PF.now() - G.resultAt) / 1000;
  ctx.fillStyle = 'rgba(10,6,5,0.9)';
  ctx.fillRect(-50, -50, F.w + 100, F.h + 100);
  const pop = easeOutBack(clamp(t / 0.25, 0, 1));
  ctx.save();
  ctx.translate(F.w / 2, 150);
  ctx.scale(pop, pop);
  if (r.win) {
    ctx.save();
    ctx.rotate(G.t);
    ctx.fillStyle = 'rgba(255,214,90,0.22)';
    D.star(ctx, 0, 0, 120, 40, 14);
    ctx.restore();
    bigText(ctx, '守住了！', 0, -10, 46, D.P.gold);
    bigText(ctx, '第' + (r.level + 1) + '关', 0, 44, 18, '#fffaf0');
  } else {
    if (r.near) bigText(ctx, '差一点！', 0, -56, 26, D.P.gold);
    bigText(ctx, '还差', -78, 8, 22, '#fffaf0');
    bigText(ctx, '' + r.left, 0, 6, 64, r.near ? D.P.gold : '#ff8a6a');
    bigText(ctx, '节', 70, 8, 22, '#fffaf0');
  }
  ctx.restore();

  // 打碎了多少：一条龙的进度条
  if (!r.win) {
    const bw = 260;
    const bx = F.w / 2 - bw / 2;
    ctx.fillStyle = D.P.line;
    roundRect(ctx, bx - 3, 222, bw + 6, 22, 7);
    ctx.fill();
    ctx.fillStyle = '#3a1410';
    roundRect(ctx, bx, 225, bw, 16, 5);
    ctx.fill();
    ctx.fillStyle = D.P.brass;
    roundRect(ctx, bx, 225, (bw * (r.total - r.left)) / r.total, 16, 5);
    ctx.fill();
    ctx.fillStyle = D.P.brassHi;
    ctx.fillRect(bx + 3, 226, Math.max(0, (bw * (r.total - r.left)) / r.total - 6), 3);
  }

  // 金币
  const gy = r.win && r.newBuddy ? 250 : 282;
  coinIcon(F.w / 2 - 54, gy, 11);
  bigText(ctx, '+' + (r.doubled ? r.gold * 2 : r.gold), F.w / 2 - 36, gy, 26, D.P.gold, D.P.line, 'left');
  const live = t > 0.3;
  if (!r.doubled && G.st.adsUsed < C.AD.maxPerRun) {
    button('double', F.w / 2 + 34, gy - 18, 96, 36, '翻倍', { icon: 'ad', size: 16, color: '#2f6b4a', hi: '#4f9a6c', disabled: !live });
  }

  // 新伙伴
  if (r.win && r.newBuddy) {
    const b = r.newBuddy;
    const bp = easeOutBack(clamp((t - 0.35) / 0.3, 0, 1));
    ctx.save();
    ctx.translate(F.w / 2, 330);
    ctx.scale(bp, bp);
    ctx.fillStyle = D.P.line;
    roundRect(ctx, -120, -38, 240, 76, 12);
    ctx.fill();
    ctx.fillStyle = '#3b2a22';
    roundRect(ctx, -117, -35, 234, 70, 10);
    ctx.fill();
    ctx.fillStyle = D.P.gold;
    ctx.fillRect(-111, -29, 222, 3);
    D.drawBuddy(ctx, b.id, -78, 4, G.t, 2.2);
    bigText(ctx, '新伙伴 ' + b.name, 26, -10, 20, D.P.gold);
    bigText(ctx, b.note, 26, 16, 12, '#fffaf0');
    ctx.restore();
  }

  // 右上角：换玩法
  button('menu', F.w - 100, 14, 88, 34, '换玩法', { size: 14, disabled: !live });

// 运镜最后推到的那个敌人：守城画龙（Boss 关大一号、发红光），进攻画要撞的城门
function drawPanFocus(g, x, y, lv) {
  g.save();
  g.translate(x, y);
  if (lv.mode === 'defend') {
    const k = lv.boss ? 2.1 : 1.6;
    if (lv.boss) {
      const gr = g.createRadialGradient(0, 0, 4, 0, 0, 90);
      gr.addColorStop(0, 'rgba(255,80,40,0.7)');
      gr.addColorStop(1, 'rgba(255,80,40,0)');
      g.fillStyle = gr;
      g.fillRect(-100, -100, 200, 200);
    }
    g.scale(k, k);
    // 龙头朝左：冲着画面左边的边城爬过来
    for (let i = 7; i >= 1; i--) RD.drawCar(g, i * 22, Math.sin(i * 0.9) * 6, -Math.PI / 2, i, 0, 0);
    RD.drawHead(g, 0, 0, -Math.PI / 2, 1, 0, lv.boss ? 1 : 0);
  } else {
    // 城门：砖墙 + 拱门 + 门上的数字
    g.fillStyle = '#7a5a3a';
    g.strokeStyle = LINE;
    g.lineWidth = 4;
    g.fillRect(-90, -70, 180, 140);
    g.strokeRect(-90, -70, 180, 140);
    g.strokeStyle = 'rgba(30,20,12,0.5)';
    g.lineWidth = 2;
    for (let r = 0; r < 7; r++) for (let c = 0; c < 6; c++) g.strokeRect(-90 + c * 30 + (r % 2 ? 15 : 0), -70 + r * 20, 30, 20);
    g.fillStyle = '#2a1a10';
    g.beginPath();
    g.moveTo(-36, 70);
    g.lineTo(-36, 0);
    g.arc(0, 0, 36, Math.PI, 0);
    g.lineTo(36, 70);
    g.closePath();
    g.fill();
    if (lv.boss) {
      g.fillStyle = '#c8402c';
      g.fillRect(-20, -100, 40, 26);
      g.strokeStyle = LINE;
      g.strokeRect(-20, -100, 40, 26);
    }
  }
  g.restore();
}
const S = () => (G.r.lv.mode === 'defend' ? F : A);

// —— 坐标 ——
const toField = (px, py) => [(px - ox) / scale, (py - oy) / scale];
const inR = (fx, fy, b) => fx >= b.x && fx <= b.x + b.w && fy >= b.y && fy <= b.y + b.h;
function btn(id, x, y, w, h, label, col, sub, opt) {
  opt = opt || {};
  G.btns.push({ id, x, y, w, h });
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  roundRect(ctx, x + 2, y + 4, w, h, 12);
  ctx.fill();
  ctx.fillStyle = opt.dis ? '#4a3e34' : col;
  ctx.strokeStyle = opt.on ? '#ffd65a' : LINE;
  ctx.lineWidth = opt.on ? 3 : 2;
  roundRect(ctx, x, y, w, h, 12);
  ctx.fill();
  ctx.stroke();
  bigText(ctx, label, x + w / 2, y + h / 2 - (sub ? 7 : 0), opt.size || (h < 40 ? 14 : 20), opt.dis ? '#a89880' : '#fff8e6', LINE);
  if (sub) bigText(ctx, sub, x + w / 2, y + h / 2 + 12, 11, '#ffe9b0', LINE);
}

// 手上的机关会在同一帧里被放走、叠掉、拆掉；凡是用 G.sel / G.dragM 之前先查它还指着东西，
// 指空了就清掉（检验报告 A9：放下最后一件的同一帧再点原格子，会把游戏点死）
function fixSel() {
  const r = G.r;
  const n = r ? r.bench.length : 0;
  if (G.sel >= n) G.sel = -1;
  const d = G.dragM;
  if (d && ((d.bi !== undefined && !(r && r.bench[d.bi])) || (d.si !== undefined && !(r && r.slots[d.si])))) G.dragM = null;
}

function onTouch(type, id, px, py) {
  fixSel();
  if (type === 'down' && G.cs) {
    G.cs.skip(); // 点一下跳过开局运镜
    return;
  }
  const [fx, fy] = toField(px, py);
  if (type === 'down') {
    for (let i = G.btns.length - 1; i >= 0; i--) {
      if (inR(fx, fy, G.btns[i])) {
        const bid = G.btns[i].id;
        // 手上的机关：按住就能拖
        if (bid.startsWith('tray') && !G.tip && !G.recipesOpen) {
          const bi = +bid.slice(4);
          if (!G.r || !G.r.bench[bi]) return; // 按钮表是上一帧画的，这格可能刚空
          G.dragM = { id, bi, fx, fy, fx0: fx, fy0: fy, moved: false, was: G.sel === bi };
          G.sel = bi;
          PF.vibrate('light'); // 拿起
          return;
        }
        // 场上的机关：按住也能拖（合、挪、换）
        const si = bid.startsWith('spot') ? +bid.slice(4) : bid.startsWith('slot') ? +bid.slice(4) : -1;
        if (si >= 0 && G.r && G.r.slots[si] && G.sel < 0 && !G.tip && !G.recipesOpen) {
          G.dragM = { id, si, kind: bid.slice(0, 4), fx, fy, fx0: fx, fy0: fy, moved: false };
          return;
        }
        act(bid);
        return;
      }
    }
    if (G.scr === 'play') G.sel = -1;
  } else if (type === 'move') {
    if (G.dragM && G.dragM.id === id) {
      G.dragM.fx = fx;
      G.dragM.fy = fy;
      if (Math.hypot(fx - G.dragM.fx0, fy - G.dragM.fy0) > 8) G.dragM.moved = true;
    }
    if (G.drag && G.drag.id === id && G.scr === 'play') G.st.targetX = clamp(G.drag.x0 + (fx - G.drag.fx0) * 1.15, 14, FW - 14);
  } else if (type === 'up') {
    if (G.dragM && G.dragM.id === id) {
      const d = G.dragM;
      G.dragM = null;
      if (d.si !== undefined) {
        // 从场上拖：合 / 挪 / 换；没拖动就当点一下（看射程）
        const tgt = d.moved ? dropTarget(fx, fy, d.si) : null;
        if (tgt && tgt.startsWith('tray')) {
          // 场上的拖回手上
          const m = G.r.slots[d.si];
          G.r.slots[d.si] = null;
          if (G.scr === 'play') m.installT = INSTALL_SEC; // 收回手上再放，也要重新装
          const same = G.r.bench.find((x) => x.id === m.id && x.tier + m.tier <= 4);
          if (same) same.tier += m.tier;
          else G.r.bench.push(m);
          snd('clang', 0, 0.5);
          PF.vibrate('light');
          G.sel = -1;
        } else if (tgt) {
          const to = +tgt.slice(4);
          const res = B.moveSlot(G.r, d.si, to);
          if (res && res.full) pop('已经满阶', FW / 2, 300, '#ff9a6a', 15);
          if (res && G.scr === 'play' && (res.res === 'move' || res.res === 'swap')) {
            // 波中挪动 / 对调：挪过去的（对调时两件都）要装 3 秒才开火
            G.r.slots[to].installT = INSTALL_SEC;
            if (res.res === 'swap' && G.r.slots[d.si]) G.r.slots[d.si].installT = INSTALL_SEC;
            showTip('install');
          }
          if (res) {
            snd(res.res === 'merge' ? 'evolve' : 'clang', 0, 0.5);
            PF.vibrate(res.res === 'merge' ? 'medium' : 'light');
            if (res.res === 'merge') {
              chargeUp();
              const p = G.r.lv.mode === 'defend' && G.scr === 'play' ? F.slotPos(to) : { x: FW / 2, y: G.scr === 'play' ? 540 : 120 };
              pop('叠成 ' + res.slot.tier + ' 阶！', p.x, p.y - 26, '#ffd65a', 16);
              sparks(p.x, p.y - 10, 12, '#ffd65a');
            }
            if (G.scr === 'play') G.spotView = { i: to, t: 1.6 };
          }
        } else if (!d.moved) act(d.kind + d.si);
      } else if (!d.moved) {
        if (d.was) G.sel = -1;
      } else {
        const tgt = dropTarget(fx, fy);
        if (tgt && tgt.startsWith('tray')) {
          // 手上两件同名的拖到一起：叠成高阶
          const j = +tgt.slice(4);
          const a = G.r.bench[d.bi];
          const b = G.r.bench[j];
          if (j !== d.bi && canStack(a, b)) {
            b.tier += a.tier;
            G.r.bench.splice(d.bi, 1);
            chargeUp();
            snd('evolve', 0, 0.5);
            PF.vibrate('medium');
            pop('叠成 ' + b.tier + ' 阶！', FW / 2, G.scr === 'play' ? 600 : 560, '#ffd65a', 16);
          }
          G.sel = -1;
        } else if (tgt) {
          G.sel = d.bi;
          act(tgt);
        } else G.sel = -1;
      }
    }
    if (G.drag && G.drag.id === id) G.drag = null;
  }
}

// 松手的地方有没有点位 / 车格（放宽一点，手指好放）
function dropTarget(fx, fy, skip) {
  let best = null;
  let bd = 1e9;
  for (const b of G.btns) {
    if (!(b.id.startsWith('spot') || b.id.startsWith('slot') || b.id.startsWith('tray'))) continue;
    if (skip !== undefined && +b.id.slice(4) === skip && !b.id.startsWith('tray')) continue;
    const cx = b.x + b.w / 2;
    const cy = b.y + b.h / 2;
    const d = Math.hypot(cx - fx, cy - fy);
    if (d < Math.max(b.w, b.h) * 0.9 && d < bd) {
      bd = d;
      best = b.id;
    }
  }
  return best;
}
function drawDragM() {
  const d = G.dragM;
  if (!d || !d.moved) return;
  const m = d.si !== undefined ? G.r.slots[d.si] : G.r.bench[d.bi];
  if (!m) return;
  const tgt = dropTarget(d.fx, d.fy, d.si);
  if (tgt && d.si !== undefined && !tgt.startsWith('tray')) {
    const t = G.r.slots[+tgt.slice(4)];
    if (canStack(t, m)) bigText(ctx, '叠成 ' + (m.tier + t.tier) + ' 阶', d.fx, d.fy - 52, 13, '#ffd65a', LINE);
  }
  if (tgt && tgt.startsWith('spot') && G.r.lv.mode === 'defend') {
    const p = F.slotPos(+tgt.slice(4));
    const tsi = +tgt.slice(4);
    const R = F.rangeOf(G.r, D.M[m.id], tsi);
    const bf = F.SPOTS[tsi].buff;
    if (bf) bigText(ctx, F.BUFF[bf].name + '：' + F.BUFF[bf].tip, d.fx, d.fy - 66, 12, '#9dff7a', LINE);
    if (R) {
      ctx.strokeStyle = 'rgba(120,255,120,0.9)';
      ctx.fillStyle = 'rgba(120,255,120,0.12)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(p.x, p.y, R, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }
  }
  machineIcon(m.id, m.tier, d.fx, d.fy - 24, 18, true);
}

// 手指点到按钮：成了轻震一下（照震动规矩：没成的点击不震，press 返回 false 就是没成）
function act(id) {
  if (press(id) !== false) PF.vibrate('light');
}

function press(id) {
  fixSel();
  const r = G.r;
  snd('tap', 40, 0.4);
  if (G.recipesOpen && id !== 'recipesClose' && !id.startsWith('make_')) return false;
  if (G.tip) {
    if (id !== 'tipNext') return false;
    G.tip.i++;
    if (G.tip.i >= TIPS[G.tip.key].length) G.tip = null;
    return;
  }
  if (id.startsWith('node')) {
    const i = +id.slice(4);
    if (!unlocked(i)) return false;
    G.lvIdx = i;
    G.bldView = null;
    G.scr = 'brief';
  } else if (id === 'go') startLevel(G.lvIdx);
  else if (id === 'back') G.scr = 'map';
  else if (id.startsWith('bld_')) G.bldView = id.slice(4);
  else if (id === 'pickBack') G.scr = 'map';
  else if (id === 'pickGo') {
    const b = D.BUILDERS.find((x) => x.id === (G.bldView || 'azhu'));
    if (!bUnlocked(b)) return false;
    meta.camp = { builder: b.id, cleared: {} };
    meta.builder = b.id;
    saveMeta();
    G.scr = 'map';
    snd('evolve', 0, 0.5);
  } else if (id === 'restart') G.confirm = true;
  else if (id === 'restartNo') G.confirm = false;
  else if (id === 'restartYes') {
    G.confirm = false;
    G.bldView = null;
    G.scr = 'pick';
  } else if (id === 'vibe') {
    meta.vibe = meta.vibe === false;
    PF.setVibrate(meta.vibe);
    saveMeta();
  } else if (id === 'meta') G.scr = 'meta';
  else if (id === 'old') SH.go('menu');
  else if (id.startsWith('card')) {
    if (G.cardsAt && PF.now() - G.cardsAt < 400) return false;
    B.pickCard(r, +id.slice(4));
    snd('pick', 0, 0.5);
  } else if (id.startsWith('mat_')) {
    const el = id.slice(4);
    const used = G.benchSel.filter((e) => e === el).length;
    if (G.benchSel.length < r.bench2 && r.mats[el] > used) G.benchSel.push(el);
    tutAdvance('mat');
  } else if (id === 'recipes') G.recipesOpen = true;
  else if (id === 'recipesClose') G.recipesOpen = false;
  else if (id.startsWith('bs')) {
    G.benchSel.splice(+id.slice(2), 1);
  } else if (id === 'combine' || id.startsWith('make_')) {
    if (id.startsWith('make_')) G.benchSel = D.M[id.slice(5)].els.slice();
    const mc = B.combine(r, G.benchSel);
    if (mc) {
      G.benchSel = [];
      G.sel = -1; // 合完不自动选中，免得点点位时误换
      const lucky = r.lastLucky;
      if (lucky) {
        pop('大成功！直接 ' + (mc.stacked ? mc.tier : 2) + ' 阶', FW / 2, G.scr === 'play' ? 545 : 200, '#ffd65a', 22);
        snd('evolve', 0, 0.7);
        G.flash = 0.15;
      } else if (mc.stacked) pop('手上的' + D.M[mc.id].name + '叠成 ' + mc.tier + ' 阶', FW / 2, G.scr === 'play' ? 580 : 520, '#ffd65a', 14);
      tutAdvance('combine');
      chargeUp();
      G.bagua = { t: 0, a0: G.baguaAng || 0, gold: lucky };
      PF.vibrate(lucky ? 'heavy' : 'medium'); // 合成 = 中；大成功 = 重，隔 0.12 秒再重一下
      if (lucky && typeof setTimeout === 'function') setTimeout(() => PF.vibrate('heavy'), 120);
      azSwing(() => {
        snd('clang', 0, 0.6);
        snd('upgrade', 0, 0.5);
        G.shake = Math.max(G.shake, 6);
        if (G.azAt) {
          sparks(G.azAt.x, G.azAt.y, 14, '#ffd65a');
          chunks(G.azAt.x, G.azAt.y, 6, '#c9933a', 0.8);
        }
      });
      if (!mc.stacked) {
        if (r.lv.mode === 'defend') pop(D.M[mc.id].name + '：拖到亮着的点位', FW / 2, 560, '#ffd65a', 15);
        else pop(D.M[mc.id].name + '：拖到车上的格子', FW / 2, G.scr === 'play' ? 540 : 520, '#ffd65a', 15);
      }
    } else return false;
  } else if (id.startsWith('tray')) {
    const i = +id.slice(4);
    if (!r || !r.bench[i]) return false;
    G.sel = G.sel === i ? -1 : i;
  } else if (id === 'smash') {
    if (G.scr !== 'play') return false;
    if ((r.charge || 0) < CHARGE_MAX) {
      pop('还差 ' + (CHARGE_MAX - (r.charge || 0)) + ' 格：合成、叠阶都攒', smashPos().x - 60, smashPos().y - 34, '#cbb8a8', 12);
      return false;
    }
    if (S().smash(G.st)) {
      r.charge = 0;
      azSwing(() => {});
      handleEvents();
    } else {
      pop(r.lv.mode === 'defend' ? '路上还没有龙' : '前面没有砖', smashPos().x - 40, smashPos().y - 34, '#cbb8a8', 13);
      return false;
    }
  } else if (id === 'buySpot') {
    if (F.buySpot(r)) {
      snd('upgrade', 0, 0.6);
      const p = F.slotPos(r.slots.length - 1);
      sparks(p.x, p.y, 14, '#ffd65a');
      pop('修好新点位！', p.x, p.y - 30, '#ffd65a', 15);
      tutAdvance('buySpot');
    } else {
      snd('alarm', 200, 0.3);
      pop('铜钱不够', FW / 2, 600, '#ff8a5a', 14);
      return false;
    }
  } else if (id.startsWith('spot')) {
    const si = +id.slice(4);
    if (G.sel >= 0) {
      const res = B.place(r, G.sel, si);
      const ok = res && !res.blocked && !res.full;
      if (res && res.blocked) pop('一夫当关：只能放 1 件', FW / 2, 560, '#ff8a5a', 15);
      else if (res && res.full) pop('已经满阶（最高 4 阶）', FW / 2, 300, '#ff9a6a', 15);
      else if (res) {
        if (res.res === 'merge') PF.vibrate('medium');
        if (res.res === 'swap' && G.scr === 'play') {
          // 换下来的那件回到手上：再放出去也要装 3 秒（不然等于免费挪）
          const back = r.bench[r.bench.length - 1];
          if (back) back.installT = INSTALL_SEC;
        }
        snd(res.res === 'merge' ? 'evolve' : 'clang', 0, 0.5);
        if (res.res === 'merge') chargeUp();
        const p = F.slotPos(si);
        pop(res.res === 'merge' ? '叠成 ' + res.slot.tier + ' 阶！' : '放下 ' + D.M[res.slot.id].name, p.x, p.y - 26, '#ffd65a', 15);
        tutAdvance('place');
        G.spotView = { i: si, t: 1.6 };
      }
      G.sel = -1;
      if (!ok) return false;
    } else if (r.slots[si]) G.spotView = { i: si, t: 1.6 };
    else return false;
  } else if (id.startsWith('slot')) {
    const si = +id.slice(4);
    if (G.sel >= 0) {
      const res = B.place(r, G.sel, si);
      const ok = res && !res.blocked && !res.full;
      if (res && res.blocked) pop('一夫当关：只能放 1 件', FW / 2, 120, '#ff8a5a', 16);
      else if (res && res.full) pop('已经满阶（最高 4 阶）', FW / 2, 300, '#ff9a6a', 15);
      else if (res) {
        if (res.res === 'merge') PF.vibrate('medium');
        snd(res.res === 'merge' ? 'evolve' : 'clang', 0, 0.5);
        if (res.res === 'merge') chargeUp();
        if (res.res === 'merge') pop('合成 ' + D.M[res.slot.id].name + ' ' + res.slot.tier + ' 阶！', FW / 2, 120, '#ffd65a', 18);
      }
      G.sel = -1;
      if (!ok) return false;
    } else return false;
  } else if (id === 'sell') {
    if (G.sel < 0) return false;
    B.sell(r, G.sel);
    G.sel = -1;
  } else if (id.startsWith('buy')) {
    if (B.buy(r, +id.slice(3))) snd('coin', 0, 0.6);
    else {
      snd('alarm', 200, 0.3);
      return false;
    }
  } else if (id.startsWith('lock')) {
    const i = +id.slice(4);
    r.locked[i] = !r.locked[i];
  } else if (id === 'refresh') {
    if (!B.refresh(r)) {
      snd('alarm', 200, 0.3);
      return false;
    }
  } else if (id === 'nextWave') {
    r.slots.concat(r.bench).forEach((m) => m && (m.installT = 0)); // 波间挪的不用等
    G.scr = 'play';
    G.benchSel = [];
    G.sel = -1;
    S().nextWave(G.st);
    G.banner = r.wave >= r.lv.waves - 1 ? 1.8 : 1.2;
    handleEvents();
  } else if (id === 'again') startLevel(G.lvIdx);
  else if (id === 'toMap') G.scr = 'map';
  else if (id.startsWith('up_')) return buyMeta(id.slice(3));
  else if (id.startsWith('rec_')) {
    const mid = id.slice(4);
    if (meta.pages >= 3 && meta.recipes.indexOf(mid) < 0) {
      meta.pages -= 3;
      meta.recipes.push(mid);
      saveMeta();
      snd('evolve', 0, 0.5);
    } else return false;
  }
}

const META_KEYS = { slots: 'slotsLv', bench: 'benchLv', wallHp: 'wallHpLv', cartSlots: 'cartLv', dragonLen: 'dragonLv' };
function metaCost(k) {
  const m = D.META[k];
  const lv = meta[META_KEYS[k]];
  const maxLv = k === 'wallHp' ? m.max : m.max - m.base;
  if (lv >= maxLv) return null;
  return typeof m.cost === 'function' ? m.cost(lv) : m.cost[lv];
}
function buyMeta(k) {
  const c = metaCost(k);
  if (c === null || meta.mojing < c) {
    snd('alarm', 200, 0.3);
    return false;
  }
  meta.mojing -= c;
  meta[META_KEYS[k]]++;
  saveMeta();
  snd('upgrade', 0, 0.6);
}

// —— 第一关教学：点两次金 → 点合 → 点亮着的点位 → 龙出发 ——
const TUT = [
  { text: '龙要来了！两个一样的元素就能合一件机关：你有两个金，点「连弩」', target: 'make_nu' },
  { text: '连弩到手上了。按住它，拖到路边亮着的点位放下（圈里的才打得到）', target: 'spot' },
  { text: '放好了！龙来了。打碎龙节会掉材料，凑够了「能合」那里就会亮', target: null },
];
function tutAdvance(what) {
  const T = G.tut;
  if (!T) return;
  if (T.step === 0 && what === 'combine') T.step = 1;
  else if (T.step === 1 && what === 'place') {
    T.step = 2;
    T.t = 0;
    meta.tutDone = true;
    saveMeta();
  }
}
function drawTut() {
  const T = G.tut;
  const step = TUT[T.step];
  // 指着要点的东西
  const b = step.target === 'spot' ? G.btns.find((x) => x.id.startsWith('spot') && !G.r.slots[+x.id.slice(4)]) : step.target ? G.btns.find((x) => x.id === step.target) : null;
  if (b) {

    roundRect(ctx, b.x - 4 - k * 3, b.y - 4 - k * 3, b.w + 8 + k * 6, b.h + 8 + k * 6, 12);
    ctx.stroke();
    // 小手
    const hx = b.x + b.w / 2 + 14;
    const hy = b.y + b.h / 2 + 10 + k * 6;
    ctx.fillStyle = '#fff8e6';
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(hx, hy);
    ctx.lineTo(hx + 10, hy + 22);
    ctx.lineTo(hx + 3, hy + 20);
    ctx.lineTo(hx - 2, hy + 28);
    ctx.lineTo(hx - 6, hy + 18);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }
  const y = T.step === 1 ? 70 : 520;
  ctx.fillStyle = 'rgba(26,18,12,0.92)';
  ctx.strokeStyle = '#ffd65a';
  ctx.lineWidth = 2;
  roundRect(ctx, 14, y, FW - 28, 54, 12);
  ctx.fill();
  ctx.stroke();
  bigText(ctx, '第 ' + (Math.min(T.step, 1) + 1) + ' 步 / 2', 28, y + 16, 11, '#ffd65a', LINE, 'left');

function showTip(key) {

}
function tipRect() {
  const st = TIPS[G.tip.key][G.tip.i];

  const bs = G.btns.filter((b) => st.target.split('|').some((t) => (t.endsWith('*') ? b.id.startsWith(t.slice(0, -1)) : b.id === t)));
  if (!bs.length) return null;
  const x0 = Math.min(...bs.map((b) => b.x));
  const y0 = Math.min(...bs.map((b) => b.y));
  const x1 = Math.max(...bs.map((b) => b.x + b.w));
  const y1 = Math.max(...bs.map((b) => b.y + b.h));
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

// 机关台上做好的机关，自动摆上城墙 / 车：有一样的就叠上去升阶，没有就放空位
function autoPlace(r) {
  let msg = '';
  for (let bi = r.bench.length - 1; bi >= 0; bi--) {
    const mc = r.bench[bi];
    let si = r.slots.findIndex((x) => x && x.id === mc.id && x.tier === mc.tier && x.tier < 4);
    if (si < 0) si = r.slots.findIndex((x) => !x);
    if (si < 0) continue;
    const res = B.place(r, bi, si);
    if (res && !res.blocked) msg = res.res === 'merge' ? '叠成 ' + res.slot.tier + ' 阶' : '摆上第 ' + (si + 1) + ' 格';
  }
  return msg;
}
