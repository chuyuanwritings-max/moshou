// —— 结算：局外奖励 ——
function finish(win, left) {
  if (G.finished) return;
  G.finished = true;
  PF.vibrate('heavy'); // 过关、失败都是重
  const lv = G.r.lv;
  const i = G.lvIdx;
  const first = win && !meta.cleared[lv.id];
  let mojing = win ? 30 + i * 8 + (lv.boss ? 30 : 0) : 8 + G.r.wave * 4;
  if (win && !first) mojing = Math.round(mojing * 0.3); // 重复通关只给三成，防挂机刷
  let pages = win ? 1 + (lv.boss ? 1 : 0) : 0;
  const chars = [];
  if (win) {
    const c = G.r.R() < 0.5 ? '墨' : '斗';
    chars.push(c);
    if (lv.boss) chars.push(c === '墨' ? '斗' : '墨');
  }
  // 三星：守城 = 过关 / 城门没掉血 / 每一波都赶在倒计时前打光；进攻 = 过关 / 车血过半 / 车血八成以上
  let stars = 0;
  const why = [];
  if (win) {
    stars = 1;
    if (lv.mode === 'defend') {
      if (!G.r.breached) stars++;
      else why.push('城门别掉血');
      if (!G.r.leftover) stars++;
      else why.push('每波都赶在倒计时前打光');
    } else {
      const k = G.r.hp / G.r.hpMax;
      if (k >= 0.5) stars++;
      else why.push('车血留一半');
      if (k >= 0.8) stars++;
      else why.push('车血留八成');
    }
  }
  meta.stars = meta.stars || {};
  const oldStars = meta.stars[lv.id] || 0;
  const starBonus = Math.max(0, stars - oldStars) * 20; // 每颗新星首次 +20 墨晶
  if (stars > oldStars) meta.stars[lv.id] = stars;
  mojing += starBonus;
  meta.mojing += mojing;
  meta.pages += pages;
  chars.forEach((c) => (meta.chars[c] = (meta.chars[c] || 0) + 1));
  // 神机凑齐了没有
  const sj = D.SHENJI[0];
  let newShenji = false;
  if (!meta.shenji[sj.id] && sj.chars.every((c) => (meta.chars[c] || 0) >= sj.need)) {
    meta.shenji[sj.id] = true;
    newShenji = true;
  }
  const newB = [];
  if (win) {
    meta.camp.cleared[lv.id] = true;
    const before = D.BUILDERS.filter(bUnlocked).length;
    meta.ever[lv.id] = true;
    meta.cleared[lv.id] = true;
    D.BUILDERS.forEach((b) => b.unlockIf === lv.id && newB.push(b.name));
    if (D.BUILDERS.filter(bUnlocked).length === before) newB.length = 0;
  }
  meta.runs++;
  saveMeta();
  G.result = { win, first, mojing, pages, chars, newShenji, newB, left, wave: G.r.wave, t: 0, stars, oldStars, starBonus, why, combo: G.combo ? G.combo.best : 0 };
  setTimeout0(() => (G.scr = 'result'), win ? 700 : 500);
}
function setTimeout0(fn, ms) {
  if (G.bot) fn();
  else if (typeof setTimeout === 'function') setTimeout(fn, ms);
  else fn();
}

// —— 每帧 ——
let last = PF.now();
let acc = 0;
function frame() {
  fixSel();
  const now = PF.now();
  let dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  G.t += dt;
  if (G.hitstop > 0) {
    G.hitstop -= dt;
    dt *= 0.2;
  }
  if (G.tut) {
    G.tut.t += dt;
    if (G.tut.step >= 2 && G.tut.t > 3.5) G.tut = null;
  }
  if (G.cs) {
    if (G.bot) G.cs.skip();
    else G.cs.update(dt * 1000);
  }
  const tutHold = (G.tut && G.tut.step < 2 && !G.bot) || !!G.tip || !!G.recipesOpen || !!G.cs;
  if (G.scr === 'play' && G.st && !tutHold) {
    acc += dt * G.speed;
    let n = 0;
    while (acc >= 1 / 60 && n++ < 40 && G.scr === 'play') {
      acc -= 1 / 60;
      if (G.r.lv.mode === 'attack') G.st.targetX = S().botX(G.st);
      if (G.bot && Math.random() < 0.02) botCombine();
      if (G.bot && (G.r.charge || 0) >= CHARGE_MAX) press('smash');
      S().step(G.st, 1 / 60);
      handleEvents();
    }
  }
  if (G.bot && G.scr === 'shop') botShop();
  if (G.banner > 0) G.banner -= dt;
  if (G.spotView) {
    G.spotView.t -= dt;
    if (G.spotView.t <= 0) G.spotView = null;
  }
  if (G.teach) {
    G.teach.t += dt;
    if (G.teach.t > 5) G.teach = null;
  }
  stepAz(dt);
  if (G.bagua) {
    G.bagua.t += dt;
    if (G.bagua.t >= (G.bagua.gold ? 0.7 : 0.38)) {
      G.baguaAng = G.bagua.a0 + Math.PI * (G.bagua.gold ? 2 : 1);
      G.bagua = null;
    }
  }
  stepFx(dt);
  render();
}
function botCombine() {
  const r = G.r;
  for (let k = 0; k < 10; k++) {
    const m = D.MACHINES.find((mm) => r.recipes.indexOf(mm.id) >= 0 && mm.els.every((e) => r.mats[e] >= mm.els.filter((x) => x === e).length));
    if (!m) break;
    B.combine(r, m.els);
  }
  autoPlace(r);
}
function botShop() {
  const r = G.r;
  while (r.cards) B.pickCard(r, 0);
  for (let k = 0; k < 10; k++) {
    const m = D.MACHINES.find((mm) => r.recipes.indexOf(mm.id) >= 0 && mm.els.every((e) => r.mats[e] >= mm.els.filter((x) => x === e).length));
    if (!m) break;
    B.combine(r, m.els);
  }
  press('nextWave');
}

function stepFx(dt) {
  for (let i = G.fx.length - 1; i >= 0; i--) {
    const f = G.fx[i];
    f.t += dt;
    if (f.t >= f.life) {
      G.fx.splice(i, 1);
      continue;
    }
    if (f.vx !== undefined) {
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      if (f.k === 'chunk') f.vy += 500 * dt;
    }
    if (f.k === 'orb') {
      const k = f.t / f.life;
      f.x = f.x0 + (f.tx - f.x0) * k * k;
      f.y = f.y0 + (f.ty - f.y0) * k - Math.sin(k * Math.PI) * 40;
    }
  }
  for (let i = G.pops.length - 1; i >= 0; i--) {
    const p = G.pops[i];
    p.t += dt;
    p.y -= 34 * dt;
    if (p.t > p.life) G.pops.splice(i, 1);
  }
  G.shake *= Math.pow(0.003, dt);
  if (G.combo) G.combo.bump = Math.max(0, G.combo.bump - dt * 6);
  if (G.flash > 0) G.flash -= dt;
}

// —— 画 ——
function render() {
  fixSel(); // 这一帧里手上的东西可能刚被自动摆走（机器人、自动摆放），画之前再查一遍
  G.btns = [];
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#120d0a';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(scale, scale);
  ctx.beginPath();
  ctx.rect(0, 0, FW, FH);
  ctx.clip();
  if (G.scr === 'pick') drawPick();
  else if (G.scr === 'map' || G.scr === 'brief') drawMap();
  else if (G.scr === 'meta') drawMeta();
  else {
    ctx.save();
    ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
    if (G.r.lv.mode === 'defend') drawDefend();
    else drawAttack();
    drawFx();
    ctx.restore();
    drawHud();
    if (G.scr === 'play') drawLiveBench();
    if (G.scr === 'play') drawSmashBtn();
    if (G.tut && G.scr === 'play') drawTut();
    if (G.scr === 'shop') drawShop();
    if (G.scr === 'result') drawResult();
  }
  if (G.scr === 'brief') drawBrief();
  if (G.scr === 'play' || G.scr === 'shop') drawDragM();
  if (G.recipesOpen) drawRecipes();
  if (G.tip) drawTip();
  if (G.cs) G.cs.draw();
  ctx.restore();
  checkTips();
}

// 什么时候弹哪张提示
function checkTips() {
  if (G.tip || G.bot || !G.r || G.cs) return;
  const r = G.r;
  const seen = (k) => meta.tips && meta.tips[k];
  const stackIdx = () => r.bench.findIndex((m) => r.slots.some((x) => canStack(x, m)));
  if (G.scr === 'play' && !G.tut && (r.lv.mode === 'defend' || seen('attack'))) {
    const mk = B.makeable(r);
    if (!seen('recipes') && mk.some((m) => m.els[0] !== m.els[1])) return showTip('recipes');
    if (!seen('merge') && stackIdx() >= 0) {
      G.sel = stackIdx();
      return showTip('merge');
    }
    if (!seen('combine2') && mk.length && G.st.t > 3) return showTip('combine2');
    if (!seen('smash') && (r.charge || 0) >= CHARGE_MAX) return showTip('smash');
    if (r.lv.mode === 'defend' && !seen('buySpot') && F.spotCost(r) !== null && r.coins >= F.spotCost(r)) return showTip('buySpot');
  }
  if (G.scr === 'play' && r.lv.mode === 'attack' && G.st.t > 0.5) showTip('attack');
  if (G.scr === 'shop') {
    if (r.cards) return showTip('cards');
    if (!seen('mergeShop') && stackIdx() >= 0 && (seen('shop') || seen('station'))) {
      G.sel = stackIdx();
      return showTip('mergeShop');
    }
    showTip(r.lv.mode === 'defend' ? 'shop' : 'station');
  }
}

function drawBg(dark) {
  if (IMG.bg.ok) {
    const sc = Math.max(FW / IMG.bg.width, FH / IMG.bg.height);
    ctx.drawImage(IMG.bg, (FW - IMG.bg.width * sc) / 2, (FH - IMG.bg.height * sc) / 2, IMG.bg.width * sc, IMG.bg.height * sc);
  } else {
    ctx.fillStyle = CITY.ground;
    ctx.fillRect(0, 0, FW, FH);
  }
  ctx.fillStyle = 'rgba(10,6,4,' + dark + ')';
  ctx.fillRect(0, 0, FW, FH);
}

// —— 阿铸一锤（Cc 11-24 定）：每合成一次、叠阶一次攒一格，8 格满了点一下砸 ——
const CHARGE_MAX = 8;
function chargeUp() {
  const r = G.r;
  if (!r) return;
  const before = r.charge || 0;
  r.charge = Math.min(CHARGE_MAX, before + 1);
  if (r.charge === CHARGE_MAX && before < CHARGE_MAX) {
    snd('upgrade', 0, 0.6);
    const b = smashPos();
    pop('阿铸攒满了！', b.x - 30, b.y - 36, '#ffd65a', 15);
  }
}
const smashPos = () => (G.r.lv.mode === 'defend' ? { x: 330, y: 552 } : { x: 330, y: 518 });
function drawSmashBtn() {
  const r = G.r;
  const c = r.charge || 0;
  const { x, y } = smashPos();
  const R = 22;
  const full = c >= CHARGE_MAX;
  G.btns.push({ id: 'smash', x: x - R - 4, y: y - R - 4, w: R * 2 + 8, h: R * 2 + 8 });
  if (full) {
    const k = 0.5 + 0.5 * Math.sin(G.t * 8);
    ctx.fillStyle = 'rgba(255,214,90,' + (0.25 + 0.35 * k) + ')';
    ctx.beginPath();
    ctx.arc(x, y, R + 8 + k * 4, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = full ? '#c8402c' : 'rgba(30,22,16,0.85)';
  ctx.strokeStyle = LINE;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(x, y, R, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  // 8 格能量：一圈小弧
  for (let i = 0; i < CHARGE_MAX; i++) {
    const a0 = -Math.PI / 2 + (i / CHARGE_MAX) * Math.PI * 2 + 0.06;
    const a1 = -Math.PI / 2 + ((i + 1) / CHARGE_MAX) * Math.PI * 2 - 0.06;
    ctx.strokeStyle = i < c ? '#ffd65a' : 'rgba(255,255,255,0.18)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(x, y, R + 3, a0, a1);
    ctx.stroke();
  }
  bigText(ctx, '锤', x, y - (full ? 4 : 0), full ? 17 : 15, full ? '#fff8e6' : '#cbb8a8', LINE);
  if (full) bigText(ctx, '点！', x, y + 12, 10, '#ffe9b0', LINE);
  else bigText(ctx, c + '/' + CHARGE_MAX, x, y + R + 12, 9, '#cbb8a8', LINE);
}

// 风水位的记号：高台插小旗，烽火台点火盆；下面一行小字写加成
function drawBuffMark(p, open) {
  const a = open ? 1 : 0.55;
  ctx.save();
  ctx.globalAlpha = a;
  if (p.buff === 'high') {
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.x + 22, p.y + 12);

    ctx.fillStyle = '#3f8ad8';
    ctx.beginPath();
    ctx.moveTo(p.x + 22, p.y - 20);
    ctx.lineTo(p.x + 36, p.y - 15);
    ctx.lineTo(p.x + 22, p.y - 10);

    ctx.fillStyle = '#4a3a2a';

    ctx.arc(p.x + 23, p.y - 2 + Math.sin(G.t * 12) * 1.5, 5, 0, Math.PI * 2);

// 波中挪过的机关：压暗 + 一圈进度 +「装」字，转满才开火
const INSTALL_SEC = 3;
function drawInstall(x, y, R, left) {
  const k = 1 - left / INSTALL_SEC;
  ctx.fillStyle = 'rgba(10,6,4,0.55)';
  ctx.beginPath();
  ctx.arc(x, y, R, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#ffd65a';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(x, y, R, -Math.PI / 2, -Math.PI / 2 + k * Math.PI * 2);
  ctx.stroke();
  bigText(ctx, '装', x, y, Math.max(10, R * 0.7), '#ffd65a', LINE);
}
// 名字第一个字撞了的，换一个字
const ICON_CH = { huixuan: '刃', huochong: '铳' };
// 机关图标：五行颜色的圆 + 名字第一个字 + 阶数小点
function machineIcon(id, tier, x, y, s, hl) {
  const m = D.M[id];
  ctx.save();
  ctx.translate(x, y);
  const els = m.els;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.arc(2, 3, s, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, 0, s, Math.PI / 2, Math.PI * 1.5);
  ctx.fillStyle = D.EL[els[0]].col;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(0, 0, s, -Math.PI / 2, Math.PI / 2);
  ctx.fillStyle = D.EL[els[1]].col;
  ctx.fill();
  ctx.strokeStyle = hl ? '#ffd65a' : LINE;
  ctx.lineWidth = hl ? 3 : 2;

  ctx.arc(0, 0, s, 0, Math.PI * 2);

    ctx.fillStyle = '#ffd65a';

    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc((i - (tier - 1) / 2) * 7, s + 5, 3, 0, Math.PI * 2);

    ctx.stroke();

}

// —— 守城 ——
let pathCache = null;
function drawDefend() {
  const st = G.st;
  drawBg(0.42);
  if (!pathCache) {
    pathCache = PF.createOffscreen(FW, FH);
    const g = pathCache.getContext('2d');
    g.lineCap = 'round';
    g.lineJoin = 'round';
    const pts = [];
    for (let s = 0; s <= st.path.len; s += 6) pts.push(st.path.at(s));
    for (const [w, c] of [[40, '#1E1A16'], [36, '#7a5a34'], [26, '#9a7446']]) {
      g.strokeStyle = c;
      g.lineWidth = w;
      g.beginPath();
      pts.forEach((p, i) => (i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)));
      g.stroke();
    }
    g.setLineDash([4, 10]);
    g.strokeStyle = 'rgba(30,26,22,0.5)';
    g.lineWidth = 2;
    g.beginPath();
    pts.forEach((p, i) => (i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)));
    g.stroke();
  }
  ctx.drawImage(pathCache, 0, 0);
  // 区域：网、泥、火墙、岩浆
  for (const z of st.zones) {
    if (z.kind === 'fire') {
      ctx.fillStyle = 'rgba(255,110,40,' + (0.25 + 0.15 * Math.sin(G.t * 20)) + ')';
      ctx.fillRect(0, z.y - 18, FW, 36);
      continue;
    }
    ctx.fillStyle = z.kind === 'mud' ? 'rgba(110,80,40,0.55)' : 'rgba(90,200,80,0.35)';
    for (let s = Math.max(0, z.s0); s < Math.min(st.path.len, z.s1); s += 14) {
      const p = st.path.at(s);
      ctx.beginPath();
      ctx.arc(p.x, p.y, 16, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  for (const z of st.pools) {
    ctx.fillStyle = 'rgba(255,90,20,0.35)';
    ctx.beginPath();
    ctx.arc(z.x, z.y, z.R, 0, Math.PI * 2);
    ctx.fill();
  }
  // 龙：尾巴往头画
  for (const d of st.dragons) {
    const segs = F.alive(d);
    for (let i = segs.length - 1; i >= 0; i--) {
      const g = segs[i];
      if (g.s < -20) continue;
      const p = F.segXY(st, g);
      if (i === 0) {
        if (d.glow > 0) {
          ctx.fillStyle = 'rgba(255,40,20,' + (0.35 + 0.25 * Math.sin(G.t * 30)) + ')';
          ctx.beginPath();
          ctx.arc(p.x, p.y, 26, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.scale(d.boss ? 1.7 : 1.15, d.boss ? 1.7 : 1.15);
        RD.drawHead(ctx, 0, 0, p.a + Math.PI / 2, d.dash > 0 ? 1 : 0, G.t, 0);
        if (d.boss) {
          ctx.fillStyle = '#7c8791';
          ctx.strokeStyle = LINE;
          ctx.lineWidth = 1.5;
          ctx.rotate(p.a + Math.PI / 2);
          roundRect(ctx, -12, -20, 24, 10, 3);
          ctx.fill();
          ctx.stroke();
        }
        ctx.restore();
      } else {
        RD.drawCar(ctx, p.x, p.y, p.a + Math.PI / 2, g.id, G.t, g.frozen > 0 ? 0.3 : 0);
        if (g.type === 'shield') {
          ctx.fillStyle = '#aab4bd';
          ctx.strokeStyle = LINE;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(p.x + Math.cos(p.a) * 10, p.y + Math.sin(p.a) * 10, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
        } else if (g.type === 'gold') {
          ctx.fillStyle = '#ffd65a';
          ctx.strokeStyle = LINE;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 10, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + 0.4 * Math.sin(G.t * 6)) + ')';
          ctx.beginPath();
          ctx.arc(p.x - 3, p.y - 4, 3, 0, Math.PI * 2);
          ctx.fill();
        } else if (g.type === 'powder') {
          ctx.fillStyle = '#9b3b26';
          ctx.beginPath();
          ctx.arc(p.x, p.y, 7, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffcf4a';
          ctx.beginPath();
          ctx.arc(p.x + 5, p.y - 7, 2.5 + Math.sin(G.t * 20), 0, Math.PI * 2);
          ctx.fill();
        }
      }
      if (g.burnT > 0) {
        ctx.fillStyle = 'rgba(255,120,40,0.5)';
        ctx.beginPath();
        ctx.arc(p.x, p.y - 8, 5 + Math.sin(G.t * 25) * 2, 0, Math.PI * 2);
        ctx.fill();
      }
      bigText(ctx, String(Math.ceil(g.hp)), p.x, p.y + 1, g.hp >= 100 ? 9 : 11, '#fff8e6', LINE);
    }
  }
  // 城墙 + 城门（龙撞进门扣血）
  const wy = F.WALL_Y;
  ctx.fillStyle = '#6f5d4a';
  ctx.fillRect(0, wy - 6, FW, 50);
  ctx.strokeStyle = LINE;
  ctx.lineWidth = 2;
  ctx.strokeRect(-2, wy - 6, FW + 4, 50);
  for (let x = 4; x < FW; x += 30) {
    if (Math.abs(x + 9 - FW / 2) < 34) continue;
    ctx.fillStyle = '#7d6a55';
    ctx.fillRect(x, wy - 18, 18, 12);
    ctx.strokeRect(x, wy - 18, 18, 12);
  }
  ctx.fillStyle = '#3a2a1c';
  roundRect(ctx, FW / 2 - 24, wy - 4, 48, 46, 18);
  ctx.fill();
  drawAzhu(330, 598, 86);
  G.azAt = { x: 330, y: 592 };
  // 点位：城外高低不同的箭楼、土台
  const r = G.r;
  const hand = G.sel >= 0 ? D.M[r.bench[G.sel].id] : null;
  F.SPOTS.forEach((p, i) => {
    const open = i < r.slots.length;
    const mc = r.slots[i];
    // 射程圈：选中手上的机关时，空点位都画一圈；点了某个点位就画它的圈
    const showR = hand && open && (!mc || canStack(mc, r.bench[G.sel])) ? F.rangeOf(r, hand, i) : G.spotView && G.spotView.i === i && mc ? F.rangeOf(r, D.M[mc.id], i) : 0;
    if (showR) {
      ctx.fillStyle = 'rgba(255,214,90,0.10)';
      ctx.strokeStyle = 'rgba(255,214,90,0.7)';
      ctx.setLineDash([6, 6]);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(p.x, p.y, showR, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.setLineDash([]);
    }
    // 台子
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.ellipse(p.x + 3, p.y + 14, 22, 9, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = open ? '#8d7962' : 'rgba(70,58,46,0.7)';
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 2;
    roundRect(ctx, p.x - 20, p.y - 8, 40, 22, 6);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = open ? '#a8937a' : 'rgba(90,76,60,0.7)';
    roundRect(ctx, p.x - 17, p.y - 14, 34, 12, 4);
    ctx.fill();
    ctx.stroke();
    if (p.buff) drawBuffMark(p, open);
    if (!open) {
      const cost = i === r.slots.length ? F.spotCost(r) : null;
      if (cost !== null) {
        const can = r.coins >= cost;
        G.btns.push({ id: 'buySpot', x: p.x - 26, y: p.y - 22, w: 52, h: 40 });
        ctx.fillStyle = can ? 'rgba(200,150,40,0.9)' : 'rgba(60,48,36,0.85)';
        roundRect(ctx, p.x - 26, p.y - 4, 52, 18, 9);
        ctx.fill();
        bigText(ctx, '修 ' + cost, p.x, p.y + 5, 11, can ? '#fff8e6' : '#a89880', LINE);
      } else bigText(ctx, '锁', p.x, p.y + 2, 11, '#a89880', LINE);
      return;
    }
    G.btns.push({ id: 'spot' + i, x: p.x - 24, y: p.y - 30, w: 48, h: 48 });
    if (mc && !(G.dragM && G.dragM.si === i && G.dragM.moved)) {
      machineIcon(mc.id, mc.tier, p.x, p.y - 14, 14, G.spotView && G.spotView.i === i);
      if (mc.installT > 0) drawInstall(p.x, p.y - 14, 19, mc.installT);
    }
    if (mc && hand && canStack(mc, r.bench[G.sel])) {
      ctx.fillStyle = '#c8402c';
      roundRect(ctx, p.x + 4, p.y - 38, 30, 18, 9);
      ctx.fill();
      bigText(ctx, '叠↑', p.x + 19, p.y - 29, 11, '#fff8e6', LINE);
    }
    else if (hand) {
      ctx.strokeStyle = 'rgba(255,214,90,' + (0.6 + 0.4 * Math.sin(G.t * 10)) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p.x, p.y - 8, 16, 0, Math.PI * 2);
      ctx.stroke();
      bigText(ctx, '放', p.x, p.y - 8, 12, '#ffd65a', LINE);
    }
  });
  // 子弹
  ctx.strokeStyle = '#fff3c4';
  ctx.lineWidth = 2.5;
  for (const b of st.bolts) {
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x, b.y + 14);
    ctx.stroke();
  }
  for (const s of st.shots) {
    if (s.kind === 'bolt') {
      ctx.fillStyle = s.mid === 'huochong' ? '#ff8a3a' : '#f1ede2';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.mid === 'huochong' ? 4 : 3, 0, Math.PI * 2);
      ctx.fill();
    } else if (s.kind === 'lob') {
      const k = s.t / s.dur;
      const x = s.x + (s.tx - s.x) * k;
      const y = s.y + (s.ty - s.y) * k - Math.sin(k * Math.PI) * 80;
      ctx.fillStyle = s.mid === 'zhengqi' ? '#e8f0f4' : '#6e3b1c';
      ctx.strokeStyle = LINE;
      ctx.beginPath();
      ctx.arc(x, y, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    } else if (s.kind === 'blade') {
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(G.t * 20);
      ctx.strokeStyle = '#cfe8ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, 10, 0, Math.PI * 1.4);
      ctx.stroke();
      ctx.restore();
    }
  }
}

// —— 进攻 ——
function drawAttack() {
  const st = G.st;
  RD.drawGround(ctx, CITY, st.head.wy);
  const vis = (wy, m) => sy(wy) > -m && sy(wy) < FH + m;
  for (const f of st.fences) if (vis((f.wy0 + f.wy1) / 2, 160)) RD.drawFence(ctx, f.x, sy(f.wy1), sy(f.wy0));
  st.legEnds.forEach((wy, i) => {
    if (i >= st.legEnds.length - 1 || !vis(wy, 30)) return;
    const y = sy(wy);
    ctx.fillStyle = 'rgba(200,64,44,0.85)';
    ctx.fillRect(0, y - 12, FW, 24);
    bigText(ctx, '驿 站 · 升级、买东西', FW / 2, y, 14, '#fff8e6', LINE);
  });
  for (const it of st.items) {
    if (!it.alive || !vis(it.wy, 30)) continue;
    RD.drawGear(ctx, it.x, sy(it.wy), 10, G.t);
    bigText(ctx, '+' + it.n, it.x, sy(it.wy) - 18, 13, '#9dff7a', LINE);
  }
  for (const b of st.blocks) if (b.alive && vis(b.wy, 220)) RD.drawBlock(ctx, CITY, b, sy(b.wy), G.t, st.chewing === b ? 2.5 : 0, false);
  for (const bo of st.bolts) RD.drawBolt(ctx, bo.x, sy(bo.wy));
  for (const s of st.shots) RD.drawShot(ctx, s.x, sy(s.wy));
  // 车
  const segs = A.segments(st, A.bodyLen(st)).map((p) => ({ x: p.x, y: sy(p.wy) }));
  const r = G.r;
  if (st.car === 'dragon') {
    for (let i = segs.length - 1; i >= 1; i--) {
      const p = segs[i];
      const q = segs[i - 1];
      const a = Math.atan2(q.x - p.x, p.y - q.y);
      RD.drawCar(ctx, p.x, p.y, a, i, G.t, G.flash > 0 && G.flashCol === '#ff4a2a' ? G.flash * 3 : 0);
      if (r.slots[i - 1]) machineIcon(r.slots[i - 1].id, r.slots[i - 1].tier, p.x, p.y, 9);
    }
    RD.drawHead(ctx, segs[0].x, segs[0].y, 0, st.chewing ? 1 : 0, G.t, st.guard > 0 ? 1 : 0);
  } else {
    // 小工程车：一辆黄铜车，车上的格子
    const p = segs[0];
    ctx.save();
    ctx.translate(p.x, p.y + 8);
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    roundRect(ctx, -20, -18, 44, 52, 8);
    ctx.fill();
    ctx.fillStyle = '#3a2a1c';
    for (const [wx, wyy] of [[-22, -10], [17, -10], [-22, 18], [17, 18]]) ctx.fillRect(wx, wyy, 5, 10);
    ctx.fillStyle = RD.BRASS;
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 2;
    roundRect(ctx, -18, -22, 36, 50, 8);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#7a1e14';
    roundRect(ctx, -12, -30, 24, 12, 4);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
    r.slots.forEach((s, i) => {
      const cx = p.x + (r.slots.length > 1 ? (i % 2 ? 9 : -9) : 0);
      const cy = p.y + 4 + Math.floor(i / 2) * 18;
      if (s) machineIcon(s.id, s.tier, cx, cy, 8);
      else {
        ctx.strokeStyle = 'rgba(30,26,22,0.6)';
        ctx.strokeRect(cx - 7, cy - 7, 14, 14);
      }
    });
    if (st.guard > 0) {
      ctx.strokeStyle = 'rgba(120,220,100,0.8)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 30, 0, Math.PI * 2);
      ctx.stroke();
    }

}

function drawFx() {
  for (const f of G.fx) {
    const a = 1 - f.t / f.life;
    ctx.save();
    ctx.globalAlpha = clamp(a * 1.5, 0, 1);
    if (f.k === 'chunk') {
      ctx.fillStyle = f.col;
      ctx.fillRect(f.x - f.s / 2, f.y - f.s / 2, f.s, f.s);
    } else if (f.k === 'spark') {
      ctx.strokeStyle = f.col;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(f.x, f.y);
      ctx.lineTo(f.x - f.vx * 0.04, f.y - f.vy * 0.04);
      ctx.stroke();
    } else if (f.k === 'star') {
      // 白色放射刺光
      ctx.translate(f.x, f.y);
      ctx.fillStyle = '#ffffff';
      const k = 1 + (f.t / f.life) * 0.6;
      for (let i = 0; i < 8; i++) {
        ctx.rotate(Math.PI / 4);
        ctx.beginPath();
        ctx.moveTo(0, -3);
        ctx.lineTo(0, -22 * k * (i % 2 ? 0.6 : 1));
        ctx.lineTo(3, -3);
        ctx.fill();
      }
    } else if (f.k === 'smoke') {
      ctx.fillStyle = 'rgba(240,236,228,0.5)';
      ctx.beginPath();
      ctx.arc(f.x, f.y - f.t * 30, 6 + f.t * 16, 0, Math.PI * 2);
      ctx.fill();
    } else if (f.k === 'orb') {
      ctx.fillStyle = f.col;
      ctx.strokeStyle = LINE;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(f.x, f.y, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    } else if (f.k === 'ring') {
      ctx.strokeStyle = '#ffb04a';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.R * (0.5 + f.t / f.life), 0, Math.PI * 2);
      ctx.stroke();
    } else if (f.k === 'bolt') {
      ctx.strokeStyle = '#9fe8ff';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      f.pts.forEach((p, i) => (i ? ctx.lineTo(p.x + (Math.random() - 0.5) * 6, p.y) : ctx.moveTo(p.x, p.y)));
      ctx.stroke();
    }
    ctx.restore();
  }
  for (const p of G.pops) {
    ctx.save();
    ctx.globalAlpha = clamp(1 - (p.t / p.life - 0.6) / 0.4, 0, 1);
    bigText(ctx, p.text, p.x, p.y, p.size * easeOutBack(Math.min(1, p.t / 0.15)), p.col, LINE);
    ctx.restore();
  }
  if (G.flash > 0) {
    ctx.fillStyle = G.flashCol;
    ctx.globalAlpha = Math.min(0.45, G.flash);
    ctx.fillRect(0, 0, FW, FH);
    ctx.globalAlpha = 1;
  }
}

// 波次进度条：一格一波，打过的变亮，最后一波插红旗（Boss 关是龙头）
function drawWaveBar(x0, y0, w) {
  const r = G.r;
  const st = G.st;
  const n = r.lv.waves;
  const gw = w / n;
  for (let i = 0; i < n; i++) {
    const x = x0 + i * gw;
    let k = i < r.wave ? 1 : i === r.wave && st.waveDur ? clamp(1 - st.waveT / st.waveDur, 0, 1) : 0;
    if (r.lv.mode === 'attack' && i === r.wave && st.legEnds) {
      // 进攻：这一段开了多远
      const a = i > 0 ? st.legEnds[i - 1] : 220;
      const b = st.legEnds[i] || a + 1;
      k = clamp((st.head.wy - a) / (b - a), 0, 1);
    }
    if (G.scr !== 'play' && i === r.wave) k = 0;
    ctx.fillStyle = '#3a2c20';
    roundRect(ctx, x + 1, y0, gw - 2, 10, 4);
    ctx.fill();
    if (k > 0) {
      ctx.fillStyle = i === n - 1 ? '#ff6a4a' : '#ffd65a';
      roundRect(ctx, x + 1, y0, Math.max(4, (gw - 2) * k), 10, 4);
      ctx.fill();
    }
  }
  // 红旗
  const fx = x0 + w - 6;
  ctx.strokeStyle = '#e8d8c0';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(fx, y0 + 12);
  ctx.lineTo(fx, y0 - 6);
  ctx.stroke();
  ctx.fillStyle = '#e8402c';
  ctx.beginPath();
  ctx.moveTo(fx, y0 - 6);
  ctx.lineTo(fx - 10, y0 - 2);
  ctx.lineTo(fx, y0 + 2);
  ctx.fill();
  const lab = r.lv.mode === 'attack' ? (r.lv.boss ? '最后撞城门：弩车守着' : '最后一段撞城门') : r.lv.boss ? '最后一波：铁头龙' : '最后一波是大波';
  bigText(ctx, lab, x0 + w / 2, y0 + 26, 10, '#ffb0a0', LINE);
  // 连碎计数
  const cb = G.combo;
  if (cb && cb.n >= 3 && G.t - cb.t < 1.2 && G.scr === 'play') {
    const sz = 16 + Math.min(cb.n, 30) * 0.4 + cb.bump * 6;
    bigText(ctx, '连碎 ×' + cb.n, FW - 12, 74, sz, cb.n >= 10 ? '#ffd65a' : '#fff8e6', LINE, 'right');
  }
}

}

// 放了第一个材料后，哪些材料能跟它合出（已解锁的）机关
function partners(r) {
  if (G.benchSel.length !== 1) return null;
  const a = G.benchSel[0];
  const set = new Set();
  D.MACHINES.forEach((m) => {
    if (r.recipes.indexOf(m.id) < 0) return;
    const i = m.els.indexOf(a);
    if (i >= 0) set.add(m.els[1 - i]);
  });
  return set;
}
// 材料按钮：能配的亮绿圈，配不上的变暗
function matBtn(r, e, x, y, w, h, size, label) {
  const left = r.mats[e] - G.benchSel.filter((q) => q === e).length;
  const pt = partners(r);
  const ok = !pt || pt.has(e);
  btn('mat_' + e, x, y, w, h, label, left > 0 && ok ? D.EL[e].dark : '#3a3028', '', { size, dis: left <= 0 || !ok });
  if (pt && ok && left > 0) {
    ctx.strokeStyle = 'rgba(120,255,120,' + (0.6 + 0.4 * Math.sin(G.t * 10)) + ')';
    ctx.lineWidth = 3;
    roundRect(ctx, x - 2, y - 2, w + 4, h + 4, 12);
    ctx.stroke();
  }
}
// 黑白太极 + 八卦：垫在机关台格子底下，合成成功时转半圈
function drawBagua(cx, cy, R) {
  const sp = G.bagua ? G.bagua : null;
  let ang = 0;
  let glow = 0;
  if (sp) {
    const dur = sp.gold ? 0.7 : 0.38;
    const k = Math.min(1, sp.t / dur);
    ang = sp.a0 + Math.PI * (sp.gold ? 2 : 1) * (1 - Math.pow(1 - k, 3)); // 大成功转一整圈
    glow = 1 - k;
  } else ang = G.baguaAng || 0;
  ctx.save();
  ctx.translate(cx, cy);
  if (glow > 0) {
    ctx.fillStyle = sp.gold ? 'rgba(255,200,40,' + 0.85 * glow + ')' : 'rgba(255,240,180,' + 0.6 * glow + ')';
    ctx.beginPath();
    ctx.arc(0, 0, R * (1.15 + glow * 0.5), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.rotate(ang);
  // 八卦：外圈八组卦线
  ctx.fillStyle = 'rgba(30,24,18,0.9)';
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, Math.PI * 2);
  ctx.fill();
  const TRI = ['111', '011', '101', '001', '110', '010', '100', '000'];
  ctx.fillStyle = '#d8cdb8';
  TRI.forEach((t, i) => {
    ctx.save();
    ctx.rotate((i / 8) * Math.PI * 2);
    for (let k = 0; k < 3; k++) {
      const yy = -R + 3 + k * 4;
      if (t[k] === '1') ctx.fillRect(-7, yy, 14, 2.4);
      else {
        ctx.fillRect(-7, yy, 5.5, 2.4);
        ctx.fillRect(1.5, yy, 5.5, 2.4);
      }
    }
    ctx.restore();
  });
  // 太极
  const r2 = R * 0.56;
  ctx.fillStyle = '#f4efe6';
  ctx.beginPath();
  ctx.arc(0, 0, r2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1E1A16';
  ctx.beginPath();
  ctx.arc(0, 0, r2, -Math.PI / 2, Math.PI / 2);
  ctx.arc(0, r2 / 2, r2 / 2, Math.PI / 2, -Math.PI / 2, true);
  ctx.arc(0, -r2 / 2, r2 / 2, Math.PI / 2, -Math.PI / 2, false);
  ctx.fill();
  ctx.fillStyle = '#f4efe6';
  ctx.beginPath();
  ctx.arc(0, r2 / 2, r2 / 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1E1A16';
  ctx.beginPath();
  ctx.arc(0, -r2 / 2, r2 / 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#1E1A16';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(0, 0, r2, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function countLines(text, maxW, size) {
  ctx.font = '900 ' + size + 'px "PingFang SC", "Heiti SC", sans-serif';
  let line = '';
  let n = 1;
  for (const c of text) {
    if (ctx.measureText(line + c).width > maxW) {
      n++;
      line = c;
    } else line += c;
  }
  return n;
}
function wrap(text, x, y, maxW, size) {
  ctx.font = '900 ' + size + 'px "PingFang SC", "Heiti SC", sans-serif';
  let line = '';
  let yy = y;
  for (const c of text) {
    if (ctx.measureText(line + c).width > maxW) {
      bigText(ctx, line, x, yy, size, '#ffe9c4', LINE, 'left');
      line = c;
      yy += size + 5;
    } else line += c;
  }
  if (line) bigText(ctx, line, x, yy, size, '#ffe9c4', LINE, 'left');
}

// 五角星：on = 拿到；fresh = 这次新拿的（会闪）
function drawStar(x, y, R, on, fresh) {
  const k = fresh ? 1 + 0.15 * Math.sin(G.t * 10) : 1;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(k, k);
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + (i * Math.PI) / 5;
    const rr = i % 2 ? R * 0.45 : R;
    if (i) ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
    else ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fillStyle = on ? '#ffd65a' : '#3a2c20';
  ctx.strokeStyle = LINE;
  ctx.lineWidth = Math.max(1.5, R / 8);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

  ctx.stroke();
  ctx.strokeStyle = LINE;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x - 22, y - 10 - pull);
  ctx.quadraticCurveTo(x, y - 2, x + 22, y - 10 - pull);
  ctx.stroke();
  ctx.strokeStyle = BRASS;
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.fillStyle = BRASS_L;
  ctx.fillRect(x - 1, y - 18, 2, 12);
}

function drawGate(ctx, b, y, t, shake) {
  const w = C.FIELD.w;
  const h = 92;
  const top = y - h / 2 - 34;
  const dx = shake ? (Math.random() - 0.5) * shake : 0;
  ctx.save();
  ctx.translate(dx, 0);
  // 城墙
  ctx.fillStyle = '#7d6a55';
  ctx.strokeStyle = LINE;
  ctx.lineWidth = 2;
  ctx.fillRect(0, top - 40, w, h + 74);
  for (let i = 0; i < 10; i++) {
    ctx.fillStyle = i % 2 ? '#8d7962' : '#6f5d4a';
    ctx.fillRect(i * 36, top - 58, 24, 20);
    ctx.strokeRect(i * 36, top - 58, 24, 20);
  }
  ctx.strokeRect(0, top - 40, w, h + 74);
  ctx.strokeStyle = 'rgba(30,26,22,0.4)';
  ctx.lineWidth = 1;
  for (let r = 0; r < 6; r++) {
    for (let c = 0; c < 10; c++) ctx.strokeRect(c * 40 + (r % 2) * 20 - 20, top - 40 + r * 20, 40, 20);
  }
  // 门洞 + 两扇红门
  const gx = w / 2;
  const gw = 220;
  ctx.fillStyle = '#2a1a10';
  ctx.beginPath();
  ctx.moveTo(gx - gw / 2, y + h / 2);
  ctx.lineTo(gx - gw / 2, top + 24);
  ctx.quadraticCurveTo(gx, top - 22, gx + gw / 2, top + 24);
  ctx.lineTo(gx + gw / 2, y + h / 2);
  ctx.closePath();
  ctx.fill();
  const dmg = 1 - b.n / b.n0;
  ctx.fillStyle = mix('#b8342a', '#5a1a12', dmg * 0.6);
  ctx.strokeStyle = LINE;
  ctx.lineWidth = 2;
  for (const side of [-1, 1]) {
    ctx.beginPath();
    const x0 = gx + side * 2;
    const x1 = gx + side * (gw / 2 - 6);
    ctx.moveTo(x0, y + h / 2);
    ctx.lineTo(x0, top + 6);
    ctx.lineTo(x1, top + 26);
    ctx.lineTo(x1, y + h / 2);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // 铜钉
    ctx.fillStyle = BRASS;
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        const px = gx + side * (18 + c * 24);
        const py = top + 36 + r * 22;
        ctx.beginPath();
        ctx.arc(px, py, 3.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
    }
    ctx.fillStyle = mix('#b8342a', '#5a1a12', dmg * 0.6);
  }
  // 裂缝随伤害变多
  ctx.strokeStyle = LINE;
  ctx.lineWidth = 2;
  for (let k = 0; k < Math.floor(dmg * 7); k++) {
    const sx = gx + ((k * 53) % 180) - 90;
    ctx.beginPath();
    ctx.moveTo(sx, y + h / 2);
    ctx.lineTo(sx + 8, y + h / 2 - 20 - k * 4);
    ctx.lineTo(sx - 4, y + h / 2 - 34 - k * 5);
    ctx.stroke();
  }
  if (b.boss === 'ballista') {
    // 城楼上三张巨弩
    for (const bx of [w * 0.2, w * 0.5, w * 0.8]) {
      ctx.fillStyle = '#5a3a1e';
      ctx.strokeStyle = LINE;
      ctx.lineWidth = 2;
      roundRect(ctx, bx - 8, top - 92, 16, 40, 4);
      ctx.fill();
      ctx.stroke();
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(bx - 34, top - 70);
      ctx.quadraticCurveTo(bx, top - 52, bx + 34, top - 70);
      ctx.stroke();
      ctx.strokeStyle = BRASS;
      ctx.lineWidth = 2.5;
      ctx.stroke();
    }
  } else if (b.boss === 'beast' && b.door) {
    // 铁壁 + 来回跑的镇墓兽脸（只有脸能啃）
    ctx.fillStyle = 'rgba(70,80,88,0.92)';
    ctx.fillRect(0, top - 40, w, h + 74);
    const dx = b.door.x;
    const dw = b.door.w;
    ctx.fillStyle = '#3d6a5e';
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 2.5;
    roundRect(ctx, dx - dw / 2, top - 30, dw, h + 56, 16);
    ctx.fill();
    ctx.stroke();
    // 角、眼、獠牙
    ctx.fillStyle = BRASS_L;
    for (const sd of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(dx + sd * 30, top - 24);
      ctx.quadraticCurveTo(dx + sd * 58, top - 60, dx + sd * 40, top - 70);
      ctx.lineTo(dx + sd * 22, top - 26);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#ff3b1f';
      ctx.beginPath();
      ctx.arc(dx + sd * 20, top + 10, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#fff8e6';
      ctx.beginPath();
      ctx.moveTo(dx + sd * 14, y + h / 2 - 34);
      ctx.lineTo(dx + sd * 20, y + h / 2 - 8);
      ctx.lineTo(dx + sd * 26, y + h / 2 - 34);
      ctx.fill();
      ctx.fillStyle = BRASS_L;
    }
    bigText(ctx, String(b.n), dx, top + 46, 30, '#ffd65a', LINE);
    ctx.restore();
    return;
  } else if (b.boss === 'general') {
    // 将军俑：门上一张大陶俑脸，回血时冒绿光
    ctx.fillStyle = '#c98a5c';
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(gx, top + 34, 40, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#2b1d16';
    ctx.fillRect(gx - 50, top - 14, 100, 14);
    ctx.fillRect(gx - 18, top + 26, 10, 4);
    ctx.fillRect(gx + 8, top + 26, 10, 4);
    ctx.fillRect(gx - 12, top + 50, 24, 4);
    if (b.n < b.n0) {
      ctx.strokeStyle = 'rgba(120,255,140,' + (0.35 + 0.3 * Math.sin(t * 8)) + ')';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(gx, top + 34, 46, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
  // 门匾数字
  ctx.fillStyle = '#2b1c12';
  roundRect(ctx, gx - 46, top - 34, 92, 40, 6);
  ctx.fill();
  ctx.strokeStyle = BRASS;
  ctx.lineWidth = 2;
  ctx.stroke();
  bigText(ctx, String(b.n), gx, top - 13, 30, '#ffd65a', LINE);
  ctx.restore();
}

// —— 零件和道具 ——
function drawGear(ctx, x, y, r, t) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(t * 1.5);
  ctx.fillStyle = BRASS;
  ctx.strokeStyle = LINE;
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  for (let i = 0; i < 16; i++) {
    const a = (i / 16) * Math.PI * 2;
    const rr = i % 2 ? r : r * 0.74;
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = BRASS_D;
  ctx.beginPath();
  ctx.arc(0, 0, r * 0.32, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.arc(x, y, r * 0.55, -2.4, -1.6);
  ctx.stroke();
}

function drawItem(ctx, it, y, t) {
  const bob = Math.sin(t * 4 + it.x) * 2;
  if (it.kind === 'part') {
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(it.x + 2, y + 13, 11, 4, 0, 0, Math.PI * 2);
    ctx.fill();
    drawGear(ctx, it.x, y + bob, 11, t);
    bigText(ctx, String(it.n), it.x, y - 19 + bob, 15, '#fff8e6', LINE);
    return;
  }
  if (it.kind === 'chest') return drawChest(ctx, it.x, y + bob, t, 1);
  const blink = 0.75 + Math.sin(t * 10) * 0.25;
  ctx.save();
  ctx.globalAlpha = blink;
  ctx.fillStyle = 'rgba(255,240,180,0.35)';
  ctx.beginPath();
  ctx.arc(it.x, y + bob, 22, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  drawPowerIcon(ctx, it.kind, it.x, y + bob, 1);
}

function drawChest(ctx, x, y, t, k) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(k || 1, k || 1);
  ctx.fillStyle = 'rgba(255,220,120,' + (0.25 + 0.2 * Math.sin(t * 8)) + ')';
  ctx.beginPath();
  ctx.arc(0, 0, 26, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = LINE;
  ctx.lineWidth = 2;
  ctx.fillStyle = '#8a4f24';
  roundRect(ctx, -16, -8, 32, 22, 4);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = BRASS;
  roundRect(ctx, -17, -17, 34, 11, 4);
  ctx.fill();
  ctx.stroke();
  ctx.fillRect(-3, -9, 6, 10);
  ctx.strokeRect(-3, -9, 6, 10);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-12, -14);
  ctx.lineTo(-4, -14);
  ctx.stroke();
  ctx.restore();
}

// 墨家机关兵（从上往下看）：发髻、褐衣、横着一杆戈
function drawFoe(ctx, f, y, t) {
  const x = f.x;
  const walk = f.stun > 0 ? 0 : Math.sin(t * 14 + f.wy) * 4;
  ctx.fillStyle = 'rgba(20,12,6,0.3)';
  ctx.beginPath();
  ctx.ellipse(x + 3, y + 5, 14, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = LINE;
  ctx.lineWidth = 1.6;
  ctx.fillStyle = '#3a2a1c';
  ctx.fillRect(x - 9, y + 4 + walk, 5, 8);
  ctx.fillRect(x + 4, y + 4 - walk, 5, 8);
  ctx.fillStyle = '#6b4a2e';
  roundRect(ctx, x - 12, y - 8, 24, 16, 6);
  ctx.fill();
  ctx.stroke();
  // 戈
  const dir = f.vx >= 0 ? 1 : -1;
  ctx.strokeStyle = LINE;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x - dir * 10, y + 2);
  ctx.lineTo(x + dir * 24, y - 6);
  ctx.stroke();
  ctx.fillStyle = '#cfd6dd';
  ctx.beginPath();
  ctx.moveTo(x + dir * 24, y - 6);
  ctx.lineTo(x + dir * 32, y - 12);
  ctx.lineTo(x + dir * 26, y - 1);
  ctx.closePath();
  ctx.fill();
  ctx.lineWidth = 1.2;
  ctx.stroke();
  ctx.fillStyle = '#e2b48a';
  ctx.beginPath();
  ctx.arc(x, y - 4, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#1E1A16';
  ctx.beginPath();
  ctx.arc(x, y - 6, 4, 0, Math.PI * 2);
  ctx.fill();
  if (f.stun > 0) bigText(ctx, '晕', x, y - 22, 12, '#ffd65a', LINE);
}

function drawShot(ctx, x, y) {
  ctx.strokeStyle = LINE;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(x, y + 12);
  ctx.lineTo(x, y - 8);
  ctx.stroke();
  ctx.strokeStyle = BRASS_L;
  ctx.lineWidth = 1.4;
  ctx.stroke();
  ctx.fillStyle = '#e8eef3';
  ctx.beginPath();
  ctx.moveTo(x - 3.5, y - 6);
  ctx.lineTo(x, y - 14);
  ctx.lineTo(x + 3.5, y - 6);
  ctx.closePath();
  ctx.fill();
}

// 喷火：从龙嘴到砖的一道火柱
function drawFlame(ctx, x, y0, y1, k, lv) {
  const w = lv >= 3 ? 26 : 18;
  ctx.save();
  ctx.globalAlpha = k;
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, '#fff3a0');
  g.addColorStop(0.4, '#ffb02e');
  g.addColorStop(1, 'rgba(230,60,20,0.6)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(x - 6, y0);
  ctx.quadraticCurveTo(x - w, (y0 + y1) / 2, x - w * 0.6, y1);
  ctx.lineTo(x + w * 0.6, y1);
  ctx.quadraticCurveTo(x + w, (y0 + y1) / 2, x + 6, y0);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// 特殊车厢：在普通车厢上加一样看得见的东西；进化后更大、发光
function drawSpecialCar(ctx, id, x, y, a, lv, t, armor) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(a);
  const big = lv >= 3 ? 1.25 : 1;
  ctx.scale(big, big);
  if (lv >= 3) {
    ctx.fillStyle = 'rgba(255,214,90,' + (0.25 + 0.15 * Math.sin(t * 6)) + ')';
    ctx.beginPath();
    ctx.arc(0, 0, 20, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.strokeStyle = LINE;
  ctx.lineWidth = 1.5;
  if (id === 'bow') {
    ctx.fillStyle = '#6b4424';
    roundRect(ctx, -3, -14, 6, 18, 2);
    ctx.fill();
    ctx.stroke();
    const n = lv >= 3 ? 3 : 1;
    for (let k = 0; k < n; k++) {
      const off = (k - (n - 1) / 2) * 7;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-14 + off * 0.3, -6 + Math.abs(off) * 0.4);
      ctx.quadraticCurveTo(off, -16, 14 + off * 0.3, -6 + Math.abs(off) * 0.4);
      ctx.stroke();
      ctx.strokeStyle = BRASS;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.strokeStyle = LINE;
    }
  } else if (id === 'armor') {
    ctx.fillStyle = '#8d98a2';
    roundRect(ctx, -14, -13, 28, 26, 5);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = LINE;
    for (let k = 0; k < (armor || 0); k++) {
      ctx.fillStyle = '#ffd65a';
      ctx.beginPath();
      ctx.arc(-9 + k * 4.5, 8, 1.8, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (id === 'magnet') {
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(0, -2, 8, Math.PI, 0, true);
    ctx.stroke();
    ctx.strokeStyle = RED;
    ctx.lineWidth = 3.5;
    ctx.stroke();
  } else if (id === 'forge') {
    ctx.fillStyle = '#3a2a1c';
    roundRect(ctx, -9, -9, 18, 18, 4);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,' + Math.round(140 + 60 * Math.sin(t * 9)) + ',40,1)';
    ctx.beginPath();
    ctx.arc(0, 1, 5.5, 0, Math.PI * 2);
    ctx.fill();
  } else if (id === 'powder') {
    ctx.fillStyle = '#6e3b1c';
    roundRect(ctx, -8, -10, 16, 20, 5);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = BRASS;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-8, -3);
    ctx.lineTo(8, -3);
    ctx.moveTo(-8, 4);
    ctx.lineTo(8, 4);
    ctx.stroke();
  }
  ctx.restore();
}

// 卡片上的小图标
function drawCarIcon(ctx, id, x, y, k, t, lv) {
  lv = lv || 1;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(k, k);
  if (id === 'fire') {
    drawHead(ctx, 0, 6, 0, 1, t, 0);
    drawFlame(ctx, 0, -14, -32, 1, 2);
  } else if (id === 'tooth') {
    drawHead(ctx, 0, 0, 0, 1, t, 0);
    ctx.fillStyle = '#cfd6dd';
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-8, -18);
    ctx.lineTo(0, -34);
    ctx.lineTo(8, -18);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  } else {
    drawCar(ctx, 0, 0, 0, 0, t, 0);
    drawSpecialCar(ctx, id, 0, 0, 0, lv, t, 3);
  }
  if (lv >= 3) {
    ctx.strokeStyle = 'rgba(255,214,90,0.9)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, -4, 30, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.restore();
}

function drawPowerIcon(ctx, kind, x, y, k) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(k, k);
  ctx.strokeStyle = LINE;
  ctx.lineWidth = 1.8;
  if (kind === 'shield') {
    ctx.fillStyle = BRASS;
    ctx.beginPath();
    ctx.moveTo(0, -15);
    ctx.lineTo(13, -9);
    ctx.lineTo(10, 7);
    ctx.lineTo(0, 15);
    ctx.lineTo(-10, 7);
    ctx.lineTo(-13, -9);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = RED;
    ctx.beginPath();
    ctx.arc(0, -1, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = '#fff';
    ctx.beginPath();
    ctx.moveTo(-8, -7);
    ctx.lineTo(-6, 3);
    ctx.stroke();
  } else if (kind === 'bomb') {
    ctx.fillStyle = '#8a4f24';
    roundRect(ctx, -11, -11, 22, 24, 5);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = BRASS;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(-11, -4);
    ctx.lineTo(11, -4);
    ctx.moveTo(-11, 6);
    ctx.lineTo(11, 6);
    ctx.stroke();
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(0, -11);
    ctx.quadraticCurveTo(6, -18, 4, -22);
    ctx.stroke();
    ctx.fillStyle = '#ffcf4a';
    ctx.beginPath();
    ctx.arc(4, -23, 3, 0, Math.PI * 2);
    ctx.fill();
  } else {
    // 磁石：红色马蹄
    ctx.lineWidth = 8;
    ctx.strokeStyle = LINE;
    ctx.beginPath();
    ctx.arc(0, 0, 10, Math.PI, 0, true);
    ctx.stroke();
    ctx.lineWidth = 5;
    ctx.strokeStyle = RED;
    ctx.stroke();
    ctx.fillStyle = '#dfe3e8';
    ctx.fillRect(-14, -2, 8, 7);
    ctx.fillRect(6, -2, 8, 7);
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = LINE;
    ctx.strokeRect(-14, -2, 8, 7);
    ctx.strokeRect(6, -2, 8, 7);
  }
  ctx.restore();
}

// —— 弩箭（朝下飞）——
function drawBolt(ctx, x, y) {
  ctx.strokeStyle = LINE;
  ctx.lineWidth = 3.5;
  ctx.beginPath();
  ctx.moveTo(x, y - 18);
  ctx.lineTo(x, y + 6);
  ctx.stroke();
  ctx.strokeStyle = '#e8d9b0';
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.fillStyle = '#cfd6dd';
  ctx.strokeStyle = LINE;
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(x - 4, y + 4);
  ctx.lineTo(x, y + 13);
  ctx.lineTo(x + 4, y + 4);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = RED;
  ctx.beginPath();
  ctx.moveTo(x, y - 18);
  ctx.lineTo(x - 5, y - 22);
  ctx.lineTo(x, y - 12);
  ctx.lineTo(x + 5, y - 22);
  ctx.closePath();
  ctx.fill();
}

// —— 机关龙：车厢 + 龙首 ——
function drawCar(ctx, x, y, a, i, t, hurt) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(a);
  const s = 11;
  ctx.fillStyle = 'rgba(20,12,6,0.32)';
  roundRect(ctx, -s + 3, -s + 4, s * 2, s * 2, 5);
  ctx.fill();
  const base = hurt > 0 ? mix(BRASS, '#ff4a2a', hurt) : i % 3 === 0 ? '#c98f35' : BRASS;
  ctx.fillStyle = base;
  ctx.strokeStyle = LINE;
  ctx.lineWidth = 1.6;
  roundRect(ctx, -s, -s, s * 2, s * 2, 5);
  ctx.fill();
  ctx.fillStyle = mix(base, '#000000', 0.25);
  ctx.fillRect(-s + 2, s - 6, s * 2 - 4, 4);
  ctx.stroke();
  // 轮子
  ctx.fillStyle = '#3a2a1c';
  for (const sx of [-s - 2, s - 1]) {
    ctx.fillRect(sx, -6, 3, 4);
    ctx.fillRect(sx, 3, 3, 4);
  }
  // 铆钉
  ctx.fillStyle = BRASS_D;
  for (const [px, py] of [[-6, -6], [6, -6], [-6, 4], [6, 4]]) {
    ctx.beginPath();
    ctx.arc(px, py, 1.6, 0, Math.PI * 2);
    ctx.fill();
  }
  // 高光
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(-7, -8);
  ctx.lineTo(-7, 0);
  ctx.stroke();
  // 每三节一根小烟囱
  if (i % 3 === 1) {
    ctx.fillStyle = '#5a3d22';
    ctx.fillRect(-3, -3, 6, 6);
    ctx.strokeStyle = LINE;
    ctx.strokeRect(-3, -3, 6, 6);
  }
  ctx.restore();
}

function drawHead(ctx, x, y, a, chew, t, shield) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(a);
  const open = chew > 0 ? Math.abs(Math.sin(t * 28)) * 7 : 1.5;
  // 影
  ctx.fillStyle = 'rgba(20,12,6,0.32)';
  ctx.beginPath();
  ctx.ellipse(3, 5, 16, 19, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = LINE;
  ctx.lineWidth = 1.8;

    p.t += dt;
    p.y -= 30 * dt;
    if (p.t >= p.life) G.pops.splice(i, 1);
  }

  if (G.shake < 0.2) G.shake = 0;
  if (G.flash > 0) G.flash -= dt;
}

// —— 画 ——
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#120d0a';
  ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(scale, scale);
  ctx.beginPath();
  ctx.rect(0, 0, F.w, F.h);
  ctx.clip();
  const sh = G.shake;
  ctx.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);
  drawWorld();
  ctx.restore();
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(scale, scale);
  drawHud();
  if (G.mode === 'result') drawResult();
  if (G.cs) G.cs.draw();
  ctx.restore();
}

function drawWorld() {
  const st = G.st;
  const ch = S.chapter(st);
  const t = G.t;
  D.drawGround(ctx, ch, st.head.wy);
  const vis = (wy, m) => {
    const y = sy(wy);
    return y > -m && y < F.h + m;
  };
  for (const f of st.fences) {
    if (vis((f.wy0 + f.wy1) / 2, 160)) D.drawFence(ctx, f.x, sy(f.wy1), sy(f.wy0));
  }
  for (const it of st.items) if (it.alive && vis(it.wy, 40)) D.drawItem(ctx, it, sy(it.wy), t);
  for (const b of st.blocks) {
    if (!b.alive || !vis(b.wy, 200)) continue;

    D.drawBlock(ctx, ch, b, sy(b.wy), t, chewing ? 2.5 : 0, S.phased(st, b));
  }
  for (const f of st.foes) if (f.alive && vis(f.wy, 40)) D.drawFoe(ctx, f, sy(f.wy), t);
  for (const bo of st.bolts) D.drawBolt(ctx, bo.x, sy(bo.wy));
  for (const sh of st.shots) D.drawShot(ctx, sh.x, sy(sh.wy));
  for (const fl of G.flames) D.drawFlame(ctx, fl.x, sy(fl.wy0), sy(fl.wy1), 1 - fl.t / 0.3, fl.lv);
  drawDragon(st, t);
  for (const f of G.fx) drawFx(f);
  drawLenTag(st);
  for (const p of G.pops) {
    ctx.save();
    ctx.globalAlpha = clamp(1 - (p.t / p.life - 0.6) / 0.4, 0, 1);
    const k = easeOutBack(Math.min(1, p.t / 0.18));
    bigText(ctx, p.text, p.x, p.y, p.size * k, p.col, D.LINE);
    ctx.restore();
  }
  if (G.flash > 0) {
    ctx.fillStyle = G.flashColor;
    ctx.globalAlpha = Math.min(0.5, G.flash);
    ctx.fillRect(0, 0, F.w, F.h);
    ctx.globalAlpha = 1;
  }
}

function drawDragon(st, t) {
  if (st.len <= 0 && G.mode !== 'play') return;
  const segs = S.segments(st, 60);
  const pts = segs.map((p) => ({ x: p.x, y: sy(p.wy) }));

  ctx.strokeStyle = D.LINE;
  ctx.lineWidth = 3;

    D.drawCar(ctx, p.x, p.y, a, i, t, hurt);
    const sid = specialAt[i];
    if (sid) D.drawSpecialCar(ctx, sid, p.x, p.y, a, st.cars[sid], t, st.armor);

  const nx = pts[1] || { x: hd.x, y: hd.y + 10 };
  D.drawHead(ctx, hd.x, hd.y, Math.atan2(hd.x - nx.x, nx.y - hd.y), st.chewing ? 1 : 0, t, st.shield);

    ctx.globalAlpha = 0.25;
    ctx.strokeStyle = '#ff6a4a';
    ctx.setLineDash([4, 6]);
    ctx.beginPath();
    ctx.arc(hd.x, hd.y, 60 + (t * 60) % 40, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
}

// 头上的节数（画在碎石上面，永远看得清）

  if (st.len <= 0) return;

  const y = C.HEAD_Y - 36;

function drawFx(f) {

      const lanes = [0, 1, 2, 3, 4].sort(() => R() - 0.5).slice(0, cnt);
      const vals = lanes.map((_, k) => (k === 0 && R() < 0.5 ? 1 + Math.floor(R() * num * 2) : 1 + Math.floor(R() * num)));
      // 整排堵死时保证有一格小的（原作是碰运气，我们不让玩家死得冤）
      if (cnt === 5) {
        const lo = Math.max(1, Math.ceil(num / 3));
        const m = vals.indexOf(Math.min.apply(null, vals));
        if (vals[m] > lo) vals[m] = 1 + Math.floor(R() * lo);
      }
      lanes.forEach((ln, k) => {
        const tower = r > 2 && R() < lv.tower;
        let type = null;
        if (!tower && r > 1) {
          for (const [ty, pr] of Object.entries(lv.types || {})) if (ty !== 'rock' && !type && R() < pr) type = ty;
        }
        const n = tower ? Math.max(2, Math.ceil(vals[k] * 0.8)) : type === 'powder' ? 1 + Math.floor(R() * 3) : vals[k];
        blocks.push({ kind: tower ? 'tower' : 'brick', type, x: laneX(ln), wy: wy + HALF, n, n0: 0, alive: true, cd: C.TOWER.first + R() * 0.8, num, ph: R() * 2.4, rg: 0 });
      });
      rows.push(wy);
      wy += C.CELL;
    }
  }
  // 城门前补给：一段空地，三颗大零件
  for (let k = 0; k < 3; k++) items.push({ kind: 'part', x: laneX(1 + k), wy: wy + 60 + k * 30, n: 3 + Math.floor(R() * 3), alive: true });
  wy += C.CELL * 3;
  rows.push(wy);
  const gate = { kind: 'gate', boss: lv.boss || null, x: C.FIELD.w / 2, wy: wy + HALF, n: lv.gate, n0: lv.gate, alive: true, cd: 1, rg: 0 };
  if (gate.boss === 'beast') gate.door = { x: C.FIELD.w / 2, w: 112, vx: 70 + (lv.elite || 0) * 20 };
  blocks.push(gate);
  blocks.forEach((b) => (b.n0 = b.n));
  return { blocks, fences, items, foes, rows, gate, endWY: gate.wy };
}

function newRun(levelIdx, meta, seed) {
  const lv = C.level(levelIdx);
  const R = rng(seed || 1);
  const L = buildLevel(lv, R);
  const startLen = C.START_LEN + ((meta && meta.startLv) || 0);
  const head = { x: laneX(2), wy: 0 };
  const trail = [];
  for (let i = 0; i <= startLen * C.SEG + 40; i += 2) trail.push({ x: head.x, wy: -i });
  trail.reverse();
  return {
    lv, R, t: 0, mode: 'play',
    head, targetX: head.x, len: startLen, startLen, maxLen: startLen,
    trail,
    blocks: L.blocks, fences: L.fences, items: L.items, foes: L.foes, seen: {}, rows: L.rows, gate: L.gate, endWY: L.endWY,
    bolts: [], chewing: null, chewT: 0, combo: 0,
    shield: 0, magnet: 0,
    score: 0, parts: 0, broke: 0, towersBroke: 0, boltHits: 0,
    events: [], short: 0,
    cars: {}, carOrder: [], cards: null, picks: 0,
    armor: 0, armorT: 0, fireCd: 1, bowCd: 1, shots: [], chewN: 0,
    partLuck: ((meta && meta.partLv) || 0) * 0.1,
    pendingCards: meta && meta.cardLv ? 1 : 0,
  };
}

// —— 三选一：特殊车厢 ——
const carLv = (st, id) => st.cars[id] || 0;
function openCards(st) {
  const pool = C.CARS.filter((c) => {
    const lv = carLv(st, c.id);
    if (lv >= 3) return false;
    return lv > 0 || st.carOrder.length < C.MAX_CARS;
  });
  if (!pool.length) {
    st.len += 5;
    ev(st, { t: 'part', x: st.head.x, wy: st.head.wy + 20, n: 5 });
    return;
  }
  const pick = [];
  const left = pool.slice();
  while (pick.length < 3 && left.length) pick.push(left.splice(Math.floor(st.R() * left.length), 1)[0].id);
  st.cards = pick;
  st.mode = 'cards';
  ev(st, { t: 'cards' });
}
function pick(st, i) {
  if (st.mode !== 'cards' || !st.cards || !st.cards[i]) return;
  const id = st.cards[i];
  const lv = carLv(st, id) + 1;
  st.cars[id] = lv;
  if (lv === 1) st.carOrder.push(id);
  if (id === 'armor') st.armor = armorMax(st);
  st.cards = null;
  st.mode = 'play';
  st.picks++;
  ev(st, { t: 'pick', id, lv, evo: lv === 3 });
}
const armorMax = (st) => [0, 2, 3, 5][carLv(st, 'armor')];

const chapter = (st) => C.CHAPTERS[st.lv.ch];
// 幽影砖：2.4 秒一轮，实 1.4 秒、虚 1.0 秒
const phased = (st, b) => b.type === 'ghost' && (st.t + b.ph) % 2.4 > 1.4;
function rowIndex(st) {
  let i = 0;
  while (i < st.rows.length && st.rows[i] < st.head.wy) i++;
  return i;
}
function speedNow(st) {
  return st.lv.v + C.V_EVERY * Math.floor(rowIndex(st) / C.NUM_EVERY);
}

// 车厢位置：沿龙头走过的路往回量
function segments(st, max) {
  const out = [{ x: st.head.x, wy: st.head.wy }];
  const n = Math.min(st.len, max || 999);
  let need = C.SEG;
  let px = st.head.x;
  let py = st.head.wy;
  for (let i = st.trail.length - 1; i >= 0 && out.length < n; i--) {
    const p = st.trail[i];
    let d = Math.hypot(px - p.x, py - p.wy);
    while (d >= need && out.length < n) {
      const t = need / d;
      px = px + (p.x - px) * t;
      py = py + (p.wy - py) * t;
      out.push({ x: px, wy: py });
      d = Math.hypot(px - p.x, py - p.wy);
      need = C.SEG;
    }
    need -= d;
    px = p.x;
    py = p.wy;
  }
  return out;
}

function ev(st, e) {
  st.events.push(e);
}

function breakBlock(st, b, how) {
  b.alive = false;
  st.broke++;
  st.score += b.n0 * 10;
  if (b.kind === 'tower') {
    st.towersBroke++;
    // 拆了弩塔崩出零件
    for (let k = 0; k < 3; k++) st.items.push({ kind: 'part', x: clamp(b.x + (k - 1) * 22, 16, C.FIELD.w - 16), wy: b.wy + 26 + k * 6, n: 1, alive: true, pop: 0.4 });
    st.items.push({ kind: 'chest', x: b.x, wy: b.wy + 10, n: 0, alive: true, pop: 0.5 });
  }
  if (b.type === 'powder') {
    const self = how === 'chew';
    ev(st, { t: 'kaboom', x: b.x, wy: b.wy, self });
    if (self && st.shield <= 0) {
      st.len -= 3;
      if (st.len <= 0) lose(st, 0);
    }
    for (const o of st.blocks) {
      if (!o.alive || o.kind === 'gate' || Math.abs(o.wy - b.wy) > 4 || Math.abs(Math.abs(o.x - b.x) - C.CELL) > 4) continue;
      o.n -= 4;
      if (o.n <= 0) breakBlock(st, o, 'boom');
    }
  }
  const pw = carLv(st, 'powder');
  if (pw && b.kind !== 'gate' && (how !== 'powder' || pw >= 3)) {
    const dmg = [0, 3, 4, 6][pw];
    ev(st, { t: 'powder', x: b.x, wy: b.wy });
    for (const o of st.blocks) {
      if (!o.alive || o.kind === 'gate' || Math.abs(o.wy - b.wy) > 4 || Math.abs(Math.abs(o.x - b.x) - C.CELL) > 4) continue;
      o.n -= dmg;
      if (o.n <= 0) breakBlock(st, o, 'powder');
    }
  }
  ev(st, { t: 'break', x: b.x, wy: b.wy, n0: b.n0, kind: b.kind, how: how || 'chew' });
  if (b.kind === 'gate') {
    st.mode = 'win';
    st.score += st.len * 20;
    ev(st, { t: 'win' });
  }
}

function lose(st, short) {
  if (st.mode !== 'play') return;
  st.mode = 'lose';
  st.short = short || 0;
  ev(st, { t: 'lose', short: st.short });
}

// 横着动：栅栏和旁边的方块挡住
function steer(st, dt) {
  const h = st.head;
  const r = C.HEAD_R;
  const want = clamp(st.targetX, r + 3, C.FIELD.w - r - 3);
  let nx = h.x + clamp(want - h.x, -C.STEER_MAX * dt, C.STEER_MAX * dt);
  for (const f of st.fences) {
    if (h.wy + r > f.wy0 && h.wy - r < f.wy1) {
      if (h.x <= f.x && nx > f.x - r - 3) nx = Math.min(nx, f.x - r - 3);
      if (h.x >= f.x && nx < f.x + r + 3) nx = Math.max(nx, f.x + r + 3);
    }
  }
  for (const b of st.blocks) {
    if (!b.alive || b.kind === 'gate' || phased(st, b)) continue;
    if (Math.abs(h.wy - b.wy) < HALF + r * 0.4) {
      if (h.x <= b.x - HALF && nx > b.x - HALF - r) nx = Math.min(nx, b.x - HALF - r);
      if (h.x >= b.x + HALF && nx < b.x + HALF + r) nx = Math.max(nx, b.x + HALF + r);
    }
  }
  h.x = nx;
}

// 往前冲：碰到方块就停下啃
function advance(st, dt) {
  const h = st.head;
  const r = C.HEAD_R;
  const next = h.wy + speedNow(st) * dt;
  let hit = null;
  let hitD = 1e9;
  for (const b of st.blocks) {
    if (!b.alive || phased(st, b)) continue;
    const front = b.wy - HALF - r;
    if (front < h.wy - 0.5 || front > next) continue;
    const dx = b.kind === 'gate' ? 0 : Math.abs(h.x - b.x);
    if (dx >= HALF + r * 0.55) continue;
    const d = (front - h.wy) * 1000 + dx;
    if (d < hitD) {
      hitD = d;
      hit = b;
    }
  }
  if (hit) {
    h.wy = hit.wy - HALF - r;
    if (st.chewing !== hit) {
      if (!st.chewing) ev(st, { t: 'bump', x: hit.x, wy: hit.wy, kind: hit.kind });
      if (hit.kind === 'gate' && !st.reachedGate) st.reachedGate = st.len;
      st.chewing = hit;
      st.chewT = 0;
    }
  } else {
    h.wy = next;
    if (st.chewing) st.combo = 0;
    st.chewing = null;
  }
  // 撞到栅栏的下端：往原来那边推开
  for (const f of st.fences) {
    if (h.wy + r > f.wy0 && h.wy - r < f.wy1 && Math.abs(h.x - f.x) < r + 3) {
      h.x = h.x < f.x ? f.x - r - 3 : f.x + r + 3;
    }
  }
}

function chew(st, dt) {
  const b = st.chewing;
  if (!b || !b.alive) return;
  if (phased(st, b)) {
    st.chewing = null;
    return;
  }
  b.rg = 0;
  if (b.door && Math.abs(st.head.x - b.door.x) > b.door.w / 2) {
    st.clankT = (st.clankT || 0) - dt;
    if (st.clankT <= 0) {
      st.clankT = 0.35;
      ev(st, { t: 'clank', x: st.head.x, wy: b.wy - HALF });
    }
    return;
  }
  if (st.shield > 0 && b.kind !== 'gate') {
    breakBlock(st, b, 'shield');
    st.chewing = null;
    return;
  }
  // 大方块啃得快一点，不拖
  const tooth = carLv(st, 'tooth');
  const each = C.CHEW * (b.kind === 'gate' ? 0.75 : clamp(9 / b.n0, 0.45, 1)) * [1, 0.7, 0.6, 0.5][tooth];
  st.chewT += dt;
  while (st.chewT >= each && b.alive && st.mode === 'play') {
    st.chewT -= each;
    b.n--;
    st.chewN++;
    const free = tooth && st.chewN % (tooth >= 3 ? 2 : 3) === 0;
    if (!free) st.len--;
    st.combo++;
    ev(st, { t: 'chew', x: b.x, wy: b.wy, n: b.n, kind: b.kind, combo: st.combo, hx: st.head.x, free });
    if (b.n <= 0) breakBlock(st, b);
    if (st.len <= 0) lose(st, b.alive ? b.n : 0);
  }
}

function stepItems(st, dt) {
  const h = st.head;
  for (const it of st.items) {
    if (!it.alive) continue;
    if (it.pop > 0) {
      it.pop -= dt;
      it.wy += 60 * dt;
    }
    const dy = it.wy - h.wy;
    const mr = st.magnet > 0 ? 200 : [0, 170, 260, 900][carLv(st, 'magnet')];
    if (mr && it.kind === 'part' && dy > -40 && dy < mr) {
      const d = Math.hypot(it.x - h.x, dy) || 1;
      const pull = Math.min(d, 520 * dt);
      it.x -= ((it.x - h.x) / d) * pull;
      it.wy -= (dy / d) * pull;
    }
    if (Math.hypot(it.x - h.x, it.wy - h.wy) < C.HEAD_R + 15) {
      it.alive = false;
      if (it.kind === 'chest') {
        ev(st, { t: 'chest', x: it.x, wy: it.wy });
        openCards(st);
        continue;
      }
      if (it.kind === 'part') {
        const extra = [0, 1, 2, 3][carLv(st, 'forge')] + (st.R() < st.partLuck ? 1 : 0);
        st.len += it.n + extra;
        st.parts += it.n + extra;
        st.maxLen = Math.max(st.maxLen, st.len);
        ev(st, { t: 'part', x: it.x, wy: it.wy, n: it.n + extra });
      } else if (it.kind === 'bomb') {
        let cnt = 0;
        for (const b of st.blocks) {
          if (b.alive && b.kind !== 'gate' && b.wy > h.wy - 20 && b.wy < h.wy + 460) {
            breakBlock(st, b, 'bomb');
            cnt++;
          }
        }
        st.bolts.length = 0;
        if (st.chewing && !st.chewing.alive) st.chewing = null;
        ev(st, { t: 'bomb', x: it.x, wy: it.wy, cnt });
      } else {
        st[it.kind] = C.POWER_TIME[it.kind];
        ev(st, { t: 'power', kind: it.kind, x: it.x, wy: it.wy });
      }
    }
  }
}

function stepTowers(st, dt) {
  const h = st.head;
  for (const b of st.blocks) {
    if (!b.alive || b.kind !== 'tower') continue;
    const d = b.wy - h.wy;
    if (d < 20 || d > C.TOWER.range) continue;
    b.cd -= dt;
    if (b.cd <= 0) {
      b.cd = C.TOWER.cd;
      st.bolts.push({ x: b.x, wy: b.wy - HALF });
      if (st.lv.elite) {
        if (b.x - C.CELL > 0) st.bolts.push({ x: b.x - C.CELL, wy: b.wy - HALF });
        if (b.x + C.CELL < C.FIELD.w) st.bolts.push({ x: b.x + C.CELL, wy: b.wy - HALF });
      }
      ev(st, { t: 'fire', x: b.x, wy: b.wy - HALF });
    }
  }
  if (!st.bolts.length) return;
  const segs = segments(st, 40);
  for (let i = st.bolts.length - 1; i >= 0; i--) {
    const bo = st.bolts[i];
    bo.wy -= C.TOWER.boltV * dt;
    let hitIdx = -1;
    for (let k = 0; k < segs.length; k++) {
      if (Math.abs(segs[k].x - bo.x) < 12 && Math.abs(segs[k].wy - bo.wy) < 13) {
        hitIdx = k;
        break;
      }
    }
    if (hitIdx >= 0) {
      st.bolts.splice(i, 1);
      if (st.shield > 0 || st.armor > 0) {
        if (st.shield <= 0) {
          st.armor--;
          st.armorT = 0;
        }
        ev(st, { t: 'deflect', x: bo.x, wy: bo.wy, armor: st.shield <= 0 });
        continue;
      }
      st.len--;
      st.boltHits++;
      st.combo = 0;
      ev(st, { t: 'boltHit', x: segs[hitIdx].x, wy: segs[hitIdx].wy });
      if (st.len <= 0) lose(st, 1);
    } else if (bo.wy < h.wy - 420) st.bolts.splice(i, 1);
  }
}

function hurtBlock(st, b, dmg, how) {
  if (!b.alive || phased(st, b)) return;
  if (b.type === 'iron' && (how === 'fire' || how === 'bow')) {
    ev(st, { t: 'clank', x: b.x, wy: b.wy - HALF });
    return;
  }
  b.rg = 0;
  b.n -= b.kind === 'gate' ? Math.ceil(dmg / 2) : dmg;
  if (b.n <= 0) {
    b.n = 0;
    breakBlock(st, b, how);
    if (st.chewing === b) st.chewing = null;
  }
}
// 前面这条道上最近的砖（城门横跨全宽）
function blockAhead(st, x, range, skip) {
  let best = null;
  for (const b of st.blocks) {
    if (!b.alive || b === skip) continue;
    const d = b.wy - st.head.wy;
    if (d < 0 || d > range) continue;
    if (b.kind !== 'gate' && Math.abs(b.x - x) > HALF) continue;
    if (!best || b.wy < best.wy) best = b;
  }
  return best;
}
function stepCars(st, dt) {
  const f = carLv(st, 'fire');
  if (f) {
    st.fireCd -= dt;
    const range = f >= 3 ? 230 : 150;
    if (st.fireCd <= 0) {
      const b = blockAhead(st, st.head.x, range);
      if (b) {
        st.fireCd = [0, 2.0, 1.6, 1.4][f];
        const dmg = [0, 3, 5, 8][f];
        ev(st, { t: 'fire', x: st.head.x, wy: st.head.wy, to: b.wy - HALF, lv: f });
        hurtBlock(st, b, dmg, 'fire');
        if (f >= 3) {
          const b2 = blockAhead(st, st.head.x, range + C.CELL * 2, b);
          if (b2 && b2.alive) hurtBlock(st, b2, dmg, 'fire');
        }
      } else st.fireCd = 0.2;
    }
  }
  const bw = carLv(st, 'bow');
  if (bw) {
    st.bowCd -= dt;
    if (st.bowCd <= 0) {
      st.bowCd = [0, 1.2, 0.85, 0.85][bw];
      const segs = segments(st, 4);
      const p = segs[Math.min(segs.length - 1, 1 + st.carOrder.indexOf('bow'))] || st.head;
      const dirs = bw >= 3 ? [-0.22, 0, 0.22] : [0];
      for (const d of dirs) st.shots.push({ x: p.x, wy: p.wy + 10, vx: d * 520 });
      ev(st, { t: 'bowShot', x: p.x, wy: p.wy });
    }
  }
  for (let i = st.shots.length - 1; i >= 0; i--) {
    const sh = st.shots[i];
    sh.wy += 560 * dt;
    sh.x += sh.vx * dt;
    let hit = null;
    for (const b of st.blocks) {
      if (!b.alive || phased(st, b)) continue;
      if (Math.abs(b.wy - sh.wy) < HALF && (b.kind === 'gate' || Math.abs(b.x - sh.x) < HALF)) {
        hit = b;
        break;
      }
    }
    if (hit) {
      st.shots.splice(i, 1);
      ev(st, { t: 'shotHit', x: sh.x, wy: hit.wy - HALF });
      hurtBlock(st, hit, 1, 'bow');
    } else if (sh.wy > st.head.wy + 700 || sh.x < 0 || sh.x > C.FIELD.w) st.shots.splice(i, 1);
  }
  const am = armorMax(st);
  if (am && st.armor < am) {
    st.armorT += dt;
    if (st.armorT >= (carLv(st, 'armor') >= 3 ? 3 : 5)) {
      st.armorT = 0;
      st.armor++;
    }
  }
}

function stepEnemies(st, dt) {
  const h = st.head;
  for (const b of st.blocks) {
    if (!b.alive) continue;
    const d = b.wy - h.wy;
    if (b.type === 'rock' && d < 560) {
      b.wy -= 75 * dt;
      // 滚到龙头上：顶住，变成正在啃的那块
      if (Math.abs(h.x - b.x) < HALF + C.HEAD_R * 0.55 && b.wy - HALF - C.HEAD_R < h.wy && b.wy > h.wy - HALF) {
        b.wy = h.wy + HALF + C.HEAD_R;
        if (st.chewing !== b) {
          st.chewing = b;
          st.chewT = 0;
          ev(st, { t: 'bump', x: b.x, wy: b.wy, kind: 'rock' });
        }
      }
      if (b.wy < h.wy - 320) b.alive = false;
    }
    if ((b.type === 'clay' || b.boss === 'general') && st.chewing !== b && b.n < b.n0 && d < 600) {
      b.rg += dt;
      if (b.rg >= (b.boss ? 0.45 : 0.7)) {
        b.rg = 0;
        b.n++;
        ev(st, { t: 'regen', x: b.boss ? h.x : b.x, wy: b.wy });
      }
    }
    if (b.door) {
      const dr = b.door;
      dr.x += dr.vx * dt;
      if (dr.x < dr.w / 2 + 4 || dr.x > C.FIELD.w - dr.w / 2 - 4) {
        dr.vx = -dr.vx;
        dr.x = clamp(dr.x, dr.w / 2 + 4, C.FIELD.w - dr.w / 2 - 4);
      }
    }
    if (b.boss === 'ballista' && d < 620) {
      b.cd -= dt;
      if (b.cd <= 0) {
        b.cd = st.lv.elite ? 1.3 : 1.7;
        const lanes = [0, 1, 2, 3, 4].sort(() => st.R() - 0.5).slice(0, 3);
        for (const ln of lanes) st.bolts.push({ x: laneX(ln), wy: b.wy - HALF - 40 });
        ev(st, { t: 'volley', wy: b.wy });
      }
    }
    if (d < 470 && d > 0) {
      const key = b.boss || b.type;
      if (key && !st.seen[key]) {
        st.seen[key] = 1;
        ev(st, { t: b.boss ? 'newBoss' : 'newType', key });
      }
    }
  }
  if (!st.foes.length) return;
  const segs = segments(st, 40);
  for (const f of st.foes) {
    if (!f.alive) continue;
    const d = f.wy - h.wy;
