  if (!map) return;
  const u = 2 * (s || 1);
  const w = map[0].length * u;
  const h = map.length * u;
  let bob = 0;
  if (id === 'que') bob = Math.sin(t * 9) * 2 * (s || 1);
  else if (id === 'quan') bob = Math.abs(Math.sin(t * 8)) * -1.5 * (s || 1);
  if (flip) {
    ctx.save();
    ctx.translate(x, 0);
    ctx.scale(-1, 1);
    pix(ctx, map, BUDDY_PAL[id], -w / 2, y - h / 2 + bob, u);
    ctx.restore();
  } else pix(ctx, map, BUDDY_PAL[id], x - w / 2, y - h / 2 + bob, u);
  if (id === 'gui' && Math.sin(t * 4) > 0.2) {
    ctx.fillStyle = 'rgba(239,230,220,0.75)';
    ctx.beginPath();
    ctx.arc(x - w / 2 + 5.5 * u, y - h / 2 - 2 * u - (t * 10) % 6, 2.2 * u, 0, Math.PI * 2);
    ctx.fill();
  }
}

// —— 技能图标（8 比特）——
function drawIcon(ctx, id, x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s / 24, s / 24);
  const L = P.line;
  const bolt = (dx, dy, ang, col) => {
    ctx.save();
    ctx.translate(dx, dy);
    ctx.rotate(ang);
    ctx.fillStyle = L;
    ctx.fillRect(-2, -10, 4, 18);
    ctx.fillStyle = col || P.brassHi;
    ctx.fillRect(-1, -9, 2, 16);
    ctx.fillStyle = '#fff2b0';
    ctx.fillRect(-2, -12, 4, 4);
    ctx.restore();
  };
  if (id === 'multi') {
    bolt(-7, 0, -0.35);
    bolt(0, -2, 0);
    bolt(7, 0, 0.35);
  } else if (id === 'rate') {
    bolt(-4, 2, 0);
    bolt(4, -3, 0);
    ctx.fillStyle = '#ff8a3d';
    ctx.fillRect(-10, 8, 4, 2);
    ctx.fillRect(-2, 4, 4, 2);
    ctx.fillRect(6, 9, 4, 2);
  } else if (id === 'power') {
    ctx.fillStyle = L;
    ctx.fillRect(-4, -11, 8, 22);
    ctx.fillStyle = '#ff5a4a';
    ctx.fillRect(-2.5, -9, 5, 18);
    ctx.fillStyle = '#fff2b0';
    ctx.fillRect(-4, -12, 8, 5);
  } else if (id === 'pierce') {
    ctx.fillStyle = L;
    ctx.fillRect(-10, -3, 20, 6);
    ctx.fillStyle = '#8fe3ff';
    ctx.fillRect(-9, -2, 18, 4);
    ctx.strokeStyle = L;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(-3, 0, 6, 0, Math.PI * 2);
    ctx.arc(5, 0, 6, 0, Math.PI * 2);
    ctx.stroke();
  } else if (id === 'bounce') {
    ctx.strokeStyle = L;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-9, 10);
    ctx.lineTo(7, -8);
    ctx.lineTo(-2, -11);
    ctx.stroke();
    ctx.strokeStyle = '#7dff9a';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.fillStyle = L;
    ctx.fillRect(8, -12, 3, 24);
  } else if (id === 'blast') {
    ctx.fillStyle = L;
    star(ctx, 0, 0, 12, 6, 8);
    ctx.fillStyle = '#ffa0d8';
    star(ctx, 0, 0, 9, 4.5, 8);
    ctx.fillStyle = '#fff2b0';
    ctx.fillRect(-2, -2, 4, 4);
  } else if (id === 'frost') {
    ctx.strokeStyle = L;
    ctx.lineWidth = 5;
    for (let k = 0; k < 3; k++) {
      ctx.beginPath();
      const a = (k * Math.PI) / 3;
      ctx.moveTo(Math.cos(a) * -10, Math.sin(a) * -10);
      ctx.lineTo(Math.cos(a) * 10, Math.sin(a) * 10);
      ctx.stroke();
    }
    ctx.strokeStyle = '#b9c8ff';
    ctx.lineWidth = 2.5;
    for (let k = 0; k < 3; k++) {
      ctx.beginPath();
      const a = (k * Math.PI) / 3;
      ctx.moveTo(Math.cos(a) * -9, Math.sin(a) * -9);
      ctx.lineTo(Math.cos(a) * 9, Math.sin(a) * 9);
      ctx.stroke();
    }
  } else if (id === 'crit') {
    ctx.fillStyle = L;
    ctx.beginPath();
    ctx.arc(0, 0, 11, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff27a';
    ctx.beginPath();
    ctx.arc(0, 0, 8.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = L;
    ctx.fillRect(-1.5, -8, 3, 16);
    ctx.fillRect(-8, -1.5, 16, 3);
    ctx.fillStyle = '#ff5a4a';
    ctx.fillRect(-2.5, -2.5, 5, 5);
  }
  ctx.restore();
}

function star(ctx, x, y, ro, ri, n) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? ri : ro;
    const a = (Math.PI * i) / n - Math.PI / 2;
    if (i === 0) ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    else ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
  ctx.fill();
}

// —— 背景 + 路 + 城墙（每关画一次，存进离屏画布）——
function drawBackground(ctx, path, levelIndex) {
  const F = C.FIELD;
  const g = ctx.createLinearGradient(0, 0, 0, F.h);
  g.addColorStop(0, P.sky0);
  g.addColorStop(1, P.sky1);
  ctx.fillStyle = g;
  ctx.fillRect(-200, -200, F.w + 400, F.h + 400);

  // 远处的机关城：塔楼剪影 + 暖色窗 + 大齿轮
  let seed = 7 + levelIndex * 13;
  const r = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  ctx.fillStyle = P.far;
  for (let k = 0; k < 7; k++) {
    const x = k * 58 - 10 + r() * 20;
    const h = 120 + r() * 220;
    const w = 34 + r() * 18;
    const top = F.h - 140 - h;
    ctx.fillRect(x, top, w, h + 200);
    // 飞檐（几层）
    for (let lv = 0; lv < 4; lv++) {
      const yy = top + lv * 34;
      ctx.beginPath();
      ctx.moveTo(x - 10, yy + 6);
      ctx.lineTo(x + w / 2, yy - 8);
      ctx.lineTo(x + w + 10, yy + 6);
      ctx.lineTo(x + w + 4, yy + 9);
      ctx.lineTo(x - 4, yy + 9);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = P.far;
  }
  // 大齿轮（很暗）
  ctx.strokeStyle = P.far2;
  ctx.lineWidth = 6;
  for (const [gx, gy, gr] of [[300, 120, 60], [40, 330, 44], [320, 470, 36]]) {
    ctx.beginPath();
    ctx.arc(gx, gy, gr, 0, Math.PI * 2);
    ctx.stroke();
    for (let k = 0; k < 10; k++) {
      const a = (k / 10) * Math.PI * 2;
      ctx.save();
      ctx.translate(gx + Math.cos(a) * gr, gy + Math.sin(a) * gr);
      ctx.rotate(a);
      ctx.fillStyle = P.far2;
      ctx.fillRect(-4, -5, 10, 10);
      ctx.restore();
    }
  }

  // 路：深槽 + 枕木 + 两条铜轨
  const len = path.len;
  const strokePath = (w, col) => {
    ctx.strokeStyle = col;
    ctx.lineWidth = w;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (let s = 0; s <= len; s += 4) {
      const p = path.at(s);
      if (s === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  };
  strokePath(42, P.line);
  strokePath(37, P.groove);
  strokePath(30, P.grooveIn);
  for (let s = 0; s <= len; s += 14) {
    const p = path.at(s);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.a);
    ctx.fillStyle = P.tie;
    ctx.fillRect(-2.5, -14, 5, 28);
    ctx.restore();
  }
  for (const off of [-11, 11]) {
    ctx.fillStyle = P.rail;
    for (let s = 0; s <= len; s += 2) {
      const p = path.at(s);
      const nx = -Math.sin(p.a) * off;
      const ny = Math.cos(p.a) * off;
      ctx.fillRect(p.x + nx - 1.2, p.y + ny - 1.2, 2.4, 2.4);
    }
  }
  // 路上每隔一段一颗铜钉（像刻度，看得出离城门还有多远）
  for (let s = len - C.DRAGON.gap * 4; s > 0; s -= C.DRAGON.gap * 5) {
    const p = path.at(s);
    ctx.fillStyle = P.line;
    ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
    ctx.fillStyle = P.railHi;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  // 最后四节：路面发红（危险区）
  ctx.globalAlpha = 0.35;
  ctx.strokeStyle = '#7a1a14';
  ctx.lineWidth = 30;
  ctx.beginPath();
  for (let s = len - C.DRAGON.gap * 4; s <= len; s += 4) {
    const p = path.at(s);
    if (s === len - C.DRAGON.gap * 4) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;

  // 城墙
  const wy = F.gateY - 10;
  ctx.fillStyle = P.line;
  ctx.fillRect(0, wy - 2, F.w, 52);
  ctx.fillStyle = P.stone;
  ctx.fillRect(0, wy, F.w, 48);
  ctx.fillStyle = P.stoneHi;
  ctx.fillRect(0, wy, F.w, 4);
  ctx.fillStyle = P.mortar;
  for (let row = 0; row < 4; row++) {
    const yy = wy + 8 + row * 10;
    ctx.fillRect(0, yy, F.w, 1.5);
    for (let x = (row % 2) * 12; x < F.w; x += 24) ctx.fillRect(x, yy - 10, 1.5, 10);
  }
  // 垛口
  for (let x = 4; x < F.w; x += 30) {
    if (Math.abs(x + 9 - F.w / 2) < 40) continue;
    ctx.fillStyle = P.line;
    ctx.fillRect(x - 1, wy - 15, 20, 15);
    ctx.fillStyle = P.stone;
    ctx.fillRect(x, wy - 14, 18, 14);
    ctx.fillStyle = P.stoneHi;
    ctx.fillRect(x, wy - 14, 18, 3);
  }
  // 城门
  const gx = F.w / 2;
  ctx.fillStyle = P.line;
  roundRect(ctx, gx - 30, wy - 26, 60, 76, 26);
  ctx.fill();
  ctx.fillStyle = P.brassLo;
  roundRect(ctx, gx - 27, wy - 23, 54, 73, 23);
  ctx.fill();
  ctx.fillStyle = '#0c0706';
  roundRect(ctx, gx - 20, wy - 16, 40, 66, 18);
  ctx.fill();
  ctx.fillStyle = P.brassHi;
  for (let k = 0; k < 5; k++) ctx.fillRect(gx - 25, wy - 10 + k * 12, 3, 3), ctx.fillRect(gx + 22, wy - 10 + k * 12, 3, 3);
  // 城门上的灯
  for (const lx of [gx - 44, gx + 44]) {
    ctx.fillStyle = P.line;
    ctx.fillRect(lx - 6, wy - 34, 12, 16);
    ctx.fillStyle = '#ff9a3c';
    ctx.fillRect(lx - 4, wy - 32, 8, 12);
    ctx.fillStyle = '#ffe08a';
    ctx.fillRect(lx - 2, wy - 30, 4, 5);
  }

  // 城墙后的走道（阿铸在这儿左右走）
  ctx.fillStyle = P.walk;
  ctx.fillRect(0, wy + 48, F.w, F.h - wy);
  ctx.fillStyle = P.walkLo;
  for (let x = 0; x < F.w; x += 40) ctx.fillRect(x, wy + 48, 1.5, F.h);
  ctx.fillRect(0, wy + 80, F.w, 1.5);
  ctx.fillRect(0, wy + 112, F.w, 1.5);
}

// —— 龙 ——
function fmtHp(v) {
  v = Math.ceil(v);
  if (v >= 10000) return Math.round(v / 1000) + 'k';
  if (v >= 1000) return (v / 1000).toFixed(1) + 'k';
  return '' + v;
}

function drawSeg(ctx, g, t, isTail) {
  const R = C.DRAGON.r;
  const wob = Math.sin(t * 6 + g.id * 0.9) * 0.8;
  const pop = 1 + Math.max(0, g.flash) * 2.2; // 打中那一下鼓一下
  ctx.save();
  ctx.translate(g.x, g.y + wob);
  ctx.scale(pop, pop);
  if (g.chest) {
    // 机关匣：朱漆方匣 + 金箍 + 齿轮
    ctx.rotate(g.a || 0);
    ctx.fillStyle = P.line;
    roundRect(ctx, -R - 2, -R - 2, 2 * R + 4, 2 * R + 4, 6);
    ctx.fill();
    ctx.fillStyle = P.lac;
    roundRect(ctx, -R, -R, 2 * R, 2 * R, 5);
    ctx.fill();
    ctx.fillStyle = P.lacLo;
    ctx.fillRect(-R, R - 7, 2 * R, 7);
    ctx.fillStyle = P.lacHi;
    ctx.fillRect(-R + 3, -R + 2, 2 * R - 6, 3);
    ctx.fillStyle = P.gold;
    ctx.fillRect(-R, -2, 2 * R, 4);
    ctx.fillRect(-2, -R, 4, 2 * R);
    const glow = 0.5 + 0.5 * Math.sin(t * 8 + g.id);
    ctx.fillStyle = mix('#ffd65a', '#fff7d0', glow);
    ctx.beginPath();
    ctx.arc(0, 0, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  } else if (g.ram) {
    // 攻城槌（龙尾最后一节，三倍血）：铁色、更大、往后一根尖刺
    ctx.rotate((g.a || 0) + Math.PI);
    ctx.fillStyle = P.line;
    ctx.beginPath();
    ctx.moveTo(R + 1, -9);
    ctx.lineTo(R + 20, 0);
    ctx.lineTo(R + 1, 9);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(0, 0, R + 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#6b7080';
    ctx.beginPath();
    ctx.arc(0, 0, R + 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#3c3f4a';
    ctx.beginPath();
    ctx.arc(-4, 5, R, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#6b7080';
    ctx.beginPath();
    ctx.arc(1, -1, R - 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#a9afbf';
    ctx.fillRect(-7, -R + 3, 9, 3);
    ctx.fillStyle = '#9aa0b0';
    ctx.beginPath();
    ctx.moveTo(R + 2, -5);
    ctx.lineTo(R + 15, 0);
    ctx.lineTo(R + 2, 5);
    ctx.fill();
    ctx.fillStyle = P.red;
    ctx.fillRect(-2, -2, 4, 4);
    ctx.restore();
  } else {
    ctx.fillStyle = P.line;
    ctx.beginPath();
    ctx.arc(0, 0, R + 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = P.brass;
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.fill();
    // 硬阴影（右下）
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, R, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = P.brassLo;
    ctx.beginPath();
    ctx.arc(5, 6, R, 0, Math.PI * 2);
    ctx.rect(-40, -40, 80, 80);
    ctx.fill('evenodd');
    ctx.restore();
    ctx.fillStyle = P.brassHi;
    ctx.fillRect(-R + 5, -R + 5, 7, 3);
    ctx.fillRect(-R + 4, -R + 8, 3, 4);
    // 铆钉，跟着走的方向转
    ctx.fillStyle = P.line;
    for (let k = 0; k < 4; k++) {
      const a = (g.a || 0) + (k * Math.PI) / 2 + Math.PI / 4;
      ctx.fillRect(Math.cos(a) * (R - 3) - 1.5, Math.sin(a) * (R - 3) - 1.5, 3, 3);
    }
    if (isTail) {
      ctx.rotate((g.a || 0) + Math.PI);
      ctx.fillStyle = P.line;
      ctx.beginPath();
      ctx.moveTo(R - 2, -7);
      ctx.lineTo(R + 13, 0);
      ctx.lineTo(R - 2, 7);
      ctx.fill();
      ctx.fillStyle = P.brassLo;
      ctx.beginPath();
      ctx.moveTo(R - 1, -4);
      ctx.lineTo(R + 9, 0);
      ctx.lineTo(R - 1, 4);
      ctx.fill();
    }
    ctx.restore();
  }
  if (g.flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(g.x, g.y + wob, R + 1, 0, Math.PI * 2);
    ctx.fill();
  }
  // 血（数字）
  ctx.save();
  ctx.font = '900 11px "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 3;
  ctx.strokeStyle = P.line;
  const txt = fmtHp(g.hp);
  ctx.strokeText(txt, g.x, g.y + wob + 0.5);
  ctx.fillStyle = '#fffaf0';
  ctx.fillText(txt, g.x, g.y + wob + 0.5);
  ctx.restore();
}

function drawHead(ctx, g, t, danger) {
  // 龙头：在最前面那节前方，朝走的方向
  const a = g.a || 0;
  const R = C.DRAGON.r;
  const hx = g.x + Math.cos(a) * (R + 9);
  const hy = g.y + Math.sin(a) * (R + 9);
  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(a);
  const flip = Math.cos(a) < -0.1 ? -1 : 1;
  ctx.scale(1, flip);
  const jaw = Math.sin(t * 7) > 0.6 ? 3 : 0;
  ctx.fillStyle = P.line;
  ctx.fillRect(-12, -12, 26, 20);
  ctx.fillRect(10, -8, 10, 12 + jaw);
  ctx.fillRect(-14, -18, 6, 8);
  ctx.fillRect(-6, -20, 6, 9);
  ctx.fillStyle = P.brass;
  ctx.fillRect(-10, -10, 22, 16);
  ctx.fillRect(10, -6, 8, 6);
  ctx.fillStyle = P.brassLo;
  ctx.fillRect(-10, 2, 22, 4);
  ctx.fillRect(10, 2 + jaw, 8, 3);
  ctx.fillStyle = P.brassHi;
  ctx.fillRect(-8, -10, 14, 3);
  ctx.fillStyle = P.brassLo;
  ctx.fillRect(-13, -17, 4, 6);
  ctx.fillRect(-5, -19, 4, 7);
  // 眼睛
  ctx.fillStyle = danger > 0 ? '#ffffff' : P.red;
  ctx.fillRect(2, -7, 5, 4);
  ctx.fillStyle = '#ffd0a0';
  ctx.fillRect(4, -7, 2, 2);
  // 牙
  ctx.fillStyle = '#f4ead8';
  ctx.fillRect(12, 0, 2, 3);
  ctx.fillRect(16, 0, 2, 3);
  ctx.restore();
}

function drawDragon(ctx, st, t) {
  const segs = st.segs;
  for (let i = segs.length - 1; i >= 0; i--) {
    const g = segs[i];
    if (g.y < -30) continue;
    drawSeg(ctx, g, t, i === segs.length - 1 && segs.length > 1);
  }
  if (segs.length && segs[0].y > -30) drawHead(ctx, segs[0], t, st.danger);
}

// 箭的样子跟着武器「多重」变：黄铜 → 银蓝 → 金光 → 红热带火尾
const BOLT = [
  { core: P.brassHi, tip: '#fff6c8', len: 12, w: 2.4, trail: 0 },
  { core: '#cfe6ff', tip: '#ffffff', len: 14, w: 2.8, trail: 18, tc: '120,190,255' },
  { core: P.gold, tip: '#fffbe0', len: 16, w: 3.2, trail: 26, tc: '255,214,90', glow: 'rgba(255,214,90,0.35)' },
  { core: '#ff7a3a', tip: '#fff0b0', len: 18, w: 3.6, trail: 34, tc: '255,110,50', glow: 'rgba(255,100,40,0.4)' },
];
function boltTier(tier) {
  return BOLT[tier >= 7 ? 3 : tier >= 4 ? 2 : tier >= 2 ? 1 : 0];
}
function drawBullets(ctx, st) {
  const B = boltTier(st.mods.tier || 0);
  for (const u of st.bullets) {
    const a = Math.atan2(u.vy, u.vx);
    ctx.save();
    ctx.translate(u.x, u.y);
    ctx.rotate(a);
    if (B.trail) {
      ctx.fillStyle = 'rgba(' + B.tc + ',0.35)';
      ctx.fillRect(-B.len - B.trail, -B.w / 2, B.trail, B.w);
    }
    if (B.glow) {
      ctx.fillStyle = B.glow;
      ctx.fillRect(-B.len, -B.w * 1.5, B.len + 8, B.w * 3);
    }
    ctx.fillStyle = P.line;
    ctx.fillRect(-B.len + 3, -B.w / 2 - 1.2, B.len + 3, B.w + 2.4);
    ctx.fillStyle = u.bounced ? '#7dff9a' : B.core;
    ctx.fillRect(-B.len + 4, -B.w / 2, B.len, B.w);
    ctx.fillStyle = B.tip;
    ctx.fillRect(3, -B.w / 2 - 0.6, 4, B.w + 1.2);
    ctx.restore();
  }
}

// 伙伴在场上：跟着 st.pal 的位置和状态画
function drawPal(ctx, st, t) {
  const p = st.pal;
  if (!p) return;
  const b = st.buddy;
  // 冷却圈：待命时脚下一圈慢慢填满，满了就出手
  if (p.state === 'home' && b.cd) {
    const k = clamp(1 - p.cd / b.cd, 0, 1);
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(p.x, p.y + 14, 9, 0, Math.PI * 2);
    ctx.stroke();
    ctx.strokeStyle = k >= 1 ? '#ffffff' : P.gold;
    ctx.beginPath();
    ctx.arc(p.x, p.y + 14, 9, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k);
    ctx.stroke();
  }
  if (b.id === 'que') {
    const flying = p.state !== 'home';
    if (flying) {
      // 金色尾迹
      ctx.fillStyle = 'rgba(255,214,90,0.35)';
      ctx.beginPath();
      ctx.arc(p.x - (p.fx || 0) * 10, p.y + 4, 6, 0, Math.PI * 2);
      ctx.fill();
    }
    const dip = p.state === 'peck' ? (p.t > 0.04 ? 4 : 0) : 0;
    if (flying) {
      ctx.fillStyle = 'rgba(255,240,190,0.35)';
      ctx.beginPath();
      ctx.arc(p.x, p.y + dip, 17, 0, Math.PI * 2);
      ctx.fill();
    }
    drawBuddy(ctx, 'que', p.x, p.y + dip, t * (flying ? 2.5 : 1), flying ? 1.8 : 1.4, (p.fx || 0) < 0);
  } else if (b.id === 'quan') {
    const air = p.state !== 'home';
    ctx.save();
    ctx.translate(p.x, p.y);
    if (air) ctx.rotate((p.fx || 1) * (p.state === 'leap' ? -0.5 : 0.4));
    drawBuddy(ctx, 'quan', 0, 0, air ? 0 : t, 1.4, (p.fx || 1) < 0);
    ctx.restore();
  } else if (b.id === 'gui') {
    const r = Math.max(0, p.recoil || 0) / 0.25;
    ctx.save();
    ctx.translate(p.x, p.y + r * 3);
    ctx.scale(1 + r * 0.15, 1 - r * 0.15);
    drawBuddy(ctx, 'gui', 0, 0, t, 1.4, true);
    ctx.restore();
  }
}

// 蒸汽龟的炮弹：高高的抛物线，落点先亮一个红圈（看得见要炸哪）
function drawShells(ctx, st) {
  for (const sh of st.shells) {
    const u = sh.t / sh.T;
    const R = st.buddy ? st.buddy.shellR : 60;
    ctx.globalAlpha = 0.3 + 0.4 * u;
    ctx.strokeStyle = P.red;
    ctx.lineWidth = 2;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.arc(sh.tx, sh.ty, R * (1.25 - 0.25 * u), 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
    const x = sh.x0 + (sh.tx - sh.x0) * u;
    const y = sh.y0 + (sh.ty - sh.y0) * u - Math.sin(u * Math.PI) * 160;
    ctx.fillStyle = P.line;
    ctx.beginPath();
    ctx.arc(x, y, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#4a4f5c';
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff9a3c';
    ctx.fillRect(x - 1.5, y - 9, 3, 3 + Math.sin(sh.t * 40) * 1.5);
  }
}

// ================= 0.3：照风格库 LDR-S1E08-a 祝有好收获（细褐线、平涂一层硬影、黄铜一道白高光、一地一色）=================
const LINE = '#1E1A16';
const IMG = {}; // 生图到了以后 main.js 往这里放（读不到就用代码画）
function imgOk(k) {
  const im = IMG[k];
  return im && im.ok;
}
// 平涂圆 + 右下一块硬阴影 + 细线
function disc(ctx, x, y, r, base, shade, lw) {
  ctx.fillStyle = LINE;
  ctx.beginPath();
  ctx.arc(x, y, r + (lw || 1.4), 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = base;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.clip();
  ctx.fillStyle = shade;
  ctx.beginPath();
  ctx.rect(x - r - 2, y - r - 2, 2 * r + 4, 2 * r + 4);
  ctx.arc(x - r * 0.28, y - r * 0.34, r, 0, Math.PI * 2, true);
  ctx.fill();
  ctx.restore();
}
function streak(ctx, x, y, r) {
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.save();
  ctx.translate(x - r * 0.42, y - r * 0.42);
  ctx.rotate(-0.8);
  ctx.fillRect(-r * 0.32, -1.2, r * 0.64, 2.4);
  ctx.restore();
}

const FAM = {
  dragon: { base: '#9C7F42', shade: '#7F602C', hi: '#EFBE63' },
  centi: { base: '#4a5560', shade: '#30373f', hi: '#a9bccb' },
  terra: { base: '#a8693f', shade: '#7d4a2b', hi: '#d39a6a' },
};

function drawSegBody(ctx, g, t, fam) {
  const R = g.r;
  const c = FAM[fam];
  if (fam === 'centi') {
    // 两对小腿，跟着走的方向一摆一摆
    const a = g.a || 0;
    const nx = -Math.sin(a);
    const ny = Math.cos(a);
    const tx = Math.cos(a);
    const ty = Math.sin(a);
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 2.6;
    ctx.lineCap = 'round';
    for (const side of [-1, 1]) {
      for (const k of [-0.45, 0.45]) {
        const w = Math.sin(t * 14 + g.id + k * 3) * 3;
        const bx = g.x + tx * R * k;
        const by = g.y + ty * R * k;
        ctx.beginPath();
        ctx.moveTo(bx + nx * side * R * 0.8, by + ny * side * R * 0.8);
        ctx.lineTo(bx + nx * side * (R + 6) + tx * w, by + ny * side * (R + 6) + ty * w);
        ctx.lineTo(bx + nx * side * (R + 9) + tx * (w - 3), by + ny * side * (R + 9) + ty * (w - 3));
        ctx.stroke();
      }
    }
  }
  disc(ctx, g.x, g.y, R, c.base, c.shade);
  if (fam === 'dragon') {
    // 齿轮边 + 四颗铆钉
    ctx.fillStyle = LINE;
    for (let k = 0; k < 4; k++) {
      const a = (g.a || 0) + (k * Math.PI) / 2 + Math.PI / 4;
      ctx.fillRect(g.x + Math.cos(a) * (R - 4) - 1.3, g.y + Math.sin(a) * (R - 4) - 1.3, 2.6, 2.6);
    }
    ctx.strokeStyle = c.shade;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(g.x, g.y, R * 0.55, 0, Math.PI * 2);
    ctx.stroke();
  } else if (fam === 'centi') {
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(g.x - Math.sin(g.a) * R, g.y + Math.cos(g.a) * R);
    ctx.lineTo(g.x + Math.sin(g.a) * R, g.y - Math.cos(g.a) * R);
    ctx.stroke();
  } else if (fam === 'terra') {
    // 陶俑从上往下看：肩甲两片 + 发髻
    ctx.fillStyle = c.shade;
    ctx.fillRect(g.x - R * 0.7, g.y - 1, R * 1.4, 2);
    disc(ctx, g.x, g.y, R * 0.45, '#b98258', '#8a5a38', 1);
    ctx.fillStyle = '#2b1d16';
    ctx.beginPath();
    ctx.arc(g.x + 1, g.y - 1, R * 0.2, 0, Math.PI * 2);
    ctx.fill();
  }
  streak(ctx, g.x, g.y, R);
}

function drawSegType(ctx, st, g, t, fam) {
  const R = g.r;
  const type = g.type;
  if (type === 'shield') {
    // 朝下（朝阿铸）一块弧形铁盾
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.arc(g.x, g.y, R + 1, Math.PI * 0.12, Math.PI * 0.88);
    ctx.stroke();
    ctx.strokeStyle = '#7d8696';
    ctx.lineWidth = 5;
    ctx.stroke();
    ctx.strokeStyle = '#d7e0ea';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(g.x, g.y, R + 2.4, Math.PI * 0.3, Math.PI * 0.55);
    ctx.stroke();
    ctx.fillStyle = '#c9a24a';
    for (const k of [0.25, 0.5, 0.75]) {
      const a = Math.PI * (0.12 + 0.76 * k);
      ctx.fillRect(g.x + Math.cos(a) * (R + 1) - 1.2, g.y + Math.sin(a) * (R + 1) - 1.2, 2.4, 2.4);
    }
  } else if (type === 'core') {
    const p = 0.5 + 0.5 * Math.sin(t * 6 + g.id);
    ctx.fillStyle = 'rgba(110,255,150,' + (0.25 + 0.25 * p).toFixed(2) + ')';
    ctx.beginPath();
    ctx.arc(g.x, g.y, R * 0.75, 0, Math.PI * 2);
    ctx.fill();
    disc(ctx, g.x, g.y, R * 0.38, '#6dff9a', '#2fb45c', 1);
  }
}

// 不走家族画法的兵种：火药桶、幽影、分裂、重甲俑
function drawSpecial(ctx, st, g, t) {
  const R = g.r;
  if (g.type === 'powder') {
    disc(ctx, g.x, g.y, R, '#8a5a30', '#663f1e');
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 2.2;
    for (const k of [-0.45, 0.45]) {
      ctx.beginPath();
      ctx.arc(g.x, g.y, R * (1 - Math.abs(k) * 0.4), 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.fillStyle = '#c0352b';
    ctx.fillRect(g.x - 4, g.y - 4, 8, 8);
    // 引线冒火星
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(g.x + 3, g.y - R + 2);
    ctx.quadraticCurveTo(g.x + 9, g.y - R - 6, g.x + 6, g.y - R - 10);
    ctx.stroke();
    const sp = 0.6 + 0.4 * Math.sin(t * 30 + g.id);
    ctx.fillStyle = '#ffd65a';
    star(ctx, g.x + 6, g.y - R - 10, 4 * sp + 2, 1.5, 6);
    return true;
  }
  if (g.type === 'ghost') {
    const ph = st.phasedOf ? st.phasedOf(g) : false;
    const bob = Math.sin(t * 2.6 + g.id) * 2;
    ctx.globalAlpha = ph ? 0.22 : 0.92;
    ctx.fillStyle = '#d9ecf5';
    ctx.beginPath();
    ctx.arc(g.x, g.y + bob, R, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#72AFC8';
    ctx.lineWidth = 2.4;
    if (ph) ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#2a4376';
    ctx.fillRect(g.x - 6, g.y + bob - 3, 3, 4);
    ctx.fillRect(g.x + 3, g.y + bob - 3, 3, 4);
    ctx.globalAlpha = 1;
    return true;
  }
  if (g.type === 'split') {
    disc(ctx, g.x, g.y, R, '#5f9e74', '#3f7553');
    ctx.strokeStyle = '#b8ffcf';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(g.x - 2, g.y - R + 2);
    ctx.lineTo(g.x + 3, g.y - 3);
    ctx.lineTo(g.x - 3, g.y + 4);
    ctx.lineTo(g.x + 1, g.y + R - 2);
    ctx.stroke();
    streak(ctx, g.x, g.y, R);
    return true;
  }
  if (g.type === 'clay') {
    disc(ctx, g.x, g.y, R + 2, '#7c4a32', '#5a3322');
    ctx.strokeStyle = LINE;
    ctx.lineWidth = 1;
    for (let k = -1; k <= 1; k++) {
      ctx.beginPath();
      ctx.moveTo(g.x - R * 0.8, g.y + k * 6);
      ctx.lineTo(g.x + R * 0.8, g.y + k * 6);
      ctx.stroke();
    }
    disc(ctx, g.x, g.y - 1, R * 0.4, '#9a6646', '#6e452e', 1);
    return true;
  }
  return false;
}

function drawChest(ctx, g, t) {
  const R = g.r;
  ctx.save();
  ctx.translate(g.x, g.y);
  ctx.rotate(g.a || 0);
  ctx.fillStyle = LINE;
  roundRect(ctx, -R - 1.5, -R - 1.5, 2 * R + 3, 2 * R + 3, 5);
  ctx.fill();
  ctx.fillStyle = P.lac;
  roundRect(ctx, -R, -R, 2 * R, 2 * R, 4);
  ctx.fill();
  ctx.fillStyle = P.lacLo;
  ctx.fillRect(-R, R * 0.3, 2 * R, R * 0.7);
  ctx.fillStyle = P.gold;
  ctx.fillRect(-R, -2, 2 * R, 4);
  ctx.fillRect(-2, -R, 4, 2 * R);
  const glow = 0.5 + 0.5 * Math.sin(t * 8 + g.id);
  ctx.fillStyle = mix('#ffd65a', '#fff7d0', glow);
  ctx.beginPath();
  ctx.arc(0, 0, 5.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillRect(-R + 3, -R + 3, R * 0.7, 2);
  ctx.restore();
}
function drawRam(ctx, g) {
  const R = g.r;
  ctx.save();
  ctx.translate(g.x, g.y);
  ctx.rotate((g.a || 0) + Math.PI);
  ctx.fillStyle = LINE;
  ctx.beginPath();
  ctx.moveTo(R, -9);
  ctx.lineTo(R + 20, 0);
  ctx.lineTo(R, 9);
  ctx.fill();
  ctx.fillStyle = '#9aa0b0';
  ctx.beginPath();
  ctx.moveTo(R + 1, -5.5);
  ctx.lineTo(R + 15, 0);
  ctx.lineTo(R + 1, 5.5);
  ctx.fill();
  ctx.restore();
  disc(ctx, g.x, g.y, R + 3, '#5e6474', '#3c404c');
  ctx.fillStyle = '#c94a3a';
  ctx.fillRect(g.x - 2, g.y - 2, 4, 4);
  streak(ctx, g.x, g.y, R + 3);
}

function drawSegAll(ctx, st, g, t, isTail) {
  const fam = st.ch.enemy;
  const wob = Math.sin(t * 6 + g.id * 0.9) * 0.6;
  const pop = 1 + Math.max(0, g.flash) * 2.2;
  ctx.save();
  ctx.translate(g.x, g.y + wob);
  ctx.scale(pop, pop);
  ctx.translate(-g.x, -g.y);
  if (g.chest) drawChest(ctx, g, t);
  else if (g.ram) drawRam(ctx, g);
  else if (!drawSpecial(ctx, st, g, t)) {
    drawSegBody(ctx, g, t, fam);
    drawSegType(ctx, st, g, t, fam);
  }
  if (g.frozT > 0) {
    ctx.globalAlpha = Math.min(1, g.frozT * 2) * 0.55;
    ctx.fillStyle = '#d8ecff';
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.r + 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(g.x - 6, g.y - 6);
    ctx.lineTo(g.x + 6, g.y + 6);
    ctx.moveTo(g.x + 6, g.y - 6);
    ctx.lineTo(g.x - 6, g.y + 6);
    ctx.stroke();
  }
  if (g.flash > 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(g.x, g.y, g.r + 1, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
  // 血（数字）
  ctx.save();
  ctx.font = '900 ' + (g.type === 'mini' ? 9 : 11) + 'px "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 3;
  ctx.strokeStyle = LINE;
  const txt = fmtHp(g.hp);
  const ty = g.y + wob + 0.5;
  ctx.strokeText(txt, g.x, ty);
  ctx.fillStyle = g.type === 'core' && g.hp < g.max && g.noRegen <= 0 ? '#9dffb8' : '#fffaf0';
  ctx.fillText(txt, g.x, ty);
  ctx.restore();
}

function drawHeadAll(ctx, st, g, t) {
  const fam = st.ch.enemy;
  if (fam === 'dragon') return drawHead(ctx, g, t, st.danger);
  const a = g.a || 0;
  const R = C.DRAGON.r;
  const hx = g.x + Math.cos(a) * (R + 8);
  const hy = g.y + Math.sin(a) * (R + 8);
  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(a);
  if (fam === 'centi') {
    // 铁蜈蚣：一对大钳子一开一合
    const open = 0.35 + Math.abs(Math.sin(t * 5)) * 0.35;
    ctx.lineCap = 'round';
    for (const s of [-1, 1]) {
      ctx.save();
      ctx.rotate(s * open);
      ctx.strokeStyle = LINE;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(4, s * 4);
      ctx.quadraticCurveTo(16, s * 9, 20, s * 1);
      ctx.stroke();
      ctx.strokeStyle = '#a9bccb';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.restore();
    }
    disc(ctx, 0, 0, 10, '#4a5560', '#30373f');
    ctx.fillStyle = st.danger > 0 ? '#ffffff' : '#7dff9a';
    ctx.fillRect(3, -6, 3, 3);
    ctx.fillRect(3, 3, 3, 3);
  } else {
    // 陶俑将军：高冠、脸朝前
    ctx.fillStyle = LINE;
    ctx.fillRect(-14, -6, 10, 12);
    ctx.fillStyle = '#5a2d1e';
    ctx.fillRect(-13, -5, 8, 10);
    disc(ctx, 0, 0, 10, '#c48a5c', '#94603c');
    ctx.fillStyle = '#c0352b';
    ctx.fillRect(-4, -11, 8, 4);
    ctx.fillStyle = st.danger > 0 ? '#ff3b2f' : LINE;
    ctx.fillRect(4, -4, 2.5, 2.5);
    ctx.fillRect(4, 2, 2.5, 2.5);
  }
  ctx.restore();
}

function drawDragonAll(ctx, st, t) {
  const segs = st.segs;
  for (let i = segs.length - 1; i >= 0; i--) {
    const g = segs[i];
    if (g.y < -30) continue;
    drawSegAll(ctx, st, g, t, i === segs.length - 1 && segs.length > 1);
  }
  if (segs.length && segs[0].y > -30) drawHeadAll(ctx, st, segs[0], t);
}

// —— 阿铸（细线赛璐璐，背影）——
function drawHero(ctx, x, y, t, recoil, moving, lv) {
  const bob = moving ? Math.abs(Math.sin(t * 11)) * -1.5 : Math.sin(t * 3) * 0.6;
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.save();
  ctx.translate(x, y + 27);
  ctx.scale(1, 0.28);
  ctx.beginPath();
  ctx.arc(0, 0, 20, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  const yy = y + bob;
  const ol = (fn) => {
    ctx.fillStyle = LINE;
    fn(1.4);
  };
  // 腿
  const step = moving ? Math.sin(t * 22) * 3 : 0;
  for (const s of [-1, 1]) {
    ctx.fillStyle = LINE;
    roundRect(ctx, x + s * 7 - 5.5, yy + 6 + (s > 0 ? step : -step) * 0.3, 11, 20, 3);
    ctx.fill();
    ctx.fillStyle = '#3a2f3a';
    roundRect(ctx, x + s * 7 - 4.3, yy + 7 + (s > 0 ? step : -step) * 0.3, 8.6, 17.6, 2.5);
    ctx.fill();
  }
  // 手臂（举着弩，往上）
  for (const s of [-1, 1]) {
    ctx.fillStyle = LINE;
    roundRect(ctx, x + s * 15 - 5, yy - 26, 10, 22, 4);
    ctx.fill();
    ctx.fillStyle = '#d9a777';
    roundRect(ctx, x + s * 15 - 3.8, yy - 24.8, 7.6, 19.6, 3);
    ctx.fill();
    ctx.fillStyle = '#b57f52';
    ctx.fillRect(x + s * 15 + (s > 0 ? 0 : -3.8), yy - 24.8, 3.8, 19.6);
  }
  // 背（宽肩倒梯形）+ 背心 + 围裙带
  ctx.fillStyle = LINE;
  ctx.beginPath();
  ctx.moveTo(x - 17, yy - 16);
  ctx.lineTo(x + 17, yy - 16);
  ctx.lineTo(x + 11, yy + 10);
  ctx.lineTo(x - 11, yy + 10);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#6b4a30';
  ctx.beginPath();
  ctx.moveTo(x - 15.5, yy - 14.8);
  ctx.lineTo(x + 15.5, yy - 14.8);
  ctx.lineTo(x + 10, yy + 8.8);
  ctx.lineTo(x - 10, yy + 8.8);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#4e3421';
  ctx.beginPath();
  ctx.moveTo(x + 2, yy - 14.8);
  ctx.lineTo(x + 15.5, yy - 14.8);
  ctx.lineTo(x + 10, yy + 8.8);
  ctx.lineTo(x + 2, yy + 8.8);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#2d1f14';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - 12, yy - 14);
  ctx.lineTo(x + 8, yy + 7);
  ctx.moveTo(x + 12, yy - 14);
  ctx.lineTo(x - 8, yy + 7);
  ctx.stroke();
  // 头（后脑勺）+ 红头巾，两条带子飘
  ctx.fillStyle = '#b8302a';
  const fl = Math.sin(t * 8) * 3;
  ctx.beginPath();
  ctx.moveTo(x + 4, yy - 24);
  ctx.lineTo(x + 14 + fl, yy - 14);
  ctx.lineTo(x + 10 + fl, yy - 12);
  ctx.closePath();
  ctx.fill();
  disc(ctx, x, yy - 25, 9, '#26201c', '#15110e');
  ctx.fillStyle = LINE;
  ctx.fillRect(x - 9.5, yy - 28, 19, 5.5);
  ctx.fillStyle = '#d4483e';
  ctx.fillRect(x - 9, yy - 27.4, 18, 4.2);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fillRect(x - 4, yy - 31, 5, 1.6);
  drawCrossbow(ctx, x, yy - 30, recoil, t, lv);
}

// —— 七件武器的画法 ——
function drawWeapons(ctx, st, t) {
  const F = C.FIELD;
  // 地上的火
  for (const f of st.fires) {
    const k = f.t / f.max;
    ctx.globalAlpha = Math.min(1, k * 3) * 0.35;
    ctx.fillStyle = '#ff6a2a';
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = Math.min(1, k * 3);
    for (let i = 0; i < 7; i++) {
      const a = (i / 7) * Math.PI * 2 + i;

function stepFx(dt) {

      G.fx.splice(i, 1);
      continue;
    }
    if (p.k === 'sq' || p.k === 'chunk' || p.k === 'gear') {

      p.y += p.vy * dt;

      p.y += p.vy * dt;

      p.vy *= 0.9;

      const e2 = u * u;
      p.x = p.x0 + (F.w - 64 - p.x0) * e2;
      p.y = p.y0 + (21 - p.y0) * e2 - Math.sin(u * Math.PI) * 40;
      if (p.life - dt <= 0) {
        G.goldBump = 1;
        snd('coin', 60, 0.12);
      }

      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }
  if (G.fx.length > FXMAX) G.fx.splice(0, G.fx.length - FXMAX);
}

      ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);

      ctx.globalAlpha = k * 0.75;
      ctx.fillStyle = D.P.steam;

    } else if (p.k === 'txt') {
      ctx.globalAlpha = Math.min(1, k * 2);
      bigText(ctx, p.s, p.x, p.y, p.size, p.c);
      ctx.globalAlpha = 1;
    } else if (p.k === 'ring') {
      ctx.globalAlpha = k;
      ctx.strokeStyle = p.c;
      ctx.lineWidth = (p.w || 4) * k + 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (1.2 - k * 0.6), 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (p.k === 'rays') {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(G.t * 2);
      ctx.globalAlpha = k;
      ctx.fillStyle = D.P.gold;
      const rr = p.r || 46;
      D.star(ctx, 0, 0, rr * (1.4 - k * 0.4), rr * 0.26, 10);
      ctx.restore();
      ctx.globalAlpha = 1;
    } else if (p.k === 'combo') {
      const s = easeOutBack(clamp((p.max - p.life) / 0.2, 0, 1));
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.scale(s, s);
      ctx.globalAlpha = Math.min(1, k * 3);
      bigText(ctx, p.s, 0, 0, p.size, D.P.gold);
      ctx.restore();
      ctx.globalAlpha = 1;
    } else if (p.k === 'ball') {
      const u = 1 - k;
      const x = p.x + (p.tx - p.x) * u;
      const y = p.y + (p.ty - p.y) * u - Math.sin(u * Math.PI) * 60;
      ctx.fillStyle = D.P.line;
      ctx.beginPath();
      ctx.arc(x, y, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff9a3c';
      ctx.beginPath();
      ctx.arc(x, y, 3.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (p.k === 'chunk') {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.min(1, k * 2.5);
      ctx.fillStyle = D.P.line;
      ctx.fillRect(-p.w / 2 - 1, -p.h / 2 - 1, p.w + 2, p.h + 2);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
      ctx.globalAlpha = 1;
    } else if (p.k === 'gear') {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.min(1, k * 2.5);
      ctx.fillStyle = D.P.line;
      D.star(ctx, 0, 0, p.r + 2.5, p.r, 6);
      ctx.fillStyle = D.P.brassHi;
      D.star(ctx, 0, 0, p.r + 1.5, p.r - 0.5, 6);
      ctx.fillStyle = D.P.line;
      ctx.fillRect(-1, -1, 2, 2);
      ctx.restore();
      ctx.globalAlpha = 1;
    } else if (p.k === 'spark') {
      ctx.globalAlpha = Math.min(1, k * 1.5);
      ctx.strokeStyle = p.c;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03);
      ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (p.k === 'pop') {
      ctx.globalAlpha = k * 0.9;
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (1.3 - k * 0.5), 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (p.k === 'fire') {
      const u = 1 - k;
      ctx.globalAlpha = k;
      ctx.fillStyle = '#ff7a2a';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (0.5 + u * 0.6), 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffd65a';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * (0.35 + u * 0.3) * k, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (p.k === 'scorch') {
      ctx.globalAlpha = k * 0.45;
      ctx.fillStyle = '#0d0806';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (p.k === 'coin') {
      if (p.life > p.max - p.d) continue;
      ctx.fillStyle = D.P.line;
      ctx.fillRect(p.x - 4, p.y - 4, 8, 8);
      ctx.fillStyle = D.P.gold;
      ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
      ctx.fillStyle = '#fffbe0';
      ctx.fillRect(p.x - 2, p.y - 2, 2, 2);
    } else if (p.k === 'cloud') {
      ctx.globalAlpha = Math.min(1, k * 3) * 0.55;
      ctx.fillStyle = '#dfe9f5';
      ctx.beginPath();
      ctx.arc(p.x + Math.sin(G.t * 2 + p.ph) * 4, p.y + Math.cos(G.t * 1.7 + p.ph) * 3, p.s, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    } else if (p.k === 'bolt') {
      // 雷链：一段段折线，白芯蓝边
      let sd = p.seed;
      const rnd = () => ((sd = (sd * 9301 + 49297) % 233280) / 233280 - 0.5);
      for (const [w, c] of [[5, 'rgba(120,170,255,' + (k * 0.8).toFixed(2) + ')'], [2, 'rgba(255,255,255,' + k.toFixed(2) + ')']]) {
        ctx.strokeStyle = c;
        ctx.lineWidth = w;
        ctx.beginPath();
        ctx.moveTo(p.pts[0].x, p.pts[0].y);
        sd = p.seed;
        for (let i = 1; i < p.pts.length; i++) {
          const a = p.pts[i - 1];
          const b = p.pts[i];
          for (let j = 1; j <= 3; j++) {
            const u = j / 3;
            const jit = j < 3 ? 9 : 0;
            ctx.lineTo(a.x + (b.x - a.x) * u + rnd() * jit, a.y + (b.y - a.y) * u + rnd() * jit);
          }
        }
        ctx.stroke();
      }
    } else if (p.k === 'chomp') {
      // 木犬咬下去：上下两排牙合上
      const u = 1 - k;
      const close = Math.min(1, u * 3);
      const gap = 22 * (1 - close);
      ctx.globalAlpha = Math.min(1, k * 2);
      for (const d of [-1, 1]) {
        const y0 = p.y + d * (gap + 6);
        ctx.fillStyle = D.P.line;
        ctx.fillRect(p.x - 22, y0 - 5, 44, 10);
        ctx.fillStyle = '#f4ead8';
        for (let i = 0; i < 5; i++) {
          ctx.beginPath();
          ctx.moveTo(p.x - 20 + i * 9, y0 - d * 3);
          ctx.lineTo(p.x - 16 + i * 9, y0 - d * 11);
          ctx.lineTo(p.x - 12 + i * 9, y0 - d * 3);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
    }
  }
}

// —— 按钮 ——
function button(id, x, y, w, h, label, opt) {
  opt = opt || {};
  G.buttons.push({ id, x, y, w, h, disabled: !!opt.disabled });
  const press = G.pressId === id ? 0.94 : 1;
  ctx.save();
  ctx.translate(x + w / 2, y + h / 2);
  ctx.scale(press * (opt.pop || 1), press * (opt.pop || 1));
  const col = opt.disabled ? '#5a4b44' : opt.color || D.P.lac;
  const hi = opt.disabled ? '#6d5d55' : opt.hi || D.P.lacHi;
  ctx.fillStyle = D.P.line;
  roundRect(ctx, -w / 2 - 2, -h / 2 - 2, w + 4, h + 6, 10);
  ctx.fill();
  ctx.fillStyle = mix(col, '#000000', 0.35);
  roundRect(ctx, -w / 2, -h / 2 + 3, w, h, 9);
  ctx.fill();
  ctx.fillStyle = col;
  roundRect(ctx, -w / 2, -h / 2, w, h, 9);
  ctx.fill();
  ctx.fillStyle = hi;
  ctx.fillRect(-w / 2 + 8, -h / 2 + 4, w - 16, 3);
  bigText(ctx, label, opt.icon ? 10 : 0, 1, opt.size || 20, opt.disabled ? '#a89890' : '#fffaf0', D.P.line);
  if (opt.icon === 'ad') adIcon(-w / 2 + 22, 1);
  if (opt.icon === 'coin') coinIcon(-w / 2 + 20, 1, 8);
  ctx.restore();
}
function adIcon(x, y) {
  ctx.fillStyle = D.P.line;
  roundRect(ctx, x - 11, y - 8, 22, 16, 4);
  ctx.fill();
  ctx.fillStyle = '#fffaf0';
  ctx.beginPath();
  ctx.moveTo(x - 3, y - 5);
  ctx.lineTo(x + 5, y);
  ctx.lineTo(x - 3, y + 5);
  ctx.fill();
}
function coinIcon(x, y, r) {
  ctx.fillStyle = D.P.line;
  ctx.beginPath();
  ctx.arc(x, y, r + 1.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = D.P.gold;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = D.P.brassLo;
  ctx.fillRect(x - r * 0.35, y - r * 0.35, r * 0.7, r * 0.7);
}

// —— 局内 HUD ——
function drawHud(st) {
  // 关卡
  ctx.fillStyle = 'rgba(20,12,10,0.7)';
  roundRect(ctx, 8, 8, 70, 26, 8);

  bigText(ctx, '第' + (st.level + 1) + '关', 43, 21, 14, '#fffaf0');

  ctx.fillStyle = '#3a1410';
  roundRect(ctx, bx, 14, bw, 14, 5);
  ctx.fill();
  const f = st.segs.length / st.total;
  ctx.fillStyle = D.P.lac;
  roundRect(ctx, bx, 14, Math.max(6, bw * f), 14, 5);

  ctx.fillStyle = D.P.lacHi;

  ctx.fillRect(bx - 20, 13, 14, 14);
  ctx.fillStyle = D.P.red;
  ctx.fillRect(bx - 12, 16, 4, 3);

  ctx.translate(F.w - 64, 21);

  // 带着的武器（最多 4 件），右下角写等级，进化了加金框
  let ix = 20;

      roundRect(ctx, ix - 14, 40, 28, 28, 6);

    bigText(ctx, lv >= 5 ? '★' : '' + lv, ix + 10, 64, 9, lv >= 5 ? D.P.gold : '#fffaf0');
    ix += 32;
  }
}

function wrapText(str, n) {
  const out = [];
  for (let i = 0; i < str.length; i += n) out.push(str.slice(i, i + n));
  return out;
}
function drawCards(st) {
  ctx.fillStyle = 'rgba(10,6,5,0.76)';
  ctx.fillRect(-50, -50, F.w + 100, F.h + 100);
  const t = (PF.now() - G.cardsAt) / 1000;
  ctx.save();
  ctx.translate(F.w / 2, 190);
  ctx.rotate(G.t * 0.8);
  ctx.fillStyle = 'rgba(255,214,90,0.25)';
  D.star(ctx, 0, 0, 70, 20, 12);
  ctx.restore();
  bigText(ctx, '选一个', F.w / 2, 190, 26, D.P.gold);
  const cw = 108;
  const ch = 210;
  st.cards.forEach((id, i) => {
    const w = S.W[id];
    const cur = st.weapons[id] || 0;
    const next = cur + 1;
    const evo = next >= 5;
    const x = 9 + i * (cw + 9);
    const y = 236;
    const pop = easeOutBack(clamp((t - i * 0.07) / 0.22, 0, 1));
    G.buttons.push({ id: 'card' + i, x, y, w: cw, h: ch });
    ctx.save();
    ctx.translate(x + cw / 2, y + ch / 2);
    ctx.scale(pop, pop);
    const pref = st.buddy && st.buddy.prefer === id;
    ctx.fillStyle = D.P.line;
    roundRect(ctx, -cw / 2 - 3, -ch / 2 - 3, cw + 6, ch + 8, 12);
    ctx.fill();
    ctx.fillStyle = evo ? '#5a3f1a' : '#3b2a22';
    roundRect(ctx, -cw / 2, -ch / 2, cw, ch, 10);
    ctx.fill();
    if (evo) {
      ctx.strokeStyle = D.P.gold;
      ctx.lineWidth = 2.5;
      roundRect(ctx, -cw / 2 + 2, -ch / 2 + 2, cw - 4, ch - 4, 9);
      ctx.stroke();
    }
    ctx.fillStyle = w.color;
    ctx.fillRect(-cw / 2 + 6, -ch / 2 + 6, cw - 12, 4);
    // 新 / Lv
    bigText(ctx, cur ? (evo ? '进化' : 'Lv' + cur + '→' + next) : '新！', 0, -ch / 2 + 22, 13, cur ? (evo ? D.P.gold : '#cbb8a8') : '#7dff9a');
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    roundRect(ctx, -32, -ch / 2 + 32, 64, 60, 10);
    ctx.fill();
    D.drawWeaponIcon(ctx, id, 0, -ch / 2 + 62, 48);
    bigText(ctx, evo ? w.evo : w.name, 0, -ch / 2 + 110, 20, evo ? D.P.gold : '#fffaf0');
    // 这一级干什么（两三行）
    wrapText(w.lvDesc[next - 1], 7).slice(0, 3).forEach((ln, k) => bigText(ctx, ln, 0, -ch / 2 + 134 + k * 16, 12, '#e9dccb'));
    // 克哪些兵种（只标这一关会出的）
    const cs = S.counters(st, id);
    if (cs.length) {
      bigText(ctx, '克', -cw / 2 + 16, ch / 2 - 18, 13, '#ff9a6a');
      cs.slice(0, 3).forEach((tp, k) => D.drawTypeIcon(ctx, tp, -cw / 2 + 38 + k * 24, ch / 2 - 18, 18, st));
    }
    if (pref) D.drawBuddy(ctx, st.buddy.id, cw / 2 - 12, -ch / 2 + 16, G.t, 0.9);
    ctx.restore();
  });
}

}

// —— 结算页 ——
function drawResult() {
  const r = G.result;
  const t = (PF.now() - G.resultAt) / 1000;
  ctx.fillStyle = 'rgba(10,6,5,0.9)';
  ctx.fillRect(-50, -50, F.w + 100, F.h + 100);
  const pop = easeOutBack(clamp(t / 0.25, 0, 1));
  ctx.save();
  ctx.translate(F.w / 2, 150);
  ctx.scale(pop, pop);
  if (r.win) {
    ctx.save();
    ctx.rotate(G.t);
    ctx.fillStyle = 'rgba(255,214,90,0.22)';
    D.star(ctx, 0, 0, 120, 40, 14);
    ctx.restore();
    bigText(ctx, '守住了！', 0, -10, 46, D.P.gold);
    bigText(ctx, '第' + (r.level + 1) + '关', 0, 44, 18, '#fffaf0');
  } else {
    if (r.near) bigText(ctx, '差一点！', 0, -56, 26, D.P.gold);
    bigText(ctx, '还差', -78, 8, 22, '#fffaf0');
    bigText(ctx, '' + r.left, 0, 6, 64, r.near ? D.P.gold : '#ff8a6a');
    bigText(ctx, '节', 70, 8, 22, '#fffaf0');
  }
  ctx.restore();

  // 打碎了多少：一条龙的进度条
  if (!r.win) {
    const bw = 260;
    const bx = F.w / 2 - bw / 2;
    ctx.fillStyle = D.P.line;
    roundRect(ctx, bx - 3, 222, bw + 6, 22, 7);
    ctx.fill();
    ctx.fillStyle = '#3a1410';
    roundRect(ctx, bx, 225, bw, 16, 5);
    ctx.fill();
    ctx.fillStyle = D.P.brass;
    roundRect(ctx, bx, 225, (bw * (r.total - r.left)) / r.total, 16, 5);
    ctx.fill();
    ctx.fillStyle = D.P.brassHi;
    ctx.fillRect(bx + 3, 226, Math.max(0, (bw * (r.total - r.left)) / r.total - 6), 3);
  }

  // 金币
  const gy = r.win && r.newBuddy ? 250 : 282;
  coinIcon(F.w / 2 - 54, gy, 11);
  bigText(ctx, '+' + (r.doubled ? r.gold * 2 : r.gold), F.w / 2 - 36, gy, 26, D.P.gold, D.P.line, 'left');
  const live = t > 0.3;
  if (!r.doubled && G.st.adsUsed < C.AD.maxPerRun) {
    button('double', F.w / 2 + 34, gy - 18, 96, 36, '翻倍', { icon: 'ad', size: 16, color: '#2f6b4a', hi: '#4f9a6c', disabled: !live });
  }

  // 新伙伴
  if (r.win && r.newBuddy) {
    const b = r.newBuddy;
    const bp = easeOutBack(clamp((t - 0.35) / 0.3, 0, 1));
    ctx.save();
    ctx.translate(F.w / 2, 330);
    ctx.scale(bp, bp);
    ctx.fillStyle = D.P.line;
    roundRect(ctx, -120, -38, 240, 76, 12);
    ctx.fill();
    ctx.fillStyle = '#3b2a22';
    roundRect(ctx, -117, -35, 234, 70, 10);
    ctx.fill();
    ctx.fillStyle = D.P.gold;
    ctx.fillRect(-111, -29, 222, 3);
    D.drawBuddy(ctx, b.id, -78, 4, G.t, 2.2);
    bigText(ctx, '新伙伴 ' + b.name, 26, -10, 20, D.P.gold);
    bigText(ctx, b.note, 26, 16, 12, '#fffaf0');
    ctx.restore();
  }

  // 大按钮：再来
  const by = 420;
  button('again', F.w / 2 - 110, by, 220, 66, r.win ? '下一关' : '再守一次', { size: 28, pop: 1 + Math.sin(G.t * 5) * 0.025, disabled: !live });

  // 弩机升级

  if (g.type === 'shield' && src === 'bow') mul = TR.shieldBow;
  if (g.type === 'clay') mul = TR.clay[src] || TR.clay.other;
  if (src === 'pot' || src === 'fire' || src === 'frost') g.noRegen = TR.coreStop;
  g.hp -= dmg * mul;
  if (!QUIET[src] || g.flash <= 0) g.flash = 0.08;
  if (!QUIET[src]) st.events.push({ t: 'hit', x, y, dmg: Math.round(dmg * mul), crit, src, weak: mul > 1, resist: mul < 1, type: g.type });
  if (g.hp <= 0) kill(st, g);
}

function kill(st, g) {
  const i = st.segs.indexOf(g);
  if (i < 0) return;
  st.segs.splice(i, 1);
  st.kills++;
  st.gold += C.GOLD.perKill;
  st.comboTimes.push(st.t);
  st.events.push({ t: 'kill', x: g.x, y: g.y, chest: g.chest, front: i === 0, ram: g.ram, max: g.max, combo: st.comboTimes.length, type: g.type });
  if (g.chest) {
    st.pendingCards++;
    st.events.push({ t: 'chest', x: g.x, y: g.y });
  }
  if (g.type === 'powder') {
    // 火药节：炸伤旁边一片（送分的，盯着它打）
    st.events.push({ t: 'powder', x: g.x, y: g.y, r: TR.powderR });
    const near = st.segs.filter((o) => o.s >= 0 && Math.hypot(o.x - g.x, o.y - g.y) < TR.powderR);
    for (const o of near) damage(st, o, g.max * TR.powderMul, o.x, o.y, false, 'blast');
  }
  if (g.type === 'split') {
    // 分裂节：变成两小节，插回原处
    const hp = Math.max(5, Math.round((g.max * TR.splitHp) / 5) * 5);
    const a = mkSeg(st.nextId++, g.s, hp, 'mini');
    const b = mkSeg(st.nextId++, g.s - C.DRAGON.gap, hp, 'mini');
    a.x = b.x = g.x;
    a.y = b.y = g.y;
    st.segs.splice(i, 0, a, b);
    st.total += 2;
    st.events.push({ t: 'split', x: g.x, y: g.y });
  }
}

const visibleSegs = (st) => st.segs.filter((g) => g.s >= 0 && g.y > 40 && g.y < C.FIELD.gateY);
// 龙最密的地方（霹雳罐、蒸汽龟用）：返回最多 k 个落点，互相隔开
function densest(st, R, k) {
  const vis = visibleSegs(st);
  const scored = vis.map((g) => {
    let n = 0;
    for (const o of vis) if (Math.hypot(o.x - g.x, o.y - g.y) < R) n++;
    return { g, n: n + g.s / 100000 };
  });
  scored.sort((a, b) => b.n - a.n);
  const out = [];
  for (const sc of scored) {
    if (out.every((o) => Math.hypot(o.x - sc.g.x, o.y - sc.g.y) > R * 1.4)) out.push(sc.g);
    if (out.length >= k) break;
  }
  return out;
}

// —— 七件武器 ——
function stepWeapons(st, dt) {
  const m = st.mods;
  const F = C.FIELD;
  const base = m.base;
  const lv = (id) => st.weapons[id] || 0;
  const ready = (id, cd) => {
    st.wcd[id] = (st.wcd[id] === undefined ? cd * 0.4 : st.wcd[id]) - dt;
    if (st.wcd[id] > 0) return false;
    st.wcd[id] += cd;
    return true;
  };
  const vis = visibleSegs(st);

  // 回旋刃：往上飞、飞回来，一路穿透，不怕盾
  const bl = lv('blade');
  if (bl && ready('blade', W.blade.cd * (bl >= 3 ? 0.72 : 1))) {
    const offs = bl >= 5 ? [-46, 0, 46] : [0];
    for (const o of offs) st.blades.push({ x: clamp(st.px + o, 16, F.w - 16), y: F.playerY - 30, vy: -470, back: false, hit: {}, r: bl >= 2 ? 17 : 12, dmg: base * W.blade.dmg * (bl >= 4 ? 1.5 : 1), rot: 0, flown: 0 });
    st.events.push({ t: 'bladeThrow' });
  }
  for (let i = st.blades.length - 1; i >= 0; i--) {
    const b = st.blades[i];
    b.rot += dt * 22;
    if (!b.back) {
      b.y += b.vy * dt;
      b.flown += -b.vy * dt;
      if (b.y < 30 || b.flown > 600) {
        b.back = true;
        b.hit = {};
      }
    } else {
      b.y += 520 * dt;
      b.x += clamp(st.px - b.x, -260 * dt, 260 * dt);
      if (b.y > F.playerY - 24) {
        st.blades.splice(i, 1);
        continue;
      }
    }
    for (const g of st.segs) {
      if (g.s < 0 || b.hit[g.id] || phased(st, g)) continue;
      if (Math.abs(g.x - b.x) < b.r + g.r && Math.abs(g.y - b.y) < b.r + g.r) {
        b.hit[g.id] = 1;
        damage(st, g, b.dmg, g.x, g.y, false, 'blade');
      }
    }
  }

  // 霹雳罐：抛到龙最密的地方，炸开 + 地上留火
  const pl = lv('pot');
  if (pl && ready('pot', W.pot.cd)) {
    const R = 46 + (pl >= 2 ? 14 : 0);
    const tg = densest(st, R, pl >= 5 ? 3 : 1);
    tg.forEach((g, k) => st.pots.push({ x0: st.px, y0: F.playerY - 30, tx: g.x, ty: g.y, target: g.id, t: -k * 0.12, T: 0.6, R, dmg: base * W.pot.dmg * (pl >= 4 ? 1.5 : 1), burn: 2 + (pl >= 3 ? 1.5 : 0) }));
    if (tg.length) st.events.push({ t: 'potThrow' });
  }
  for (let i = st.pots.length - 1; i >= 0; i--) {
    const p = st.pots[i];
    p.t += dt;
    const g = st.segs.find((o) => o.id === p.target);
    if (g) {
      p.tx = g.x;
      p.ty = g.y;
    }
    if (p.t >= p.T) {
      st.pots.splice(i, 1);
      st.events.push({ t: 'potBoom', x: p.tx, y: p.ty, r: p.R });
      st.fires.push({ x: p.tx, y: p.ty, r: p.R * 0.85, t: p.burn, max: p.burn, dps: base * W.pot.burn });
      const near = st.segs.filter((o) => o.s >= 0 && Math.hypot(o.x - p.tx, o.y - p.ty) < p.R);
      for (const o of near) damage(st, o, p.dmg, o.x, o.y, false, 'pot');
    }
  }
  for (let i = st.fires.length - 1; i >= 0; i--) {
    const f = st.fires[i];
    f.t -= dt;
    if (f.t <= 0) {
      st.fires.splice(i, 1);
      continue;
    }
    for (const g of st.segs.slice()) if (g.s >= 0 && Math.hypot(g.x - f.x, g.y - f.y) < f.r) damage(st, g, f.dps * dt, g.x, g.y, false, 'fire');
  }

  // 雷链：劈最前面一节，沿着龙身往后跳
  const cl = lv('chain');
  if (cl && vis.length && ready('chain', W.chain.cd * (cl >= 3 ? 0.75 : 1))) {
    const hops = cl >= 5 ? vis.length : 4 + (cl >= 2 ? 2 : 0) + (cl >= 4 ? 2 : 0);
    const hitList = vis.slice(0, hops);
    const pts = [{ x: st.px, y: F.playerY - 40 }].concat(hitList.map((g) => ({ x: g.x, y: g.y })));
    st.events.push({ t: 'chain', pts, evo: cl >= 5 });
    for (const g of hitList) damage(st, g, base * W.chain.dmg, g.x, g.y, false, 'chain');
  }

  // 寒气筒：冻住前几节，龙变慢；冻住的不回血
  const fl = lv('frost');
  if (st.frostT > 0) st.frostT -= dt;
  if (st.freezeT > 0) st.freezeT -= dt;
  if (fl && vis.length && ready('frost', W.frost.cd)) {
    const k = 4 + (fl >= 3 ? 3 : 0);
    const dur = 1.6 + (fl >= 2 ? 0.8 : 0);
    const list = fl >= 5 ? vis : vis.slice(0, k);
    st.frostT = dur;
    st.frostSlow = fl >= 4 ? 0.4 : 0.55;
    if (fl >= 5) st.freezeT = 1.5;
    st.events.push({ t: 'frost', pts: list.map((g) => ({ x: g.x, y: g.y })), evo: fl >= 5 });
    for (const g of list) {
      g.frozT = dur;
      damage(st, g, base * W.frost.dmg, g.x, g.y, false, 'frost');
    }
  }

  // 千斤锤：大锤砸最前面一节
  const hl = lv('hammer');
  if (hl && vis.length && ready('hammer', W.hammer.cd * (hl >= 3 ? 0.75 : 1))) {
    const dmg = base * W.hammer.dmg * (1 + (hl >= 2 ? 0.4 : 0) + (hl >= 4 ? 0.4 : 0));
    const tg = vis.slice(0, hl >= 5 ? 3 : 1);
    tg.forEach((g, k) => st.hammers.push({ target: g.id, x: g.x, y: g.y, t: -k * 0.14, T: 0.35, dmg, push: hl >= 5 && k === tg.length - 1 }));
  }
  for (let i = st.hammers.length - 1; i >= 0; i--) {
    const h = st.hammers[i];
    h.t += dt;
    const g = st.segs.find((o) => o.id === h.target);
    if (g) {
      h.x = g.x;
      h.y = g.y;
    }
    if (h.t >= h.T) {
      st.hammers.splice(i, 1);
      st.events.push({ t: 'hammer', x: h.x, y: h.y, push: h.push });
      if (g) damage(st, g, h.dmg, h.x, h.y, false, 'hammer');
      for (const o of st.segs.slice()) if (o !== g && o.s >= 0 && Math.hypot(o.x - h.x, o.y - h.y) < 36) damage(st, o, h.dmg * 0.35, o.x, o.y, false, 'hammer');
      if (h.push) {
        for (const o of st.segs) o.s -= C.DRAGON.gap * 0.4;
        placeSegs(st);
      }
    }
  }

  // 照妖灯：头顶一道光柱一直烧；照到的幽影变实
  const ll = lv('lamp');
  if (ll) {
    let w = 12 + (ll >= 2 ? 6 : 0) + (ll >= 4 ? 6 : 0);
    let x = st.px;
    if (ll >= 5) {
      w *= 1.8;
      x = clamp(st.px + Math.sin(st.t * 2.2) * 44, 10, F.w - 10);
    }
    st.beam = { x, w, lv: ll };
    const dps = base * W.lamp.dmg * (ll >= 3 ? 1.5 : 1);
    for (const g of st.segs.slice()) {
      if (g.s < 0 || g.y > F.playerY - 30 || Math.abs(g.x - x) > w / 2 + g.r) continue;
      g.litT = 0.2;
      damage(st, g, dps * dt, g.x, g.y, false, 'lamp');
    }
  } else st.beam = null;
}

function fire(st) {
  const m = st.mods;
  const n = m.n;
  const step = n > 1 ? Math.min(C.BOW.spreadDeg, 70 / (n - 1)) : 0;
  for (let i = 0; i < n; i++) {
    const deg = (i - (n - 1) / 2) * step;
    const a = (-90 + deg) * (Math.PI / 180);
    st.bullets.push({ id: st.nextBulletId++, x: st.px + Math.cos(a) * 10, y: C.FIELD.playerY - 26, vx: Math.cos(a) * C.BOW.speed, vy: Math.sin(a) * C.BOW.speed, pierce: m.pierce, last: -1 });
  }
  st.events.push({ t: 'shoot' });
}

function step(st, dtReal, targetX) {
  if (st.mode !== 'play') return;
  let dt = dtReal;
  if (st.lever.offer > 0) {
    st.lever.offer -= dtReal;
    dt *= C.AD.leverSlow;
    if (st.lever.offer <= 0) {
      st.lever.offer = 0;
      st.lever.used = true;
    }
  }
  st.t += dt;
  const F = C.FIELD;
  const m = st.mods;

  // 阿铸走过去（有上限，免得瞬移）
  if (typeof targetX === 'number') {
    const tx = clamp(targetX, 18, F.w - 18);
    const maxMove = 1500 * dtReal;
    st.px += clamp(tx - st.px, -maxMove, maxMove);
  }

  // 放箭
  st.fireCd -= dt;
  while (st.fireCd <= 0) {
    fire(st);
    st.fireCd += m.interval;
  }

  // 龙往前爬：只有最前面那节自己走，后面的追前一节；中间断了，后半截追上来
  const v = speedNow(st);
  const gap = C.DRAGON.gap;
  for (let i = 0; i < st.segs.length; i++) {
    const g = st.segs[i];
    if (i === 0) g.s += v * dt;
    else {
      const target = st.segs[i - 1].s - gap;
      if (g.s >= target) g.s = target;
      else g.s = Math.min(target, g.s + (v + C.DRAGON.catchUp) * dt);
    }
    if (g.flash > 0) g.flash -= dtReal;
    if (g.litT > 0) g.litT -= dt;
    if (g.frozT > 0) g.frozT -= dt;
    // 墨核节：没被烧、没被冻就回血
    if (g.type === 'core') {
      if (g.noRegen > 0) g.noRegen -= dt;
      else if (g.hp < g.max) {
        g.hp = Math.min(g.max, g.hp + g.max * TR.coreRegen * dt);
        g.regenFx -= dt;
        if (g.regenFx <= 0 && g.y > 0) {
          g.regenFx = 0.7;
          st.events.push({ t: 'regen', x: g.x, y: g.y });
        }
      }
    }
    // 第一次看见某个兵种：告诉画面（弹一张「怕什么」的小牌）
    if (g.type !== 'basic' && g.type !== 'mini' && !st.seenTypes[g.type] && g.s > 0 && g.y > 60) {
      st.seenTypes[g.type] = 1;
      st.events.push({ t: 'newType', type: g.type });
    }
  }
  placeSegs(st);

  // 箭
  for (let b = st.bullets.length - 1; b >= 0; b--) {
    const u = st.bullets[b];
    u.x += u.vx * dt;
    u.y += u.vy * dt;
    let dead = u.x < 4 || u.x > F.w - 4 || u.y < 0 || u.y > F.h;
    if (!dead) {
      for (let k = 0; k < st.segs.length; k++) {
        const g = st.segs[k];
        if (g.s < 0 || g.id === u.last || phased(st, g)) continue;
        const R = g.r + C.BOW.r;
        const dx = g.x - u.x;
        const dy = g.y - u.y;
        if (dx * dx + dy * dy < R * R) {
          damage(st, g, m.dmg, u.x, u.y, false, 'bow');
          if (u.pierce > 0) {
            u.pierce--;
            u.last = g.id;
          } else dead = true;
          break;
        }
      }
    }
    if (dead) st.bullets.splice(b, 1);
  }

  stepWeapons(st, dt);
  if (st.pal) stepBuddy(st, dt);
  if (st.slowT > 0) st.slowT -= dt;

  // 连碎
  while (st.comboTimes.length && st.comboTimes[0] < st.t - 1) st.comboTimes.shift();
  const c = st.comboTimes.length;
  if (c >= 5 && c >= st.comboShown + 5) {
    st.comboShown = c;
    st.events.push({ t: 'combo', n: c });
  }
  if (c < 3) st.comboShown = 0;

  // 赢
  if (st.segs.length === 0) {
    st.mode = 'win';
    st.endT = st.t;
    st.gold += C.GOLD.winBase + C.GOLD.winPerLevel * st.level;
    st.events.push({ t: 'win' });
    return;
  }

  const front = st.segs[0];
  const left = st.path.len - front.s;
  st.danger = left < gap * 4 ? 1 - left / (gap * 4) : 0;

  // 拉总闸：龙头离终点只剩一节时亮一次
  if (!st.lever.used && st.lever.offer === 0 && st.adsUsed < C.AD.maxPerRun && left < gap * 1.3) {
    st.lever.offer = C.AD.leverWindow;
    st.events.push({ t: 'lever' });
  }

  // 输
  if (front.s >= st.path.len) {
    st.mode = 'lose';
    st.endT = st.t;
    st.lever.offer = 0;
    st.nearMiss = C.isNearMiss(st.segs.length, st.total);
    st.events.push({ t: 'lose', left: st.segs.length });
    return;
  }

  // 开机关匣：停下来三选一
  if (st.pendingCards > 0) openCards(st);
}

// —— 机关伙伴：三只三种打法 ——
const segById = (st, id) => st.segs.find((g) => g.id === id);
const visible = (st) => st.segs.filter((g) => g.s >= 0 && g.y > 50);
function moveTo(p, x, y, v, dt) {
  const dx = x - p.x;
  const dy = y - p.y;
  const d = Math.hypot(dx, dy);
  if (d <= v * dt || d < 1) {
    p.x = x;
    p.y = y;
    return true;
  }
  p.x += (dx / d) * v * dt;
  p.y += (dy / d) * v * dt;
  p.fx = dx / d;
  return false;
}
function stepBuddy(st, dt) {
  const b = st.buddy;
  const p = st.pal;
  const homeX = clamp(st.px + (b.id === 'gui' ? -48 : 36), 16, C.FIELD.w - 16);
  const homeY = C.FIELD.playerY + (b.id === 'que' ? -26 : b.id === 'gui' ? 14 : 16);
  const m = st.mods;
  if (b.id === 'que') {
    if (p.state === 'home') {
      moveTo(p, homeX, homeY, 900, dt);
      p.cd -= dt;
      if (p.cd <= 0) {
        const vis = visible(st);
        const chests = vis.filter((g) => g.chest);
        // 先挑最靠前的机关匣；没有就挑最硬的那节
        const g = chests.length ? chests[0] : vis.reduce((a, o) => (!a || o.hp > a.hp ? o : a), null);
        if (g) {
          p.state = 'fly';
          p.target = g.id;
          st.events.push({ t: 'palGo', x: p.x, y: p.y });
        } else p.cd = 0.3;
      }
    } else if (p.state === 'fly') {
      const g = segById(st, p.target);
      if (!g) p.state = 'back';
      else if (moveTo(p, g.x, g.y - 12, b.fly, dt)) {
        p.state = 'peck';
        p.n = b.pecks;
        p.t = 0;
      }
    } else if (p.state === 'peck') {
      const g = segById(st, p.target);
      if (!g) p.state = 'back';
      else {
        p.x = g.x;
        p.y = g.y - 12;
        p.t -= dt;
        if (p.t <= 0) {
          p.t = 0.08;
          p.n--;
          st.events.push({ t: 'peck', x: g.x, y: g.y, chest: g.chest });
          damage(st, g, m.base * b.peckDmg * (g.chest ? b.chestMul : 1), g.x, g.y - 6, false, "pal");
          if (p.n <= 0) p.state = 'back';
        }
      }
    } else if (p.state === 'back') {
      if (moveTo(p, homeX, homeY, b.fly, dt)) {
        p.state = 'home';
        p.cd = b.cd;
      }
    }
  } else if (b.id === 'quan') {
    if (p.state === 'home') {
      p.x = homeX;
      p.y = homeY;
      p.cd -= dt;
      const g = st.segs[0];
      if (p.cd <= 0 && g && g.s >= 0 && g.y > 60) {
        p.state = 'leap';
        p.t = 0;
        p.sx = p.x;
        p.sy = p.y;
        st.events.push({ t: 'palGo', x: p.x, y: p.y });
      }
    } else if (p.state === 'leap' || p.state === 'back') {
      const T = 0.32;
      p.t += dt;
      const u = Math.min(1, p.t / T);
      const g = st.segs[0];
      // 往前扑：落点跟着龙头；跳回来：落回阿铸身边
      const tx = p.state === 'leap' ? (g ? g.x : p.sx) : homeX;
      const ty = p.state === 'leap' ? (g ? g.y : p.sy) : homeY;
      p.x = p.sx + (tx - p.sx) * u;
      p.y = p.sy + (ty - p.sy) * u - Math.sin(u * Math.PI) * 70;
      p.fx = tx < p.sx ? -1 : 1;
      if (u >= 1) {
        if (p.state === 'leap') {
          if (g) {
            const push = b.push * C.DRAGON.gap;
            st.events.push({ t: 'bite', x: g.x, y: g.y });
            damage(st, g, m.base * b.biteDmg, g.x, g.y, false, "pal");
            for (const o of st.segs) o.s -= push;
            placeSegs(st);
          }
          p.state = 'back';
          p.t = 0;
          p.sx = p.x;
          p.sy = p.y;
        } else {
          p.state = 'home';
          p.cd = b.cd;
        }
      }
    }
  } else if (b.id === 'gui') {
    p.x = homeX;
    p.y = homeY;
    p.cd -= dt;
    if (p.recoil > 0) p.recoil -= dt;
    if (p.cd <= 0) {
      // 往龙最密的地方打；一样密就打离城门近的
      const vis = visible(st);
      let best = null;
      let bestN = 0;
      for (const g of vis) {
        let n = 0;
        for (const o of vis) if (Math.hypot(o.x - g.x, o.y - g.y) < b.shellR) n++;
        if (n > bestN || (n === bestN && best && g.s > best.s)) {
          best = g;
          bestN = n;
        }
      }
      if (best) {
        st.shells.push({ x0: p.x, y0: p.y - 14, tx: best.x, ty: best.y, target: best.id, t: 0, T: b.flight });
        st.events.push({ t: 'mortar', x: p.x, y: p.y - 14 });
        p.cd = b.cd;
        p.recoil = 0.25;
      } else p.cd = 0.3;
